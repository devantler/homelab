# Container image signature verification (Talos 1.13+, ImageVerificationConfig).
#
# STATUS — Talos evaluates these rules on this cluster.
# Talos v1.13 verifies images ITSELF. There is no external verifier binary, and
# containerd's `io.containerd.image-verifier.v1.bindir` plugin is not the
# mechanism here. `security.ImageVerificationConfigController` materialises each
# rule below into an `ImageVerificationRules.security.talos.dev` resource on
# every node, and `security.TUFTrustedRootController` maintains the Sigstore TUF
# trust root that keyless verification needs.
#
# A matched rule DOES produce a verification decision, and containerd records
# it per image as a `talos.dev/verified` label. The label tracks rule MATCH,
# not signedness: `ghcr.io/fluxcd/*` and `ghcr.io/cloudnative-pg/*` are
# cosign-signed upstream and never carry it, because no rule below names them.
# Measured 2026-08-26 across all 7 nodes: 755 of 755 cached
# `ghcr.io/devantler-tech/*` images carry the label, and 0 of 1299 cached
# images with a resolvable non-first-party repository name do — no exceptions.
#
# What is NOT established is the REFUSAL. Every first-party image pulled here
# has PASSED, so a FAILING decision has never been observed to block a pull.
# Proving that refusal is #3336. The original finding is #2856.
#
# Check this, do not assume it. The repository cannot answer it — the rules read
# as correct whether or not anything evaluates them:
#     scripts/validate-image-verifier-liveness.sh
# Measured 2026-08-24: 7 of 7 nodes hold running rules and a running trust root.
#
# BEFORE ACTIVATING (#3101): a matched image that fails verification is
# EXPECTED to be refused, so any first-party image that is running yet unsigned
# should enter ImagePullBackOff the moment it is next pulled. That refusal is
# exactly what #3336 exists to prove and has not been observed here, so treat it
# as the risk to design around rather than as a settled outcome.
# Enumerate the running first-party digests and confirm each carries a cosign
# signature — attestations alone do not satisfy the catch-all rule below — then
# sign or scope the rule off any that do not.
#
# Enumerated 2026-08-26 — of the four first-party images running on the
# cluster, ksail and provider-upjet-unifi verify against the exact keyless
# identity their rules require. wedding-app and ascoachingogvaner are PRIVATE
# packages: an unauthenticated cosign verify returns DENIED, which is an ACCESS
# result and NOT evidence that a signature is absent. Settling those two needs
# an AUTHENTICATED read, and this repository already stages one: the
# `🔑 Stage the GHCR pull credential` step in
# .github/workflows/validate-image-verifier-liveness.yaml decrypts the cluster's
# own Flux GHCR pull credential into DOCKER_CONFIG before it runs
# scripts/inventory-first-party-image-signatures.sh, so no ADDITIONAL
# `read:packages` token has to be minted. What is missing is a recorded RUN of
# that authenticated inventory against the fleet — the newest run of that
# workflow (2026-08-11) executed only its unit-test job — so until one is on
# record their signature state stays UNKNOWN, and they are the two images the
# catch-all rule governs.
#
# Declares the cosign signatures required at the containerd PULL layer on
# every node — a defense-in-depth complement to the GitOps-source
# verification Flux already performs on OCI *manifest* artifacts (apps'
# sync.yaml verify.provider: cosign). This gates the actual container-image
# bytes containerd pulls, which
# Flux and the Kyverno admission layer never see (e.g. kubelet-managed static
# pods, a compromised registry serving a tampered image).
#
# Scope: FIRST-PARTY images (ghcr.io/devantler-tech/*). All are keyless-cosign
# signed, but by FOUR different signing identities, so they need four rules:
#   1. ghcr.io/devantler-tech/ksail — the ksail-operator image — is signed by
#      ksail's OWN release pipeline (devantler-tech/ksail .github/workflows/
#      cd.yaml; see that repo's GoReleaser `docker_signs` step), at a release tag.
#   2. ghcr.io/devantler-tech/provider-upjet-* — the Crossplane provider packages
#      — are signed by each provider repo's own publish-provider-package.yml, at
#      a release tag (that workflow rejects any non-tag ref).
#   3. ghcr.io/devantler-tech/platform-kubescape-storage — the compatibility
#      image — is signed by this repository's dedicated main-only
#      publish-kubescape-storage-hotfix.yaml workflow.
#   4. the app images (wedding-app, ascoachingogvaner, …) are signed by the
#      shared publish-app.yaml workflow in devantler-tech/actions, pinned by
#      commit SHA — the SAME form their Flux OCIRepository verify blocks and the
#      verify-app-images ImageValidatingPolicy pin (#3022).
# Talos evaluates rules in order, first match wins, so the three specific rules
# MUST precede the ghcr.io/devantler-tech/* catch-all.
#
# FAIL-OPEN by design for everything else: an image matching NO rule is pulled
# WITHOUT verification, so third-party chart images (Cilium, Longhorn, Coroot,
# registry.k8s.io control-plane images, …) are unaffected — this is
# intentionally NOT a deny-all-unsigned control. The converse — an image that
# DOES match a rule but fails verification is blocked (ImagePullBackOff) — is
# what these rules describe, and takes effect only once a verifier binary is
# installed (see STATUS above).
#
# A rule over a system registry (e.g. registry.k8s.io/*, the canonical Talos
# example) would gate control-plane/etcd image pulls — high blast radius on
# this cluster given the manual-talosctl recovery path — so it is deliberately
# omitted for now and can be added later once the first-party rules are proven.
#
# This does NOT satisfy kubescape C-0237 (see
# k8s/bases/infrastructure/cluster-security-exceptions/image-verification.yaml): that
# control scans workload image refs at the cluster layer, cannot observe Talos
# node-level verification, and still fails while unsigned third-party images run.
#
# Reference:
#   https://docs.siderolabs.com/talos/v1.13/reference/configuration/security/imageverificationconfig/
apiVersion: v1alpha1
kind: ImageVerificationConfig
rules:
  # ksail-operator image — signed by ksail's OWN release pipeline (cd.yaml),
  # a different keyless identity than publish-app.yaml. MUST precede the
  # catch-all below (first-match-wins). Requires ksail >= the first release
  # that ships the GoReleaser docker_signs cosign step (devantler-tech/ksail
  # #5165) AND the ksail-operator HelmRelease pinned to that signed image tag.
  # The ref is pinned to the release-tag GRAMMAR, not merely to `v*`: cd.yaml
  # signs on any `v*` tag push and checks nothing about the tag itself, so a
  # `v.+` ref clause would accept refs/tags/vanything and refs/tags/v/../evil,
  # which are tags in shape only. The grammar is the same OCI-semver form as
  # the provider identity below, carries the same DELIBERATE no-length-cap
  # difference (pinned by the inventory test), and is kept byte-identical to
  # the Kyverno attestor by that test. The publisher's own check is tracked at
  # devantler-tech/ksail#6895.
  - image: ghcr.io/devantler-tech/ksail*
    keyless:
      issuer: https://token.actions.githubusercontent.com
      subjectRegex: ^https://github\.com/devantler-tech/ksail/\.github/workflows/cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
  # Crossplane PROVIDER package images (ghcr.io/devantler-tech/provider-upjet-*)
  # are signed by each provider repo's OWN publish-provider-package.yml — a
  # different keyless identity than publish-app.yaml, because the upstream
  # crossplane-contrib publish reusable workflow can't run publish-app.yaml.
  # Mirrors the verify-app-images ImageValidatingPolicy provider-upjet-*
  # attestor (#2382). MUST precede the catch-all below (first-match-wins) or the
  # catch-all's publish-app.yaml identity rejects these (ImagePullBackOff).
  # The ref is pinned to release tags: publish-provider-package.yml rejects
  # any non-tag ref before it checks anything out, so a v* tag is the sole
  # legitimate signing ref. Pinning it rejects a package signed from an
  # arbitrary branch, which an unconstrained ref accepts.
  # The tag grammar mirrors the publisher's `scripts/release-version.sh` OCI-semver
  # grammar, spelled out here rather than deferred to it: this verifier is the
  # independent half of that pair, so it must not inherit its boundary from the
  # repository it verifies.
  # A trailing `.+` after the version would accept refs/tags/v1latest and
  # refs/tags/v1.0.0/../evil, which are tags only in shape.
  # DELIBERATE DIFFERENCE from the publisher, pinned by the inventory test: that script also
  # caps the tag at 128 characters (the OCI tag-length limit); this expression does not.
  # RE2 has no lookahead, so a joint length bound across the version components cannot be
  # expressed without bounding each part separately, and a bound set too tight would REJECT a
  # legitimate release — breaking admission of a real image, which is strictly worse than
  # admitting an identity that cannot exist. An over-length tag is not a valid OCI reference,
  # so no signature can carry one.
  - image: ghcr.io/devantler-tech/provider-upjet-*
    keyless:
      issuer: https://token.actions.githubusercontent.com
      subjectRegex: ^https://github\.com/devantler-tech/provider-upjet-[a-z0-9-]+/\.github/workflows/publish-provider-package\.yml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
  # Kubescape storage compatibility image — signed by this repository's
  # dedicated main-only publisher. This exact repository rule must precede the
  # first-party catch-all: Talos evaluates the first matching rule, and the
  # generic app publisher did not produce this image.
  - image: ghcr.io/devantler-tech/platform-kubescape-storage
    keyless:
      issuer: https://token.actions.githubusercontent.com
      subjectRegex: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kubescape-storage-hotfix\.yaml@refs/heads/main$
  # First-party APP images signed by the shared publish-app.yaml workflow in
  # devantler-tech/actions. Callers pin that reusable workflow by commit SHA, so
  # the ref admits that form alone and rejects everything else — a mutable ref
  # such as @main, and a release tag (#3022). Same shape as the apps' Flux
  # OCIRepository verify blocks and the verify-app-images ImageValidatingPolicy.
  - image: ghcr.io/devantler-tech/*
    keyless:
      issuer: https://token.actions.githubusercontent.com
      subjectRegex: ^https://github\.com/devantler-tech/actions/\.github/workflows/publish-app\.yaml@[0-9a-f]{40}$
