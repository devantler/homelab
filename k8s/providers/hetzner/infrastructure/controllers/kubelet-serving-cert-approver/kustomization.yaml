---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # HA variant (was standalone-install.yaml, replicas: 1). Coroot flagged the
  # sole replica "single instance - not resilient to node failure". Upstream
  # ships a dedicated ha-install.yaml that is the supported way to run this
  # controller HA: it sets replicas: 2, adds `--enable-leader-election` to the
  # `serve` container args, ships the coordination.k8s.io/leases Role+RoleBinding
  # the leader-election lock needs, and a REQUIRED hostname podAntiAffinity so
  # the 2 replicas land on different nodes. So 2 replicas = one active CSR
  # approver + a warm standby that takes over on a node drain/failure, not two
  # active approvers. The standalone PDB (pod-disruption-budget.yaml) makes the
  # node drain-safe (maxUnavailable: 1).
  #
  # Vendored without changing upstream document bytes apart from reviewed
  # Checkov annotations. The updater pins an immutable source commit and SHA-256;
  # Renovate tracks its version there. Re-vendor the whole bundle on a bump and
  # re-check the standalone PDB selector against the upstream pod labels.
  - namespace.yaml
  - service-account.yaml
  - role.yaml
  - cluster-role-certificates.yaml
  - cluster-role-events.yaml
  - role-binding-events.yaml
  - role-binding-leader-election.yaml
  - cluster-role-binding.yaml
  - service.yaml
  - deployment.yaml
  - cilium-network-policy.yaml
  - pod-disruption-budget.yaml
# Pin the operator image by digest here, not in the vendored deployment.yaml: those bytes must stay
# upstream's, and upstream v0.11.1 showed they can name a moving tag with imagePullPolicy: Always
# (#3515). Renders as `:<newTag>@<digest>`, so the kubelet pulls this digest whatever the tag points
# at. The tag and digest must equal the updater's cert_approver_version and cert_approver_image_digest;
# scripts/guard-cert-approver-image-pin.sh enforces that in CI, and the updater re-resolves the digest
# from the registry on every refresh.
images:
  - name: ghcr.io/alex1989hu/kubelet-serving-cert-approver
    newTag: 0.12.0
    digest: sha256:534e40a0050c34bda2a7bae53aa9c11133704f23dc83fee14f3b45b0f1eabe45
