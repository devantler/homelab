---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  # The Longhorn CSI snapshotter sidecar (enabled via
  # longhorn_csi_snapshotter_replicas) needs the snapshot.storage.k8s.io CRDs to
  # exist or it crash-loops. Gate Longhorn on the snapshot-controller (which
  # installs those CRDs) so the sidecar never starts before they are present.
  dependsOn:
    - name: snapshot-controller
      namespace: kube-system
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 10m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  timeout: 10m
  # https://github.com/longhorn/charts/blob/master/charts/longhorn/values.yaml
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      # Match the number of workers so every volume is replicated across
      # all available nodes.
      defaultReplicaCount: ${longhorn_replica_count:=3}
      # Redistribute replicas onto fresh nodes as the worker pool changes.
      # With auto-balance disabled (the Longhorn default), a worker roll — the
      # cx33→cx43 server-type migration, a Talos version bump, or autoscaler
      # churn — deletes each replaced node's replicas without ever rebuilding
      # them onto the replacement node. With only a handful of storage nodes
      # a one-at-a-time roll then walks every replica of an RWO volume onto
      # already-removed nodes before any rebuild catches up, and the volume
      # goes `faulted` (data loss). Observed 2026-06-16: umami-db, wedding-db
      # and kubescape storage all faulted during a full worker roll.
      # best-effort keeps replicas spread evenly across the live nodes
      # (matching defaultReplicaCount above), so each step of a rolling
      # replacement rebuilds redundancy onto the new node and always leaves a
      # healthy replica behind. (Use least-effort if rebuild churn on frequent
      # autoscaler scale-ups becomes a concern.)
      replicaAutoBalance: best-effort
      # Reclaim orphaned replica DIRECTORIES, not just deleted volumes. Longhorn
      # detects replica data left behind on disk (an Orphan CR per directory,
      # DataCleanable=True) but with this setting empty — the chart default — it
      # never deletes any of it. Autoscaler scale-downs and worker rolls produce
      # these steadily, so a storage node accumulates dead directories until it
      # crosses storage-minimal-available-percentage (25%) and its disk flips to
      # Schedulable=False (DiskPressure).
      #
      # That is not cosmetic: replica-soft-anti-affinity is false (hard
      # anti-affinity), so with three storage nodes every replica of a
      # 3-replica volume needs a distinct node. One node under the threshold
      # means a degraded volume can NEVER rebuild — it sits at
      # ReplicaSchedulingFailure indefinitely rather than recovering. Measured on
      # prod 2026-08-16: 16 orphan directories, 14 of them on prod-worker-1,
      # which sat at 24% available and DiskPressure while two CNPG databases
      # stayed stuck at 2 of 3 replicas (#3201).
      #
      # replica-data is the only type that reclaims disk; orphaned instances are
      # runtime processes and are deliberately not swept here.
      orphanResourceAutoDeletion: replica-data
      # Reclaim space from deleted volumes automatically.
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      # Only create default disks on nodes explicitly labeled for storage.
      # This prevents control plane nodes (which lack dedicated volumes)
      # from hosting replicas and running out of memory.
      createDefaultDiskOnLabeledNodesOnly: true
      # Restrict Longhorn system-managed pods (instance-managers, etc.)
      # to storage nodes. Prevents ~100Mi overhead per non-storage node.
      systemManagedComponentsNodeSelector: "node.longhorn.io/create-default-disk:true"
      # Tell Longhorn this cluster runs the Cluster Autoscaler: Longhorn then
      # annotates its system-managed per-node pods (instance-managers, etc.)
      # as safe-to-evict where no replica pins them, so the autoscaler can
      # drain and remove an under-utilized node instead of treating every
      # Longhorn pod as an unevictable blocker. Without this, any node that
      # ever ran an instance-manager was permanently unremovable (part of the
      # 2026-06-30 stuck-autoscale-node ratchet). Data safety is unchanged —
      # Longhorn still refuses to evict a pod that hosts the last healthy
      # replica; pair with the restrict-storage-to-baseline-workers policy
      # (cluster-policies/) which keeps replicas off autoscale nodes entirely.
      kubernetesClusterAutoscalerEnabled: true
      # Rebuild degraded replicas of DETACHED volumes too. A volume can sit
      # detached for long stretches (an app scaled down or disabled, or a PVC
      # between pod reschedules); when an autoscaled node holding a replica
      # leaves, that replica stays degraded indefinitely because normal rebuilds
      # only run while attached (observed 2026-06-10: a detached app volume at
      # 2/3 replicas, plus nightly Velero CSI-snapshot DataUploads timing out
      # against it). Longhorn briefly attaches the volume in maintenance mode,
      # rebuilds, and detaches again.
      offlineReplicaRebuilding: true
      # Engine->replica gRPC timeout. Raised from the 8s chart default to the
      # 30s maximum after live prod saw otherwise-healthy replicas declared
      # `in error` during transient node/CNI churn, causing Faulted -> rebuild
      # -> recover loops and noisy Longhorn events. Longhorn caps this setting
      # at 30s.
      engineReplicaTimeout: "30"

    persistence:
      # The chart-managed `longhorn` StorageClass uses volumeBindingMode: Immediate,
      # binding a PVC (and provisioning its Longhorn volume) BEFORE the consuming pod
      # is scheduled — which strands stateful pods on whatever node the volume landed
      # on (incl. autoscaler overflow nodes) and defeats scale-down. So the cluster
      # default is now the sibling `longhorn-wffc` class (WaitForFirstConsumer,
      # storage-class-longhorn-wffc.yaml). This `longhorn` class is KEPT but demoted to
      # non-default so existing PVCs and CNPG clusters that name it still resolve; move
      # workloads onto longhorn-wffc per-workload (reclaimPolicy is Delete — no bulk PVC deletes).
      defaultClass: false
      defaultClassReplicaCount: ${longhorn_replica_count:=3}
      # RWX support via Longhorn's built-in NFS server.
      defaultFsType: ext4
      reclaimPolicy: Delete

    # Resource-conscious settings for cx23 workers (2 vCPU, 4 GB RAM).
    csi:
      attacherReplicaCount: ${longhorn_csi_attacher_replicas:=1}
      provisionerReplicaCount: ${longhorn_csi_provisioner_replicas:=1}
      resizerReplicaCount: ${longhorn_csi_resizer_replicas:=1}
      snapshotterReplicaCount: ${longhorn_csi_snapshotter_replicas:=1}

    # Restrict Longhorn DaemonSets to storage-labeled nodes only.
    # Control planes don't carry disks and no pods on them mount Longhorn
    # volumes — running longhorn-manager there wastes ~250Mi per node.
    longhornManager:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"

    longhornUI:
      replicas: ${longhorn_ui_replicas:=1}
  postRenderers:
    # Pin longhorn-ui's non-root identity in its own spec.
    #
    # This is DEFENCE IN DEPTH, not a posture-score change — do not re-justify it
    # as one. C-0013/C-0016/C-0055 are already suppressed for this workload by the
    # cluster-wide `pod-security-mutations` ClusterSecurityException, so the
    # Kubescape gate reads identically with and without this patch (measured: both
    # trees "All controls passed"). What it buys is a real runtime guarantee: today
    # the container runs non-root only because the image bakes USER nginx
    # (live: uid=499(nginx) gid=486(nginx), no securityContext at all). Nothing
    # enforces that — `longhorn-system` is excluded from the `add-security-context`
    # Kyverno mutation, so no admission control supplies it either. Pinning the
    # identity here FORCES it: because runAsUser is set explicitly, an image that
    # ever ships a root default is launched as uid 499 regardless of its own USER,
    # rather than silently running as root. Note the mechanism — this is an
    # override, NOT a kubelet rejection. runAsNonRoot only refuses a container
    # whose effective user resolves to root, which with an explicit non-zero
    # runAsUser it never does; the refusal path is the backstop that fires if this
    # uid is ever removed or set to 0. So when diagnosing a future chart rollout,
    # the expected failure signal is the container starting as 499 and failing in
    # its own start-up, not an admission-time or kubelet refusal.
    #
    # The chart cannot express this: deployment-ui.yaml renders no securityContext
    # and exposes no `longhornUI.securityContext` value, so a postRenderer is the
    # only route — the same reason origin-ca-issuer patches its resources here.
    #
    # runAsUser is load-bearing and must stay NUMERIC: the image's baked user is
    # the name `nginx`, and the kubelet cannot verify a non-numeric user against
    # runAsNonRoot, so it would refuse the container without an explicit uid.
    #
    # KNOWN LIMIT: if a chart bump ever renames the Deployment, this patch stops
    # applying, and kustomize does not error on a non-matching target — verified:
    # rendering this exact patch against the live Deployment with the target name
    # changed exits 0 and emits the object completely unpatched. The uid is
    # chart-version-coupled for the same reason — revisit both on a major bump.
    #
    # It does NOT go unnoticed, though. This HelmRelease is a member of the pinned
    # EKS authorization surface (document 217 of the rendered membership), so any
    # chart bump moves the aggregate fingerprint and reds that gate, forcing a
    # re-approval — which is exactly the checkpoint where this patch gets
    # re-verified. The gate is the backstop; this comment is the instruction.
    #
    # The three writable paths (/var/cache/nginx, /var/config/nginx, /var/run) are
    # chart-provided emptyDirs and world-writable, so no fsGroup is needed, and
    # nginx listens on 8000, so dropping ALL capabilities costs no bind privilege.
    # readOnlyRootFilesystem is deliberately NOT set: the ui entrypoint renders its
    # nginx config at start-up, so that is a separate (C-0017) question with real
    # breakage risk rather than something to bundle into a non-root change.
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
              spec:
                template:
                  spec:
                    securityContext:
                      # Source-owned C-0211 canary: the UI uses only emptyDir
                      # volumes and sets no fsGroup, so this changes no ownership.
                      fsGroupChangePolicy: OnRootMismatch
                      runAsNonRoot: true
                      runAsUser: 499
                      runAsGroup: 486
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: longhorn-ui
                        securityContext:
                          # Preserve runtime SELinux/MCS label allocation.
                          seLinuxOptions: {}
                          runAsNonRoot: true
                          runAsUser: 499
                          runAsGroup: 486
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop:
                              - ALL
                          seccompProfile:
                            type: RuntimeDefault
