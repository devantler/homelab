---
# Static VerticalPodAutoscalers for kube-system + kyverno (prod/hetzner only).
#
# WHY STATIC (not auto-vpa): `auto-vpa` is a Kyverno *generate* policy, and
# Kyverno's global resourceFilters (`[*/*,kube-system,*]`, `[*/*,kyverno,*]` in
# the kyverno ConfigMap) exclude these two namespaces from ALL Kyverno
# processing — so auto-vpa never creates VPAs there. Narrowing that global
# filter would re-expose both namespaces to EVERY mutate/validate policy (several
# of which don't self-exclude kube-system, e.g. image-signature verification on
# the third-party system images), so the surgical fix is to author the VPA
# objects directly here. VPA's own admission webhook has empty selectors, so it
# injects recommendations into every namespace regardless.
#
# NO PER-WORKLOAD DUPLICATION: the shared updatePolicy + resourcePolicy (which
# mirrors auto-vpa.yaml) is defined ONCE in the patches below and applied to
# every VPA via a kind selector. The per-workload files carry only targetRefs.
#   * base patch  → all VPAs: InPlaceOrRecreate (resize in place, never evict the
#     datapath/admission pods), controlledValues RequestsAndLimits, minAllowed
#     cpu 50m/mem 64Mi, maxAllowed cpu 3/mem 6Gi.
#   * `vpa-tier: daemonset` → tighter maxAllowed cpu 1/mem 1Gi, so a per-node pod
#     still fits the smallest autoscale-cx23 worker.
#   * kyverno-admission-controller → RequestsOnly with a 1Gi memory ceiling, so
#     VPA right-sizes requests without replacing the authored 1Gi safety limit.
#
# GENEROUS MEMORY RATIO (no OOM): the base LimitRanges
# (k8s/bases/{bootstrap,infrastructure}/limit-ranges/) are CPU-only; the parent hetzner
# kustomization patches a generous memory `default` onto them (kube-system 4Gi,
# kyverno 2Gi) so VPA scales the memory limit RATIO-PRESERVING — the request is
# right-sized down to real usage (cilium ~250Mi vs its 512Mi request) while the
# limit stays a generous multiple far above any real peak (<~600Mi), so bursts
# don't OOMKill. CPU is compressible, so its limit only ever throttles.
#
# EVICTION SAFETY: in-place resize means no eviction in the normal path; for the
# Recreate fallback, the eviction-sensitive targets are HA so it is harmless —
# kyverno controllers + coredns run 2 replicas with PDBs (coredns PDB added in
# controllers/coredns/).
#
# longhorn-system is deliberately NOT here: it already has auto-vpa-managed VPAs
# (not globally filtered) and its LimitRange MUST stay memory-unset (the
# instance-manager OOM-cascade safeguard).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cilium-envoy.yaml
  - cilium-operator.yaml
  - cilium.yaml
  - cluster-autoscaler-hetzner-cluster-autoscaler.yaml
  - coredns.yaml
  - descheduler.yaml
  - hcloud-cloud-controller-manager.yaml
  - hcloud-csi-controller.yaml
  - hcloud-csi-node.yaml
  - hubble-relay.yaml
  - hubble-ui.yaml
  - kyverno-admission-controller.yaml
  - kyverno-background-controller.yaml
  - kyverno-cleanup-controller.yaml
  - kyverno-reports-controller.yaml
  - metrics-server.yaml
  - snapshot-controller.yaml
  - tetragon-operator.yaml
  - tetragon.yaml
patches:
  # Shared policy for every system VPA (mirrors auto-vpa.yaml).
  - target:
      kind: VerticalPodAutoscaler
    patch: |
      - op: add
        path: /spec/updatePolicy
        value:
          updateMode: InPlaceOrRecreate
          minReplicas: 1
      - op: add
        path: /spec/resourcePolicy
        value:
          containerPolicies:
            - containerName: "*"
              controlledResources: ["cpu", "memory"]
              controlledValues: RequestsAndLimits
              minAllowed:
                cpu: 50m
                memory: 64Mi
              maxAllowed:
                cpu: "3"
                memory: 6Gi
  # DaemonSets: CPU only — VPA must not manage DaemonSet MEMORY (mirrors the
  # auto-vpa.yaml DaemonSet rule; full rationale there). VPA keeps one usage
  # histogram across all pods of a DaemonSet, so it sizes EVERY node's agent
  # to the busiest node's peak and multiplies that by the node count; that
  # pushed the per-node agent stack to ~3.5Gi ≈ 50% of a cx33's allocatable —
  # exactly the cluster-autoscaler's scale-down utilization threshold — making
  # autoscale nodes unremovable even when empty of movable pods (the
  # 2026-06-30 four-node ratchet). Memory reverts to the authored values in
  # the cilium HelmRelease (agent 512Mi, envoy 64Mi, ...)
  # with the generous kube-system LimitRange memory default (4Gi) as the
  # burst limit. CPU stays managed (compressible, no OOM risk); per-node pods
  # must still fit the smallest autoscale-cx23 worker.
  - target:
      kind: VerticalPodAutoscaler
      labelSelector: vpa-tier=daemonset
    patch: |
      - op: replace
        path: /spec/resourcePolicy/containerPolicies/0/controlledResources
        value: ["cpu"]
      - op: replace
        path: /spec/resourcePolicy/containerPolicies/0/minAllowed
        value:
          cpu: 50m
      - op: replace
        path: /spec/resourcePolicy/containerPolicies/0/maxAllowed
        value:
          cpu: "1"
  # kyverno admission + reports controllers: cap CPU below the hot-loop level.
  # Their leader replicas hot-loop (aggregate-report-controller measured at
  # ~23 no-op reconciles/s, 1.6-2M cumulative; leader steadily burning ~1 CPU
  # while the standby idles), so an uncapped VPA faithfully sizes the whole
  # deployment for the pathology: reports hit 1836m and admission 1168m
  # requests, ~6.2 requested cores across the pairs — which alone tipped the
  # fleet past the static workers and ratcheted FOUR autoscale nodes into
  # existence (the 2026-07-16 snapshot-slot deadlock's other half; same class
  # as the 2026-06-30 DaemonSet ratchet above). CPU is compressible: capping
  # only throttles the degenerate loop, never correctness. Root-cause hunt for
  # the loop itself is tracked on the platform issue referenced in the PR.
  # The reports controller keeps the shared 6Gi memory ceiling. Admission is
  # different: its authored 1Gi limit is the known-safe fail-closed boundary, so
  # its patch also uses RequestsOnly and caps the managed request at that limit.
  - target:
      kind: VerticalPodAutoscaler
      name: kyverno-reports-controller
    patch: |
      - op: replace
        path: /spec/resourcePolicy/containerPolicies/0/maxAllowed
        value:
          cpu: 500m
          memory: 6Gi
  - target:
      kind: VerticalPodAutoscaler
      name: kyverno-admission-controller
    patch: |
      - op: replace
        path: /spec/resourcePolicy/containerPolicies/0/maxAllowed
        value:
          cpu: 800m
          memory: 1Gi
      - op: replace
        path: /spec/resourcePolicy/containerPolicies/0/controlledValues
        value: RequestsOnly
