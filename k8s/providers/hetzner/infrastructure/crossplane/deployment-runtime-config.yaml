---
# Bounded resources for the provider runtime pod (created by Crossplane, so
# the HelmRelease values can't reach it). The empty selector is the documented
# placeholder — Crossplane fills in the real match labels.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-upjet-github
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # validate-pod-security's require-seccomp-profile asserts the POD-level
          # path, and Crossplane's package manager creates this Deployment
          # directly, so the container-level value below does not satisfy it and
          # the create is denied by the fail-closed webhook. add-security-context
          # cannot fill the gap either: its match/exclude carry pod selectors, so
          # Kyverno generates no pod-controller rules for it and it never sees a
          # Deployment. The DRC therefore has to state this itself.
          #
          # The package manager applies its pod-level defaults only when the DRC
          # provides no securityContext at all, so this block has to restate
          # them verbatim (runAsNonRoot/runAsUser/runAsGroup = Crossplane's
          # documented 2000) — adding seccompProfile alone would drop the uid
          # the provider images run as.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              # Kubescape C-0017 (immutable container filesystem) + the hardening
              # set Kyverno's add-security-context ClusterPolicy injects at pod
              # admission. Kubescape scans this stored DRC-built spec (not the live
              # pod), so the fields must be present here too — otherwise C-0017
              # flags it even though the running pod is already read-only. No
              # writable /tmp is needed: provider-upjet-github's no-fork upjet
              # runtime keeps Terraform state in memory / the resource status,
              # never on disk (verified reconciling read-only in prod).
              # runAsUser/runAsGroup are left to Crossplane's package-manager
              # default (2000) — clearing them is the one unsupported DRC op.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                seLinuxOptions: {}
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
