---
# Bounded resources for the provider runtime pod (created by Crossplane, so the
# HelmRelease values can't reach it). The empty selector is the documented
# placeholder — Crossplane fills in the real match labels.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-upjet-unifi
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # validate-pod-security's require-seccomp-profile asserts the POD-level
          # path, and Crossplane's package manager creates this Deployment
          # directly, so the container-level value below does not satisfy it and
          # the create is denied by the fail-closed webhook. add-security-context
          # cannot fill the gap either: its match/exclude carry pod selectors, so
          # Kyverno generates no pod-controller rules for it and it never sees a
          # Deployment. The DRC therefore has to state this itself.
          #
          # The package manager applies its pod-level defaults only when the DRC
          # provides no securityContext at all, so this block has to restate
          # them verbatim (runAsNonRoot/runAsUser/runAsGroup = Crossplane's
          # documented 2000) — adding seccompProfile alone would drop the uid
          # the provider images run as.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              # Kubescape C-0017 (immutable container filesystem) + the hardening
              # set Kyverno injects at admission (Kubescape scans this stored spec,
              # not the live pod). The provider writes Terraform workspaces to
              # /tmp/<uuid>, so a read-only root with no writable /tmp breaks EVERY
              # managed resource ("mkdir /tmp/<uuid>: read-only file system").
              # Kyverno already forces the pod read-only with no /tmp mount, so this
              # DRC adds the writable /tmp emptyDir that both keeps reconciliation
              # working and makes the read-only root safe. runAsUser/runAsGroup are
              # left to Crossplane's default (2000).
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                seLinuxOptions: {}
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
