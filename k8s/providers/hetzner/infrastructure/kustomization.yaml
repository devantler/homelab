---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/infrastructure/
  # Prod-only audit-log forwarder. It consumes the `coroot-api-key` generated
  # from the Hetzner Coroot CR patch, so it belongs in this infrastructure
  # layer alongside that CR rather than in the earlier wait-gated controllers
  # layer. Both resources are applied before Flux waits for readiness, allowing
  # the operator to create the key before the HelmRelease becomes Ready.
  - ../../../bases/infrastructure/audit-log-forwarder/
  - cluster-issuers/
  # Prod-only workload isolation for the Hetzner instance metadata service.
  # A Cilium endpoint selector covers pods, not Talos hosts, so bootstrap keeps
  # its required metadata path while workloads cannot reuse node join material.
  - cilium/
  # Crossplane provider-upjet-github package + activation policy. Lives in this
  # `infrastructure` layer (not `infrastructure/controllers/`) because these are
  # pkg.crossplane.io CRs that need the Crossplane CRDs the core HelmRelease in
  # controllers/crossplane/ installs first — same controller-then-CR ordering as
  # Coroot/Flagger. Establishes the namespaced github CRDs the github-config app
  # (bases/apps/github-config/) consumes. Prod-only (Crossplane is Hetzner-only).
  - crossplane/
  # external-dns lives in this `infrastructure` layer (not
  # `infrastructure/controllers/`) because its Cloudflare token is a user-fed
  # OpenBao secret materialised by an ExternalSecret, and the openbao
  # ClusterSecretStore is itself an `infrastructure`-layer resource — in the
  # wait-gated controllers layer the never-syncing Secret would deadlock the
  # bootstrap dependency chain. Not bootstrap-critical: existing DNS records
  # keep serving while it waits for the token.
  - external-dns/
  - vault-seed/
  # Prod-only FinOps: a Kyverno ClusterPolicy that biases pod scheduling toward
  # the static baseline workers and away from the autoscaler nodes, so the
  # cost-optimized `autoscale-cx*` pools stay idle and scale to zero. Lives in
  # the hetzner overlay because autoscaling is Hetzner/prod-only; see the file
  # header for the `ksail.io/autoscaled` node-label contract it depends on.
  - cluster-policies/prefer-baseline-nodes.yaml
  # Prod-only: enforce the compute-only contract for autoscaler nodes at the
  # Longhorn layer — autoscale-* nodes inherit the storage label from the
  # shared Talos worker config, so without this Longhorn schedules volume
  # replicas onto ephemeral nodes (durability risk) and those replicas pin
  # the node against autoscaler scale-down. Two policies (admission half +
  # mutate-existing retrofit half) because Kyverno rejects a single policy
  # mixing an admission mutate rule with mutateExistingOnPolicyUpdate — see
  # the file headers.
  - cluster-policies/restrict-storage-to-baseline-workers.yaml
  - cluster-policies/drain-autoscale-node-storage.yaml
  # Prod-only: reconcile Coroot's node Custom Cloud Pricing to Hetzner rates
  # (Coroot otherwise prices non-AWS/GCP/Azure nodes at the GCP-C4 fallback,
  # ~16x the real bill). Lives in this `infrastructure` layer because it targets
  # the `platform` project the coroot-patch below adds to the Coroot CR.
  - coroot/cron-job-custom-cloud-pricing.yaml
  # Re-asserts narrow suppressions for genuinely by-design Coroot alerts via the
  # API on a schedule, since Coroot has no declarative per-alert exemption. See
  # the file header for the exemption list + why each is by-design.
  - coroot/cron-job-alert-autosuppressor.yaml
  # Prod-only: turns the crossplane-sync-exporter's series into a Slack
  # notification via Alertmanager, which nothing else consumes. See the file
  # header for why this is a CronJob rather than a PrometheusRule.
  - coroot/cron-job-crossplane-sync-alerter.yaml
  - coroot/service-account-crossplane-sync-alerter.yaml
  - coroot/cluster-role-crossplane-sync-alerter.yaml
  - coroot/cluster-role-binding-crossplane-sync-alerter.yaml
  # Prod-only: the CloudNativePG datastore + backup wiring that lets the Coroot
  # SERVER run HA (replicas: 2 — set in the coroot-patch below). The operator
  # only honours replicas > 1 when spec.postgres is set, so this Postgres is the
  # precondition for a non-singleton Coroot server. CNPG/hcloud are prod-only, so
  # (like umami-db) these live in this overlay, not the shared base. The
  # drain-safe PDB for the operator-built server StatefulSet ships here too.
  - coroot/cluster.yaml
  - coroot/password-coroot-monitor.yaml
  - coroot/external-secret-coroot-monitor.yaml
  - coroot/external-secret.yaml
  - coroot/object-store.yaml
  - coroot/scheduled-backup.yaml
  - coroot/cilium-network-policy.yaml
  - coroot/pod-disruption-budget.yaml
  # Prod-only safety-net alerting: a Flux notification-controller Provider + Alert
  # that posts Kustomization reconciliation errors to the SAME Slack webhook the
  # Coroot integration uses (${alertmanager_webhook_url}). Re-instates the
  # FluxKustomizationNotReady alert dropped in the Coroot migration (see
  # docs/dr/alerting.md) — event-driven, so nothing for the kubescape scan to
  # flag. Prod-only, where that webhook is configured.
  - flux-notifications/
  # Longhorn CSI VolumeSnapshotClass for Velero CSI backups. Kept in this
  # `infrastructure` layer (not `infrastructure/controllers/`) so the
  # snapshot.storage.k8s.io CRDs shipped by the snapshot-controller HelmRelease
  # are established first — see volume-snapshot-classes/longhorn.yaml. (hcloud
  # block storage has no snapshot support, so openbao stays on FSB.)
  - volume-snapshot-classes/
  # Prod-only over-provisioning ("spare room") buffer: the native Cluster
  # Autoscaler CapacityBuffer + its PodTemplate. KSail installs the CRD +
  # controller when ksail.prod.yaml's autoscaler.node.capacityBuffers: true is
  # set; this reserves one warm spare node as VIRTUAL (pod-less) headroom.
  # Unlike the old balloon-pod ReplicaSet (+ its cluster-proportional-autoscaler)
  # — which had to live OUTSIDE this health-gated `wait: true` layer because its
  # pause pods sat Pending and held `infrastructure` (+ its `apps` dependent +
  # every CI/CD deploy) red for ~30h on 2026-06-09/10 — the native buffer creates
  # no real pods, so nothing sits Pending and it rides along here like any other
  # resource. Hetzner/prod-only (the autoscaler pools are Hetzner).
  #
  # The CapacityBuffer CRD (autoscaling.x-k8s.io/v1beta1) + controller are
  # installed by KSail only from a release that ships ksail#5277, first released
  # in v7.59.0. The pinned KSAIL_VERSION is now 7.59.1 (ci.yaml/cd.yaml, bumped in
  # #2097), so the gate is satisfied. Deploy ordering keeps the first apply safe:
  # `ksail cluster update` (installs the CRD + controller) runs before `ksail
  # workload reconcile` (applies this CR) in both cd.yaml and the ci.yaml
  # merge-queue deploy, so the CRD always exists before Flux reconciles the
  # CapacityBuffer — no "no matches for kind CapacityBuffer" wedge. (It was
  # TEMPORARILY DISABLED 2026-06-16..#2097 while the pin still read 7.58.3, which
  # predated #5277; the old balloon-pod buffer was already removed in #2087.)
  - overprovisioning/
  # Prod-only: static VerticalPodAutoscalers for kube-system + kyverno. auto-vpa
  # (Kyverno) can't reach these namespaces (global resourceFilters), so VPA is
  # supplied as plain manifests here. Pairs with the LimitRange memory-seed
  # patches below — together VPA right-sizes requests down while keeping a
  # generous, no-OOM burst limit. See vertical-pod-autoscalers/kustomization.yaml.
  - vertical-pod-autoscalers/
  #
  # NOTE: tenant-owned custom-domain TLS (the ascoachingogvaner.dk Certificate +
  # its simply.com DNS01 solver credential) is NOT a platform resource at all —
  # it lives in the tenant's own deploy/ (a namespaced cert-manager Issuer +
  # Certificate + ReferenceGrant), delivered by the tenant Flux Kustomization.
  # That credential/issuance is EXPECTED to sit InProgress until the maintainer
  # seeds apps/ascoachingogvaner/simply in OpenBao; keeping it in the tenant means
  # only the (isolated) tenant Kustomization is affected, never this `wait: true`
  # layer. The platform keeps only the shared Gateway HTTPS listener patch
  # (patches/add-ascoachingogvaner-dk-listeners.yaml, below), which references the
  # tenant Secret cross-namespace and stays Ready (Gateway Programmed) regardless.
components:
  - ../../../bases/components/annotations-transformers
  # Prod-only activation for platform#2689. The shared OpenCost base keeps this
  # bounded cAdvisor scraper default-off; Hetzner runs Kubernetes v1.36, whose
  # fine-grained kubelet authorization maps /metrics/* to nodes/metrics.
  - ../../../bases/infrastructure/opencost/components/usage-scraper
  # Prod-only activation for platform#2986. Exports each Crossplane managed
  # resource's conditions as metrics, so a resource that stops reconciling is
  # visible instead of silent: a managed resource can report Ready=True while
  # Synced=False — measured on 3 of the 20 Repository resources — and every
  # health check keyed on Ready reads that fleet as healthy while no declared
  # setting is reaching the provider. Referenced here rather than from the
  # shared Coroot base because Crossplane exists only on this provider. The
  # adjacent alerter delivers stuck-resource and coverage-gap notifications.
  - ../../../bases/infrastructure/coroot/components/crossplane-sync-exporter
  # Platform-wide HelmRelease drift detection (mode: enabled) — covers the
  # opencost HelmRelease in this layer. See
  # bases/components/helmrelease-drift-detection.
  - ../../../bases/components/helmrelease-drift-detection
  - ../../../bases/components/helmrelease-flux-defaults
patches:
  # UniFi exists only on Hetzner and applies Crossplane Managed Resources whose
  # default deletion policy cascades to live network objects. Keep its deliberate
  # non-pruning exception in this provider overlay so the shared admission policy
  # remains strict for every other environment. The authorization validator pins
  # the rendered exception set and the reconciler's immutable source/delete bounds.
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: enforce-flux-best-practices
    patch: |
      - op: add
        path: /spec/rules/0/exclude/any/-
        value:
          resources:
            namespaces:
              - unifi
            names:
              - unifi
  # gateway-patch self-identifies (Gateway/platform/kube-system), so a path is
  # enough — no explicit target, matching the coroot patch below.
  - path: patches/attach-hcloud-load-balancer.yaml
  # JSON6902 patches don't self-identify, so this one needs an explicit
  # target. Adds HTTPS listeners for the tenant-owned ascoachingogvaner.dk
  # domain — see the file header.
  - path: patches/add-ascoachingogvaner-dk-listeners.yaml
    target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
  # Prod-only Coroot tuning: hcloud-backed persistent storage + Slack webhook
  # wiring. The CR it patches comes from ../../../bases/infrastructure/coroot/
  # (the `infrastructure` layer); the strategic-merge patch matches on the
  # embedded coroot.com/v1 Coroot/coroot identity, so no explicit target.
  - path: coroot/patches/enable-ha.yaml
  # Prod-only: migrate the OpenBao raft-snapshot PVC from the default longhorn
  # StorageClass to hcloud so node-mobile snapshot Jobs can attach it reliably
  # (see the file header). Self-identifies via PersistentVolumeClaim/openbao/
  # vault-snapshots, so no explicit target is needed.
  - path: patches/store-vault-snapshots-on-hcloud.yaml
  - path: patches/recover-vault-snapshot.yaml
  # Prod-only: add a generous memory `default` to the kube-system / kyverno
  # LimitRanges (which are CPU-only in the base). This seeds the memory limit the
  # vertical-pod-autoscalers/ VPAs scale ratio-preserving, so VPA right-sizes the memory
  # REQUEST down to real usage while the limit stays a generous multiple (no OOM
  # — the seed is far above every workload's real peak). kube-system 4Gi gives
  # cilium (512Mi req) ~8:1 and smaller add-ons far more; kyverno 2Gi gives its
  # 128Mi controllers ~16:1. Kept here (not the base) so the base stays CPU-only
  # and the memory limit is scoped to prod, where the VPAs that manage it live.
  - target:
      version: v1
      kind: LimitRange
      name: default-limitrange
      namespace: kube-system
    patch: |
      - op: add
        path: /spec/limits/0/default/memory
        value: 4Gi
  - target:
      version: v1
      kind: LimitRange
      name: default-limitrange
      namespace: kyverno
    patch: |
      - op: add
        path: /spec/limits/0/default/memory
        value: 2Gi
