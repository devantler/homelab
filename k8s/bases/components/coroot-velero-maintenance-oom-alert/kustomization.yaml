---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Cross-controller alert bundle. The ServiceAccount, Secret and CronJob run in
# Coroot's observability namespace while the Role and RoleBinding live in the
# Velero namespace. Consumers must enable this component only when both bases
# are present; keeping it out of either independently selectable base preserves
# the Docker provider's opt-in controller model.
resources:
  - service-account-velero-maintenance-oom-alert.yaml
  - secret-velero-maintenance-oom-alert.yaml
  - role-velero-maintenance-oom-alert.yaml
  - role-binding-velero-maintenance-oom-alert.yaml
  - cron-job-velero-maintenance-oom-alert.yaml
