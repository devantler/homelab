# Reuse the portfolio alert webhook without putting it in the CronJob spec or
# process environment. The local/CI default is an RFC 2606 reserved host.
---
apiVersion: v1
kind: Secret
metadata:
  name: velero-maintenance-oom-alert-webhook
  namespace: observability
type: Opaque
stringData:
  url: ${alertmanager_webhook_url:=https://example.invalid/no-slack-configured}
