---
# The part of the "add-security-context" mutation exemption that cannot yet be
# scoped to the namespaces that mutation actually runs in.
#
# pod-security-mutations.yaml narrows C-0013, C-0016 and C-0055 to the mutated set,
# because every workload that narrowing exposes is either covered by another
# exception or already passes. C-0211 does not have that property, so it stays
# cluster-wide here until its residual population has a fix behind it.
#
# C-0013 LEFT THIS FILE on 2026-09-09 (#3223). It was held here by one measured gap:
# tofu-controller, the sixth flux-system workload, which had no runAsGroup at
# container or pod level. That workload was retired in #3480 (closed 2026-09-08), so
# the gap closed by deletion rather than by setting a uid on a controller already on
# its way out, and flux-system's five remaining workloads pass C-0013 genuinely —
# verified live per workload on the subStatus discriminator this file documents. The
# narrowing and that evidence are recorded in pod-security-mutations.yaml.
#
# fail-open-warning:BEGIN — every spec.posture controlID must be named below.
# 🔴 DO NOT RE-VERIFY ANY CONTROL IN THIS FILE ON workloadconfigurationscans ALONE —
# THAT SURFACE FAILS OPEN FOR EVERY CONTROL THIS EXCEPTION SUPPRESSES. The hazard is a
# property of the exception rather than of one control, so anything added under
# spec.posture below inherits it. Kubescape writes status: passed together with
# subStatus: "w/exceptions" and a populated appliedIgnoreRules on each suppressed
# control, so reading .spec.controls[<id>].status.status reports a gate as clearable
# when nothing behind it has been fixed. Scan status measured 2026-09-02 on the one
# control listed below:
#
#   * C-0211 — 35 of 35 scanned workloads read passed with subStatus "w/exceptions",
#     each carrying appliedIgnoreRules: [pod-security-mutations-unscoped/C-0211]. Against
#     the stored specs (re-measured 2026-09-03, below) six of the 35 pass both universal
#     gaps and 29 do not, and status alone cannot tell the six from the 29: it yields
#     exactly the "0 of 35 fail" that #3239 states as its success signal either way.
#
# The discriminator is subStatus plus a populated appliedIgnoreRules, never status,
# and it does discriminate: on one such workload the same scan carries 53 controls
# passed with an EMPTY subStatus and 3 failed with appliedIgnoreRules null, so
# "w/exceptions" is a real signal and not a constant. `fixPath` is NOT a discriminator
# either: it is a static hint from the rule definition and is populated identically on
# workloads that genuinely pass. Verify against the live stored workload spec, which is
# independent of both the scanner and this exception.
# fail-open-warning:END
#
# C-0211 — CIS-5.7.3, and it is a twelve-rule control rather than the three-field
# check its name suggests. The rules this exception suppresses include
# non-root-containers, set-fsgroup-value, set-fsgroupchangepolicy-value and
# set-seLinuxOptions, alongside rules that C-0016 and C-0055 also carry. No other
# exception covers it in the excluded namespaces: neither infrastructure-privileged
# nor the name-scoped kubescape-privileged lists C-0211.
#
# Its residual population is every workload in the four excluded namespaces that are
# actually scanned — flux-system, longhorn-system, observability and velero — all 35
# of them: 17 Deployments, 8 DaemonSets, 7 CronJobs and 3 StatefulSets. (CronJobs are
# scanned and carry a verdict; Jobs are not, so the ephemeral backup and heartbeat
# Jobs in these namespaces are out of scope.) Measured 2026-09-02 against the live
# PROD stored specs, which is the surface Kubescape reads, and corroborated
# independently by the count of Kubescape's own workload-kind scan objects in those
# namespaces (flux-system 6, longhorn-system 12, observability 15, velero 2).
# NOTE: this baseline predates tofu-controller's removal (#3480, closed 2026-09-08);
# the current population is expected to be 34 (flux-system 5). Re-measure to confirm.
#
# "Scanned" here means in the scanner's configured scope. The population's absence
# from the posture score is NOT reducible to the config scan's own producing gaps
# (#2933, #3024): this exception suppresses C-0211 whatever the scanner's health, so
# the score reads clean either way — which is exactly the silent-suppression failure
# mode #2447 exists to prevent.
#
# Six of the 35 pass both universal gaps and 29 do not. The pod-level
# `securityContext.fsGroupChangePolicy` is absent on 29 of 35 (read under
# `jobTemplate` for the CronJobs), and no effective seLinux `level` reaches every
# container on the same 29 — "effective" meaning the container's own seLinuxOptions
# where it sets them and the pod-level object otherwise. That test is deliberately
# generous, since a container-level object actually replaces the pod struct wholesale,
# so 29 of 35 is a floor rather than an artifact of a strict rule. The six that pass
# are velero's two (#3541) and four of flux-system's six (#3544), both TEMPLATE-level
# changes. Pod-level `fsGroup` is absent on 20, `runAsGroup` on 26 and `runAsNonRoot`
# on 19 — all three unchanged, which is the evidence those two changes supplied
# exactly the two non-privilege fields and touched nothing else. Universal-gap counts
# re-measured 2026-09-03 against the live PROD stored specs; the three subset counts
# re-measured the same day and unchanged from 2026-09-02.
#
# Those three are NO LONGER strict subsets of the two universal gaps, and that is a
# behavioural change rather than bookkeeping: five workloads — flux-system's four
# controllers and velero/node-agent — now pass both universal gaps while still missing
# `runAsGroup` and `runAsNonRoot`, and node-agent also misses `fsGroup`. So closing the
# two universal gaps NO LONGER implies passing C-0211; it removes the reason every
# workload failed and leaves the privilege-adjacent fields as the remaining cause on
# the ones already fixed. Narrowing C-0211 today would still surface a population with
# no fix behind it — lowering the score to absorb a gap rather than closing it — so it
# stays cluster-wide.
#
# The remaining 29 split observability 15, longhorn-system 12, flux-system 2.
# observability and longhorn-system are already labelled into
# add-baseline-context-optin-*, but that label gates only the three `kinds: Pod`
# rules, so they mutate at admission and leave the stored spec Kubescape reads
# untouched — which is why the opt-in alone moves none of those 27. The rules that
# DO reach the stored spec are TWO families, both gated on a SECOND label,
# `baseline-context-controllers`: add-baseline-context-optin-controllers*
# (Deployment/StatefulSet/DaemonSet on CREATE and UPDATE, Job on CREATE) and
# add-baseline-context-optin-cronjobs* (CronJob on CREATE and UPDATE). Both are
# load-bearing for this rollout — seven of the residual workloads are CronJobs, so
# planning only the controller family would silently leave those out along with
# their read-back checks. That label is deliberately applied in NO namespace —
# tests/add-baseline-context pins
# that empty inventory, and a namespace joins only together with the measured
# post-rollout read-back its documented flip procedure produces. So the 27 are
# waiting on that per-namespace rollout, not on a mechanism that cannot reach
# them. Template-level changes are what moved velero and flux-system. flux-system's
# sole remaining workload in this population is flux-operator; tofu-controller was the
# second, but it was removed in #3480 (closed 2026-09-08), reducing the population
# from 35 to 34.
#
# The per-workload table and the remediation split are on #3217. These counts are
# prod-only and the local overlay opts in to a different namespace set, so re-measure
# rather than inheriting them.
#
# node-agent and storage are NOT in that population. Both live in `kubescape`, whose
# workloads the operator's own excludeNamespaces drops from scanning: neither has a
# workloadconfigurationscan object at all, so there is no verdict to un-suppress and
# narrowing cannot change their result — unscanned is not the same as passing. Do not
# read the 384 scan objects sitting in that namespace as evidence it is scanned; they
# are the cluster-scoped results (ClusterRoleBindings, ServiceAccounts, node and
# control-plane info) that Kubescape stores there, and none of them is a workload.
# The name is shared but the workload is not: velero/node-agent is a different
# DaemonSet, and it IS in the population.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: pod-security-mutations-unscoped
  annotations:
    # Cluster-wide, and knowingly wider than its own rationale: in the twelve
    # namespaces "add-security-context" excludes, nothing injects these fields.
    # C-0211 is retained rather than narrowed on an unmeasured guess — sized
    # 2026-09-02 and pending #3217. C-0013 was narrowed out on 2026-09-09 (#3223)
    # once #3480 removed the one workload that failed it.
    platform.devantler.tech/cluster-wide: declared
spec:
  reason: >-
    Kyverno mutate policy "add-security-context" injects runAsNonRoot, runAsUser,
    runAsGroup and fsGroupChangePolicy at pod admission. The Deployment spec does
    not contain them and Kubescape scans the stored spec, not the live pod. This
    control remains cluster-wide because narrowing it is blocked on evidence rather
    than on expressiveness: C-0211's residual population is every scanned workload
    the mutation does not reach, sized at 34 (35 in the 2026-09-02 baseline,
    before tofu-controller removal in #3480; #3217).
  posture:
    - controlID: C-0211
      action: ignore
