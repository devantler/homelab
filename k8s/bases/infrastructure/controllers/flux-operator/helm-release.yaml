---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
    helm.toolkit.fluxcd.io/helm-test: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  chart:
    spec:
      chart: flux-operator
      version: 0.50.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
  interval: 10m0s
  timeout: 10m
  values:
    web:
      # The Flux Operator's bundled Status web UI is disabled: Flux is surfaced
      # in-cluster through Headlamp's `headlamp_flux` plugin (see
      # bases/apps/headlamp), so a standalone Flux dashboard is redundant. This
      # release is the operator/reconciler only and must stay running at all
      # times.
      enabled: false
  # Give the operator container the uid AND gid its own image declares, so
  # Kubescape C-0013 (non-root containers) passes on its own terms rather than
  # through an exception. The chart sets runAsNonRoot but no runAsUser, and
  # C-0013 also requires runAsGroup.
  #
  # 🔴 SET BOTH FIELDS, NEVER runAsGroup ALONE. With no runAsUser resolvable,
  # adding only runAsGroup leaves the OCI spec an empty uid and a group
  # ("":65532), which containerd refuses — the patch intended to close a
  # posture gap would stop the operator starting. add-security-context.yaml
  # documents the same trap.
  #
  # 65532 is measured, not chosen: ghcr.io/controlplaneio-fluxcd/flux-operator
  # declares USER 65532:65532 in its image config (read from the registry
  # 2026-08-29). This is a DIFFERENT value from the four Flux controllers the
  # FluxInstance renders — those are ghcr.io/fluxcd/* and declare 65534. One
  # namespace, two image families, two uids; do not unify them.
  #
  # Applied here rather than in the FluxInstance because the operator is
  # installed by Helm, so the FluxInstance's kustomize patches never reach it.

  # C-0211 (CIS-5.7.3) — the two non-privilege fields, supplied at TEMPLATE level.
  #
  # flux-system is excluded from add-pod-security-context / add-container-security-context
  # because its workloads need elevated privilege by design, and the namespace-scoped
  # add-baseline-context-optin-* rules cannot close the gap here: all three match
  # `kinds: Pod`, so they mutate at ADMISSION and leave the stored workload spec
  # Kubescape reads untouched. Only a template-level change moves the measurement —
  # the same reason #3541 (velero) and #3544 (the four FluxInstance controllers) were
  # done this way rather than by labelling the namespace.
  #
  # Measured against the live PROD stored specs 2026-09-04: of flux-system's six
  # workloads, four controllers already carry both fields from #3544, leaving
  # flux-operator and tofu-controller. tofu-controller is retired and pending removal
  # in #3480, so flux-operator is the namespace's last workload needing this.
  #
  # Both fields are inert here, which is the point rather than a caveat — this changes
  # a declared posture without changing how the operator runs:
  # - fsGroupChangePolicy governs the kubelet's volume ownership pass, which runs only
  #   when a pod sets fsGroup. This pod sets none, and its only volumes are an emptyDir
  #   and the projected service-account token — no PVC, no hostPath.
  # - Empty seLinuxOptions satisfies C-0211 while leaving SELinux type and MCS
  #   categories to the runtime. It is a no-op on this AppArmor cluster.
  #
  # Neither carries the runAsGroup-without-runAsUser coupling documented above, so
  # neither can stop the sandbox building.
  #
  # 🔴 The two fields need DIFFERENT patch kinds, because the chart renders their
  # parents differently. Verified by rendering flux-operator 0.50.0 with this
  # HelmRelease's own values 2026-09-04:
  # - containers[0].securityContext IS rendered, so a JSON-6902 leaf `add` applies.
  # - spec.template.spec.securityContext is NOT rendered AT ALL, so a JSON-6902 leaf
  #   `add` under it fails `doc is missing path` — and because a JSON patch is
  #   all-or-nothing, that one op takes the container ops down with it.
  #
  # Do NOT read this off the live Deployment: the API server serialises the absent
  # pod-level object as `{}`, so the cluster shows a parent that the rendered chart
  # does not have. The rendered manifest is the surface a post-renderer patches.
  #
  # The pod-level field is therefore a strategic-merge patch, which creates the
  # missing parent AND merges into a chart-set one — so if a future chart starts
  # rendering spec.template.spec.securityContext, its fields survive. A JSON-6902
  # `add` of the whole object would have replaced them silently; that is why this is
  # a merge rather than an object add.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: flux-operator
            patch: |
              - op: test
                path: /spec/template/spec/containers/0/name
                value: manager
              - op: add
                path: /spec/template/spec/containers/0/securityContext/runAsUser
                value: 65532
              - op: add
                path: /spec/template/spec/containers/0/securityContext/runAsGroup
                value: 65532
              - op: add
                path: /spec/template/spec/containers/0/securityContext/seLinuxOptions
                value: {}
          - target:
              kind: Deployment
              name: flux-operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: flux-operator
              spec:
                template:
                  spec:
                    securityContext:
                      fsGroupChangePolicy: OnRootMismatch
