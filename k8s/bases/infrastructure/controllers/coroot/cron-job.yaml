# Cluster-level dead-man's-switch. Every 5 minutes a pod pings the external
# heartbeat monitor (${alertmanager_heartbeat_url}, e.g. healthchecks.io);
# the monitor alerts out-of-band when the pings STOP. A successful ping
# proves the cluster as a whole is alive — a node, the scheduler, kubelet,
# the CNI, DNS and egress all worked — which is the one failure in-cluster
# alerting can never report about itself.
#
# The ping is deliberately UNCONDITIONAL. It is NOT gated on any component
# (it used to require Coroot's bundled Prometheus to answer /-/healthy):
# component health is alerted on in-cluster by Coroot's own notification
# integrations and is checked by connecting to the cluster — gating the
# ping on a component conflates a component outage with "the cluster is
# down", which is the only thing this switch exists to signal.
#
# Cadence: the documented external check is a ~5 min period / ~10 min grace
# (docs/dr/alerting.md), and a dead-man monitor alarms on period+grace
# elapsing since the LAST ping — pinging more often than the period cannot
# detect an outage any faster. */5 matches the check while avoiding a
# pod-churn every minute (each run costs scheduling, admission webhooks, a
# Cilium endpoint and a SPIRE identity; 1440 pods/day at the old cadence).
#
# Lives in the observability namespace to reuse the allow-coroot
# CiliumNetworkPolicy's world:443 + DNS egress; it does not depend on
# Coroot itself.
#
# The URL is injected by Flux substitution into a SECRET
# (secret-cluster-heartbeat.yaml), which this Job mounts read-only -- not into
# this spec. Substituting it here would persist a live third-party credential
# in an object that any holder of the built-in `view` ClusterRole can read.
# Unset (local/CI) it defaults to an invalid URL so the ping reaches nowhere.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-heartbeat
  namespace: observability
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # Headroom for a slow tick: pod scheduling + Cilium's L7 DNS proxy
      # resolving the external host + curl's own --retry budget (below) can
      # exceed a tight 30s, which marks the Job Failed (reason: DeadlineExceeded)
      # even though `|| true` swallowed curl's exit code -- a false failure event.
      # 120s sits well above the worst case (4 attempts x --max-time 10 + delays)
      # and far below the */5 schedule, so a genuinely-down cluster still stops
      # pinging within one period.
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: cluster-heartbeat
        spec:
          restartPolicy: Never
          # curl-only heartbeat; it never calls the Kubernetes API, so no
          # ServiceAccount token is mounted (kubescape C-0034).
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            # fsGroup is what makes the mounted URL readable at all. Secret volume
            # files are owned by root:root unless fsGroup is set, so a non-root
            # container reading a mode-0440 file gets EACCES and the heartbeat stops
            # -- which an external dead-man monitor reports as the CLUSTER being
            # down. Setting fsGroup makes kubelet chown the volume to root:65532,
            # which the group-readable mode then opens to this container and nothing
            # else.
            fsGroup: 65532
            # fsGroupChangePolicy and seLinuxOptions are the two non-privilege C-0211
            # fields the cluster-wide add-security-context mutation cannot supply
            # here: observability is excluded from it, and the namespace opt-in
            # mutates the running POD, while Kubescape scores the STORED workload
            # spec (#3239). Writing them into the template is the only route that
            # moves both surfaces. Values match add-security-context.yaml.
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: heartbeat
              image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # Read from the mounted Secret rather than a substituted spec
                  # value: anything that can `get cronjob` in this namespace could
                  # otherwise read the live monitor URL straight off the object
                  # (the built-in `view` ClusterRole grants batch, and is bound to
                  # the OIDC identity). Secrets are deliberately not granted there.
                  HEARTBEAT_URL=$(cat /etc/cluster-heartbeat/url)

                  # The value becomes a curl CONFIG directive below, where a
                  # newline starts a SECOND directive -- so an LF in the Secret
                  # would let the config say `output = ...` or anything else curl
                  # accepts. A valid URL cannot contain a control character, so
                  # rejecting them costs nothing and turns a malformed Secret into
                  # a loud failure instead of a silently reconfigured request.
                  if [ "$(printf '%s' "$HEARTBEAT_URL" | tr -d '[:cntrl:]')" != "$HEARTBEAT_URL" ]; then
                    echo "ERROR: heartbeat URL contains control characters" >&2
                    exit 1
                  fi

                  # Passed via --config on stdin, not as an argv element, so the
                  # URL never appears in /proc/<pid>/cmdline. Matches
                  # cron-job-cnpg-degraded-alert.yaml.
                  #
                  # `|| true` is retained deliberately: the alarm signal is the
                  # ABSENCE of pings observed externally, never this Job's exit
                  # code, so an unreachable monitor must not flap the Job into a
                  # failed state. It does not mask the guard above, which exits
                  # before curl runs.
                  printf 'url = %s\n' "$HEARTBEAT_URL" |
                    curl -sf --max-time 10 \
                      --retry 3 --retry-delay 2 --retry-all-errors --retry-connrefused \
                      --config - || true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                # Non-root identity at the container level (kubescape C-0013).
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                # CIS-5.7.3 (C-0211); a documented no-op on this AppArmor cluster.
                seLinuxOptions: {}
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: heartbeat-url
                  mountPath: /etc/cluster-heartbeat
                  readOnly: true
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  # CPU limit set for kubescape C-0270; generous (10x request) so
                  # the short-lived curl never throttles.
                  cpu: 50m
                  memory: 32Mi
          volumes:
            # 288 is 0440: readable by root and by the pod's fsGroup (65532, set
            # above), rather than by anything else that lands in this pod. It must
            # carry the GROUP bit: kubelet owns secret-volume files root:fsGroup,
            # never uid:fsGroup, so an owner-only 0400 is unreadable by the
            # container's own non-root user. The Secret is the one
            # secret-cluster-heartbeat.yaml creates from the per-cluster Flux
            # substitution.
            #
            # Written in DECIMAL deliberately, matching cron-job-cnpg-degraded-alert.yaml:
            # an unquoted `0440` is read as octal 288 by Kubernetes' own parser
            # (sigs.k8s.io/yaml, which is YAML 1.1) and as decimal 440 -- mode 0670 --
            # by every YAML 1.2 reader, yq and kyaml included. The two disagree
            # silently and nothing validates the difference.
            - name: heartbeat-url
              secret:
                secretName: cluster-heartbeat-url
                defaultMode: 288
