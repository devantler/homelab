---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The kyverno Namespace itself lives in the bootstrap layer
  # (k8s/bases/bootstrap/namespace-kyverno.yaml) so its CPU LimitRange can be
  # applied before these controllers are admitted — see #3525 and that file.
  - helm-release.yaml
  - helm-repository.yaml
  - cilium-network-policy.yaml
  # Umami's namespace and narrow background-controller grant must exist before
  # the dependent infrastructure layer admits its mutateExisting policy.
  - namespace-umami.yaml
  - role.yaml
  - role-binding.yaml
  - cluster-role-reports-controller-read-keda.yaml
  - cluster-role-read-github-teams.yaml
