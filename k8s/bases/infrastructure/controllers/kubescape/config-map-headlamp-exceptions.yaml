        "reason": "Controllers, operators and databases that read Kubernetes Secrets by design (cert-manager, External Secrets, CloudNativePG + Barman backups, Crossplane and its providers, Kyverno, Flux, KEDA, Longhorn, Cilium, the Kubescape operator, the built-in kube-controller-manager controllers, and the tenant databases). Matched by the specific RBAC object (Role/ClusterRole, or the binding for cluster-admin holders) so a new/accidental secret-reader elsewhere still trips C-0015. Over-privileged or admin identities (unused tenant `edit` SAs, crossview's wildcard read, the cluster-admin / crossplane admin groups) are intentionally left flagged."
