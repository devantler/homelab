apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: kubescape-operator
      version: 1.40.4
      sourceRef:
        kind: HelmRepository
        name: kubescape
  # https://github.com/kubescape/helm-charts/blob/main/charts/kubescape-operator/values.yaml
  values:
    # HA: the kubescape-operator chart is single-replica by design — Coroot
    # flags operator/kubescape/kubevuln/storage as "single instance - not
    # resilient to node failure", but the chart provides NO safe way to run
    # them HA, so they are deliberately left at one replica (chart v1.40.2):
    #
    #   * operator, kubescape (scanner), storage — the Deployment templates
    #     HARDCODE `replicas: 1` with no value to override it, and the chart
    #     ships NO leader-election anywhere. Two operators/scanners would
    #     double-trigger every scan (cf. the velero/VPA/flagger HA comments in
    #     this tree: we only scale components that leader-elect). Making these
    #     HA would require forking the chart — out of scope and unsafe.
    #   * storage is additionally a singleton by ARCHITECTURE: it is an
    #     aggregated APIServer backed by a ReadWriteOnce PVC
    #     (kubescape-storage, persistence.size.backingStorage below) with a
    #     `Recreate` rollout — a single-writer store, not a stateless replica
    #     set. A second replica would fail to multi-attach the RWO volume.
    #   * kubevuln is the ONLY component exposing `kubevuln.replicaCount`, but
    #     its Deployment ships `strategy: type: Recreate` and mounts RWO PVCs
    #     when grypeDb/tmpDir persistence is enabled — i.e. the chart itself
    #     forbids concurrent replicas. With no leader election, two kubevuln
    #     pods would duplicate every image scan. So it stays at 1 too.
    #
    # Upstream's guidance for larger clusters is to raise RESOURCES, not add
    # replicas (helm-charts README). Revisit if the chart adds leader election
    # / multi-replica support for any of these components.
    clusterName: ${cluster_name}
    capabilities:
      configurationScan: enable
      # Chart 1.40.4 derives clusterData.continuousPostureScan from this value,
      # and Kubescape only stores detailed WorkloadConfigurationScan results
      # when that runtime flag is true. Summaries are stored unconditionally,
      # so disabling this produces deceptively fresh summaries while detailed
      # posture silently ages (observed live 2026-08-28, issue #3275).
      continuousScan: enable
      vulnerabilityScan: enable
      # kubevuln emits an OpenVEX document per scanned image (stored in-cluster
      # as OpenVulnerabilityExchangeContainer CRs), marking CVEs not_affected
      # when the workload's ApplicationProfile shows the vulnerable component
      # is never loaded. Documents only carry relevancy verdicts for workloads
      # whose profile is complete; partial-profile workloads still get a VEX
      # shell, which fills in as their pods naturally roll. Feeds the
      # reachable-CVE CI gate (#2149) a machine-readable suppression source.
      # Upstream marks the capability experimental — the VEX CRs are advisory
      # data only, so a regression cannot break scanning itself.
      vexGeneration: enable
      runtimeDetection: enable
      # Enables Kubescape's risk-acceptance feature, so the operator/kubevuln process
      # the in-cluster SecurityException / ClusterSecurityException CRDs
      # (k8s/bases/infrastructure/cluster-security-exceptions/) and emit posture-exception
      # match events (kubescape#2291). IMPORTANT: this flag alone does NOT make POSTURE
      # exceptions apply — that needs THREE more things the chart (<= 1.40.2) does not give us:
      #   (1) the posture scanner reads those CRDs via a CRD exceptions getter that only
      #       exists in kubescape image >= v4.0.9 (kubescape#2291/#2322); chart 1.40.2 still
      #       pins the scanner to v4.0.8 → see the `kubescape.image.tag` override below;
      #   (2) that getter must LIST the CRDs at the apiVersion the chart serves — v4.0.9
      #       hard-coded kubescape.io/v1 while the chart's CRDs serve ONLY v1beta1, so its
      #       List() 404s and (being the secondary/merged source) is silently swallowed →
      #       still zero exceptions. kubescape#2366 (image >= v4.0.10) switches the getter to
      #       v1beta1, so the override below is at v4.0.10 for this reason; and
      #   (3) the scanner ServiceAccount needs RBAC to `list` those CRDs, which NO chart
      #       version grants it (only operator/kubevuln get it) → see `cluster-role.yaml`
      #       + `cluster-role-binding.yaml`.
      # Missing any one of the three → the scanner silently loads zero exceptions (its merged
      # getter swallows the missing/forbidden/wrong-version CRD source and falls back to the
      # offline = empty primary), so the dashboard reads "excluding 0 controls" even though
      # the CRs are deployed and schema-valid. Exemptions stay a LAST RESORT behind real
      # fixes — keep the cluster-security-exceptions set minimal and irreducible.
      riskAcceptance: enable
      # DISABLED deliberately — this flag does NOT mean "do not call the cloud",
      # it means "do not use the network at all", and the posture scanner needs
      # the network for one thing it cannot work without: its policy artifacts.
      #
      # What the chart does with it (1.40.4, templates/kubescape/deployment.yaml
      # and templates/_common.tpl):
      #   - `enable` is the ONLY thing that sets `KS_OFFLINE=true` on the
      #     scanner. With that set, the scanner does not fetch the Regolibrary
      #     controls/frameworks bundle, and nothing else in the chart supplies
      #     it: `/home/nonroot/.kubescape` is an emptyDir with no init container
      #     or ConfigMap behind it, so it is empty on every pod start. The
      #     scanner then logs `failed to list frameworks` and every scan aborts
      #     with `open /home/nonroot/.kubescape/{security,allcontrols}.json: no
      #     such file or directory`, persisting nothing.
      #   - it also force-injects `scanV1.keepLocal: true` into the scheduler
      #     request body — which is why `kubescapeScheduler.requestBody` below
      #     sets that explicitly and MUST keep doing so while this is disabled.
      #   - it also ORs into `clusterData.keepLocal`. That value is
      #     `or (offline) (not serviceDiscovery.enabled)`, and serviceDiscovery
      #     is false here, so it stays `true` either way. Disabling this flag
      #     does not change it.
      #
      # Cloud submit is prevented by `keepLocal`, not by this flag. keepLocal
      # makes the scanner run local-only (Submit=false), so there is no report
      # POST to report.armo.cloud, no cloud account-ID generation, and no write
      # to `/home/nonroot/.kubescape/config.json` — which matters because that
      # path is an emptyDir subPath the kubelet materialises as a directory, so
      # a write there fails and takes the scan down with it. There is no ARMO
      # account, and report.armo.cloud is not in the egress allow-list, so the
      # submit path stays closed by construction as well.
      #
      # The artifact fetch this re-enables is already allowed by
      # cilium-network-policy.yaml (github.com + release-assets.githubusercontent.com,
      # added for exactly this download). Results still persist to the in-cluster
      # storage component (storage:true, keepLocal:true). Vulnerability scanning
      # (kubevuln) is unaffected either way — it never gated on the cloud submit.
      kubescapeOffline: disable
    # Enabling continuousScan also starts the operator's event-driven scan
    # service. Keep its resource set explicitly empty: operator v0.2.159 turns
    # this into an empty GVR watch pool, so scheduled keepLocal scans persist
    # detailed posture without restoring the per-resource queue flood observed
    # in issue #2463. Add a match only after that command path carries keepLocal.
    continuousScanning:
      matchingRules:
        match: []
        namespaces: []
    hostScanner:
      enabled: true
    nodeAgent:
      image:
        # Chart 1.40.2 pins node-agent v0.3.119, whose vendored inspektor-gadget
        # has a data race in GadgetPubSub.Publish -- under container churn the
        # DaemonSet dies with "fatal error: concurrent map writes" (observed
        # crashlooping every prod node, 15/8/3 restarts, during the 06-20..06-23
        # load). node-agent v0.3.128 fixed it by bumping the inspektor-gadget pin
        # (kubescape/node-agent#825); this pin also carries the later v0.3.132
        # (eBPF deadlock + OOM under load) and v0.3.136 (send-on-closed-channel
        # panic on SIGTERM/rolling restart) crash fixes. The chart's node-agent
        # default still lags the node-agent release train (kubevuln is already at
        # v0.3.142 in the same chart), so override it here; drop this once the
        # chart default catches up past v0.3.128.
        tag: v0.3.142
      config:
        hostSensor:
          enabled: true
      # Authored memory sizing — REQUIRED. DaemonSet VPAs are CPU-only (see
      # cluster-policies/best-practices/auto-vpa.yaml: VPA sized every node's
      # agent to the busiest node's peak — 523Mi/node × every node — which
      # ratcheted the cluster-autoscaler on 2026-06-30), so memory must be
      # authored here. Observed live range is 261–436Mi/node; request ≈
      # typical usage, limit covers scan-time spikes with headroom (the
      # kubescape LimitRange default limit is only 512Mi — too tight for scan
      # bursts). CPU request is the VPA floor; VPA still right-sizes CPU.
      resources:
        requests:
          cpu: 50m
          memory: 320Mi
        limits:
          memory: 1Gi
    kubescape:
      image:
        # The posture scanner applies the SecurityException / ClusterSecurityException CRDs
        # via its CRD exceptions getter (added in kubescape v4.0.9, kubescape#2291 + #2322).
        # Chart 1.40.2 pins the scanner to v4.0.8, which has NO such getter, so posture
        # exceptions are silently ignored no matter how the CRs are authored or what RBAC
        # exists. But v4.0.9's getter hard-coded the CRD apiVersion to kubescape.io/v1 while
        # the chart serves ONLY kubescape.io/v1beta1 — so its List() 404s and, as the
        # secondary/merged source, is silently swallowed → still ZERO exceptions applied
        # (dashboard "excluding 0 controls"). kubescape#2366 (first shipped in image v4.0.10)
        # switches the getter to v1beta1, so v4.0.10 is the first scanner that actually reads
        # our CRs offline. Paired with `cluster-role.yaml` + `cluster-role-binding.yaml`,
        # which grant the scanner SA the `list` RBAC the getter needs (the chart never grants
        # it). The merged getter still swallows a missing-RBAC/CRD source, so this bump cannot
        # break scans on its own. Drop this override + the reader RBAC once the chart grants
        # the securityexceptions RBAC and selects a scanner >= v4.0.14. v4.0.12 carries
        # kubescape#2556: without a configured SaaS backend, older images can auto-enable
        # submission and abort on account-ID chmod before the in-cluster receiver persists
        # posture results. It also ships the v0.13 CEL policy bundle, which lacks the
        # ValidatingAdmissionPolicy for C-0262 and makes every full cluster scan abort after
        # discovery. v4.0.13 refreshes that bundle to v0.14; v4.0.14 additionally fixes the
        # scanner's concurrent CEL parameter lookup. Keep the non-root security context;
        # the scanner fix makes chmod best-effort and preserves explicit local-only intent.
        # (Same component-image-ahead-of-chart pattern as the nodeAgent override above.)
        tag: v4.0.14
    # Force the scheduled posture scan to run LOCAL-ONLY. REQUIRED — this is the
    # only thing keeping the scan off the cloud-submit path now that
    # capabilities.kubescapeOffline is disabled (see the note there). The chart
    # renders the scan-scheduler ConfigMap request-body from this value, and the
    # scanner maps scanV1.keepLocal -> scanInfo.Local, forcing Submit=false: no
    # cloud submit, no account-ID generation, no config.json write.
    #
    # The chart force-injects the same keepLocal ONLY when kubescapeOffline is
    # enabled, so do NOT drop this override as redundant — with offline disabled
    # the chart injects nothing and removing it would restore Submit=true, whose
    # failure mode is a scan that aborts before persisting results. This value
    # fully replaces the chart default, so it must stay complete.
    kubescapeScheduler:
      # Preserve the current posture window explicitly. Chart 1.40.4 hashes one
      # shared cluster seed for both scheduler defaults, so posture and
      # vulnerability scans otherwise render to the same instant and contend
      # for the storage service's single-writer SQLite database.
      scanSchedule: "12 9 * * *"
      requestBody:
        commands:
          - CommandName: "kubescapeScan"
            args:
              scanV1:
                keepLocal: true
    # Run vulnerability collection in a separate authored window. Keep at
    # least the present eight-hour gap: both scans emit high-volume writes, and
    # the compatibility image still has one SQLite writer. Keep bursty scanners
    # separated to limit write bursts; one maintenance worker and short
    # source-row finalization keep SQLite's writer available between derived
    # profile writes.
    kubevulnScheduler:
      scanSchedule: "12 1 * * *"
    storage:
      image:
        # Storage v0.0.297 starts two deferred profile-maintenance workers. They
        # can both read and then race while promoting to SQLite's single writer;
        # a longer busy timeout cannot recover that promotion. One deferred
        # worker prevents that race, but a transaction spanning all derived
        # profile writes can still starve foreground scan persistence past the
        # scanner's deadline.
        # v0.0.303+ removes the ApplicationProfile and NetworkNeighborhood APIs
        # that this deployment still serves with live data. This compatibility
        # image is the exact v0.0.297 source plus the reviewed 60-second busy
        # timeout, one maintenance worker, autocommitted derived writes, and a
        # short atomic source-row finalization transaction. Executable failpoints
        # prove partial passes remain pending and replay to convergence. The
        # main-only publisher attaches SBOM/provenance and signs the digest
        # before this pin may advance.
        repository: ghcr.io/devantler-tech/platform-kubescape-storage
        tag: "v0.0.297-sqlite-contention.4-c674d63c1c391b47839a4a6246945b70ddfe1c01@sha256:e21df062e2c3598fec5b8c2170c5cc68ceeceb412379c3aef986b42c9a46241e"
        pullPolicy: IfNotPresent
    # Hetzner CSI provisions a minimum 10Gi volume; match the PVC request
    # to avoid Helm upgrade failures from PVC shrink rejection.
    persistence:
      size:
        backingStorage: 10Gi
    # Chart defaults are grossly overprovisioned for small clusters.
    # Align with VPA recommendations.
    kubevuln:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  # Drop all capabilities and pin a CONTAINER-level seccompProfile on the four
  # kubescape-operator Deployments. Post-rendered rather than set through
  # `values` above because the chart gives us no choice: kubescape-operator
  # 1.40.4 exposes NO securityContext value anywhere in values.yaml (zero
  # occurrences), and each component's Deployment template HARDCODES the
  # container securityContext to exactly `allowPrivilegeEscalation: false`
  # + `readOnlyRootFilesystem: true` + `runAsNonRoot: true` — with no
  # `capabilities` and no `seccompProfile`. `storage` is weaker still and ships
  # only the first and third of those.
  #
  # Every component already runs as uid 65532 with allowPrivilegeEscalation
  # false and binds only high ports (kubescape/kubevuln 8080, operator
  # 4002/8000/8443, storage none), so no component holds or needs a capability:
  # dropping ALL is a no-op at runtime and makes that guarantee explicit and
  # enforceable instead of incidental. A pod-level seccompProfile is already set
  # by the chart; the container-level copy states the same guarantee on the
  # container itself, so it survives a future template that sets a container
  # securityContext without inheriting the pod default.
  #
  # NOTE ON SCOPE — this hardens the workloads; it does NOT move a posture
  # score, and no scan will show the difference. These Deployments are scanned
  # by NEITHER surface: the operator's own config.json excludes its namespace
  # (`excludeNamespaces: "kubescape,kube-system,…"`), so the in-cluster scan
  # holds 0 objects for it (measured: 0 of 1542, across 39 scanned namespaces);
  # and the CI `ksail workload scan` reads manifests, where these exist only as
  # this HelmRelease and are never rendered. That blind spot is tracked
  # separately — do not read a green scan as evidence about this namespace.
  #
  # readOnlyRootFilesystem is deliberately NOT added to `storage`: it is an
  # aggregated APIServer backed by a RWO PVC and its write paths are unverified,
  # so that one needs its own evidence rather than riding along here.
  #
  # UPGRADE HAZARD, deliberately accepted: JSON-Patch `add` REPLACES an existing
  # key, so if a future chart version starts setting `capabilities` on one of
  # these containers, this patch silently overrides it rather than conflicting.
  # That is the intent today — nothing here needs a capability — but it means a
  # component that legitimately gains one would lose it without any error. Being
  # non-root does not make that safe on its own: a file capability on the binary
  # would still take effect. Re-check this patch when bumping the chart.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ^(kubescape|kubevuln|operator|storage)$
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext/capabilities
                value:
                  drop:
                    - ALL
              - op: add
                path: /spec/template/spec/containers/0/securityContext/seccompProfile
                value:
                  type: RuntimeDefault
          # Chart 1.40.4 removes this rule from the node-agent ClusterRole, but
          # node-agent still lists ApplicationProfiles during its storage
          # readiness gate. Restore exactly the read-only rule from 1.40.3 so
          # the upgrade does not expand the pre-existing platform boundary.
          # Keep NetworkNeighborhoods paired with ApplicationProfiles because
          # the runtime sensor reads both derived workload-profile resources.
          - target:
              kind: ClusterRole
              name: ^node-agent$
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups:
                    - spdx.softwarecomposition.kubescape.io
                  resources:
                    - applicationprofiles
                    - networkneighborhoods
                  verbs:
                    - get
                    - list
                    - watch
