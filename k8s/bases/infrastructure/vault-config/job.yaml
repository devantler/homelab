# Idempotent Job that initializes and configures OpenBao:
#
# Init containers:
#   1. vault-init  — waits for OpenBao, auto-initializes if needed, unseals
#                    EVERY raft pod individually (per-pod headless DNS — the
#                    round-robin `openbao` Service must never be used for
#                    init/unseal: consecutive requests land on different pods,
#                    which is exactly the "double-init split-brain" and
#                    "unseal-before-join" risk pair called out in
#                    docs/dr/openbao-raft-ha-migration.md). When the raft data
#                    is gone but the openbao-unseal Secret survived AND a raft
#                    snapshot exists on the vault-snapshots PVC, it restores
#                    the newest snapshot automatically instead of aborting
#                    (docs/dr/openbao.md).
#   2. store-keys  — persists unseal key + root token in a K8s Secret
#
# Main container (vault-config):
#   1. Enables KV v2 secrets engine
#   2. Enables Kubernetes auth method
#   3. Configures Kubernetes auth (in-cluster auto-discovery for CA + token reviewer)
#   4. Creates least-privilege policies
#   5. Creates auth roles mapping ServiceAccounts to policies
#   6. Configures OIDC auth (Dex) for human admin access
#   7. Configures the Database secrets engine for fleetdm MySQL rotation
#
# The file audit device is declared in the openbao HelmRelease config
# (declarative-only — OpenBao rejects runtime audit enables via API),
# so no runtime step is needed here for auditing.
#
# On fresh install the init containers auto-initialize the vault and create
# the openbao-unseal Secret. On Velero restore the Secret and PVC are both
# restored, so the postStart hook on the server pod already unseals — the
# init containers detect this and skip initialization.
#
# Safe to re-run — every step checks state before writing.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-config
  namespace: openbao
  annotations:
    # Force-recreate this Job when its spec drifts from the desired state.
    # Jobs are immutable, so without this Flux cannot reapply spec changes.
    # The Job script itself is idempotent — each command checks state first.
    kustomize.toolkit.fluxcd.io/force: enabled
    checkov.io/skip1: "CKV_K8S_38=the store-keys container writes the openbao-unseal Secret through kubectl"
    # Only the two openbao containers run below 10000, and their 100 IS the
    # openbao image's own baked identity rather than a choice this manifest
    # makes: the image carries `openbao:x:100:1000::/home/openbao` in its
    # /etc/passwd (verified against the pinned digest, not the tag), and
    # runAsUser/runAsGroup restate exactly that uid:gid pair. Raising it would
    # run the openbao binary as an identity its own image does not define.
    # Same image-baked class as umami's 1001 (#2901).
    #
    # A `checkov.io/skipN` directive is resource-scoped, so it silences the
    # check for EVERY container in this Job — which is why `runAsUser` is set
    # per container rather than once on the pod. `minio/mc` and `alpine/k8s`
    # bake no uid-100 entry of their own, so an inherited pod-level 100 would
    # have been an unjustified low-UID execution that this annotation then hid.
    # They take the pod's high 65532 default instead, leaving the suppression
    # covering only the two executions its rationale actually accounts for.
    checkov.io/skip2: "CKV_K8S_40=UID 100 is the openbao image's baked `openbao` user (openbao:x:100:1000 in its /etc/passwd), which runAsUser/runAsGroup restate; only the two openbao containers run it"
spec:
  # Auto-delete the Job (and its pods) 10 minutes after completion. Without
  # this, the `kustomize.toolkit.fluxcd.io/force: enabled` annotation above
  # makes Flux delete-and-recreate the Job on any spec change, orphaning the
  # previous Job's pods (they keep their original ownerReference UID, which
  # no longer matches anything, so the GC controller never reaps them).
  ttlSecondsAfterFinished: 600
  # Higher backoffLimit because openbao bootstrap can take 20-40 min on
  # cold CI runners — too low and the Job hits BackoffLimitExceeded before
  # openbao is fully ready, even though the script is idempotent and
  # would succeed on a later retry.
  backoffLimit: 30
  # Bound total Job runtime so a permanently-stuck pod doesn't run forever.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: vault-config
    spec:
      serviceAccountName: vault-config
      # The token is required: the store-keys container persists the unseal key
      # and root token by piping `kubectl create secret` into `kubectl apply`,
      # which authenticates to the API server with it. Left at the
      # mount-by-default value rather than set explicitly — an explicit `true`
      # reads identically to Kubernetes and trips Kubescape C-0034.
      restartPolicy: OnFailure
      # The full restricted-PSS context is set explicitly (not left to the
      # add-security-context Kyverno mutation) so the pod stays hardened
      # even when created before the webhook is active on fresh bring-up.
      securityContext:
        # The pod default is the high, unprivileged 65532. Only the two openbao
        # containers override it with 100, which is that image's own baked
        # identity (see the checkov.io/skip2 annotation above). The `mc` and
        # `alpine/k8s` containers bake no identity of their own, so they take
        # the high default rather than inheriting a UID chosen for openbao.
        runAsUser: 65532
        # The pod default gid is the same high 65532, for the same reason the
        # uid is: `mc` and `alpine/k8s` bake no group of their own, so a
        # pod-level 1000 would have been an unjustified low-GID execution that
        # the annotation above then hid.
        #
        # Cross-container access to /shared and /snapshots does NOT depend on
        # any container's primary gid — fsGroup supplies it. Kubernetes sets gid
        # 1000 AND the setgid bit on the emptyDir volumes, so a file created in
        # them inherits group 1000 whatever gid its writer runs as, and adds
        # 1000 to every container's supplementary groups so the others can still
        # read it. Verified against a paired control (#3258): with the setgid
        # bit the file lands group 1000 and a uid-100/gid-1000 reader CAN read
        # it; with the bit absent it lands group 65532 and that reader CANNOT.
        runAsGroup: 65532
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: unseal-keys
          secret:
            secretName: openbao-unseal
            optional: true
        - name: shared
          emptyDir:
            medium: Memory
        - name: oidc-secrets
          secret:
            secretName: vault-config-oidc
            optional: true
        # Local scratch for the newest raft snapshot, populated by the
        # fetch-snapshot initContainer from the OFF-CLUSTER mirror (Cloudflare R2
        # in prod, in-cluster MinIO locally) -- NOT the single-attach RWO
        # vault-snapshots PVC. Mounting that PVC here made vault-config attach the
        # hcloud volume on every hourly run and collide with the vault-snapshot
        # CronJob / vault-snapshot-init (both also mount it) -> hourly FailedMount
        # (exit 255 / "Resource busy"). R2 is also the copy that SURVIVES a
        # disaster that loses the local PVC, so it is the correct restore source.
        - name: snapshots
          emptyDir: {}
        # R2 credentials synced by ESO (vault-backup/external-secret.yaml).
        # Optional: on a fresh cluster the fetch container skips with a log line
        # until the sync lands; auto-restore degrades gracefully (see vault-init).
        - name: r2-credentials
          secret:
            secretName: vault-snapshot-r2
            optional: true
        - name: mc-config
          emptyDir: {}
      initContainers:
        # --- 0. Fetch newest snapshot from the off-cluster mirror (best-effort) ---
        # Pulls ONLY the newest raft snapshot from R2/MinIO into the shared
        # `snapshots` emptyDir so the vault-init container's DR auto-restore can
        # read it WITHOUT mounting the RWO vault-snapshots PVC. Best-effort by
        # design: in steady state (vault already initialized) vault-init never
        # reads /snapshots, and on a real DR an empty /snapshots makes vault-init
        # abort with its existing "no snapshot available" guidance -- so a missing
        # Secret or an R2 hiccup must NEVER fail this Job.
        - name: fetch-snapshot
          image: quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z@sha256:7e3efb09c22c0882fbf341b9d99f61f94ae6c4c20a06f2f1a2b20ea8993d8952
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # kubescape C-0270; generous for the mc download.
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: snapshots
              mountPath: /snapshots
            - name: r2-credentials
              mountPath: /r2
              readOnly: true
            - name: mc-config
              mountPath: /tmp/.mc
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /r2/access_key_id ]; then
                echo "vault-snapshot-r2 Secret not synced yet -- skipping snapshot"
                echo "fetch. Auto-restore aborts cleanly if a DR is in progress."
                exit 0
              fi
              # ${r2_endpoint}/${r2_bucket} are Flux post-build substitutions
              # (Cloudflare R2 in prod, in-cluster MinIO locally) -- the same vars
              # the vault-snapshot CronJob/init-job use to MIRROR; here we READ.
              mc alias set backup "${r2_endpoint}" \
                "$(cat /r2/access_key_id)" "$(cat /r2/secret_access_key)" || exit 0
              # Newest by name (openbao-YYYYMMDD-HHMMSS.snap sorts chronologically).
              LATEST=$(mc ls "backup/${r2_bucket}/openbao-snapshots/" 2>/dev/null \
                | awk '{print $NF}' | grep '\.snap$' | sort | tail -n1)
              if [ -z "$LATEST" ]; then
                echo "No snapshot in the mirror yet -- nothing to fetch."
                exit 0
              fi
              echo "Fetching newest snapshot $LATEST from the off-cluster mirror..."
              mc cp "backup/${r2_bucket}/openbao-snapshots/$LATEST" "/snapshots/$LATEST" || true
              ls -l /snapshots/ || true
        # --- 1. Auto-init + unseal ---
        - name: vault-init
          image: quay.io/openbao/openbao:2.5.3@sha256:fdc6da21ca6963560c32336fd7feb9cf2d5e52668f1a1647205a4b41171f0806
          securityContext:
            # The openbao image's own baked `openbao` user (openbao:x:100:1000
            # in its /etc/passwd) — see the checkov.io/skip2 rationale.
            runAsUser: 100
            # gid 1000 is the same baked identity (openbao:x:100:1000); these two
            # containers are the only ones that carry it.
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # No BAO_ADDR env: the script addresses each pod explicitly through
          # the openbao-internal headless Service (publishNotReadyAddresses:
          # true, so per-pod DNS resolves even before readiness).
          volumeMounts:
            - name: unseal-keys
              mountPath: /openbao/unseal
              readOnly: true
            - name: shared
              mountPath: /shared
            - name: snapshots
              mountPath: /snapshots
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # CPU limit for kubescape C-0270; generous so OpenBao init/config
              # work never throttles.
              cpu: 200m
              memory: 64Mi
          command:
            - /bin/sh
            - -ec
            - |
              # `openbao_replicas` is replaced by Flux post-build substitution
              # (same variable the HelmRelease uses); shell never sees it.
              REPLICAS="${openbao_replicas:=1}"
              LAST=$((REPLICAS - 1))

              addr() { echo "http://openbao-$1.openbao-internal:8200"; }
              pod_status() { BAO_ADDR="$(addr "$1")" bao status -format=json 2>/dev/null || true; }

              echo "Waiting for openbao-0 to be reachable..."
              until pod_status 0 | grep -q '"initialized"'; do
                echo "  ...openbao-0 not reachable yet"
                sleep 3
              done
              echo "openbao-0 is reachable."

              # Initialize EXACTLY ONCE, on openbao-0, and only when NO pod
              # reports an existing cluster. A fresh openbao-0 can report
              # initialized:false while peers already hold raft data (it
              # retry_joins only once a leader is unsealed) — initializing it
              # then would split-brain the cluster.
              ANY_INITIALIZED=false
              for i in $(seq 0 $LAST); do
                if pod_status "$i" | grep -q '"initialized": true'; then
                  ANY_INITIALIZED=true
                fi
              done

              if [ "$ANY_INITIALIZED" = "false" ]; then
                # Data-loss guard (#1982): keys in openbao-unseal mean a cluster
                # was initialized before. If on top of that NO pod reports an
                # initialized barrier, the raft data is missing or unreadable —
                # auto-initializing here would silently bring up an EMPTY vault
                # and overwrite the previous unseal key + root token (exactly
                # how the 2026-06-10 incident destroyed the whole KV store).
                # With a raft snapshot on the vault-snapshots PVC the data is
                # recoverable WITHOUT operator action: temp-init, restore the
                # newest snapshot, then unseal with the stored (pre-incident)
                # key. Only when no snapshot exists does the guard still abort.
                if [ -f /openbao/unseal/unseal-key ]; then
                  NEWEST_SNAP=$(ls -1t /snapshots/openbao-*.snap 2>/dev/null | head -n 1 || true)
                  if [ -z "$NEWEST_SNAP" ]; then
                    echo "ERROR: no pod reports an initialized vault, but the openbao-unseal"
                    echo "Secret still holds keys from a previously initialized cluster, and"
                    echo "no raft snapshot is available on the vault-snapshots PVC."
                    echo "Refusing to auto-initialize: that would create an empty vault and"
                    echo "overwrite the old keys, making any surviving data unrecoverable."
                    echo ""
                    echo "Recover the data first (Velero restore / reattach the old data"
                    echo "PVCs / copy a snapshot from the R2 openbao-snapshots/ mirror onto"
                    echo "the vault-snapshots PVC) and re-run this Job. If the data loss is"
                    echo "confirmed and a fresh vault is intended, acknowledge it explicitly:"
                    echo "  kubectl delete secret openbao-unseal -n openbao"
                    echo "and let the next Job run initialize from scratch."
                    exit 1
                  fi

                  echo "No initialized pod found, but openbao-unseal holds keys from a"
                  echo "previous cluster AND a raft snapshot exists:"
                  echo "  $NEWEST_SNAP"
                  echo "Running the automated snapshot restore (docs/dr/openbao.md)."

                  # 1. Temp-init openbao-0. These credentials live only in this
                  #    container's memory and stop mattering the moment the
                  #    snapshot is restored (the snapshot's barrier replaces
                  #    them). If the restore below fails, the raft holds an
                  #    empty temp vault: delete the openbao data PVCs and let
                  #    the pods + this Job re-run — the Secret and the snapshot
                  #    are untouched, so the restore retries from scratch.
                  INIT_OUTPUT=$(BAO_ADDR="$(addr 0)" bao operator init -key-shares=1 -key-threshold=1)
                  TMP_UNSEAL=$(echo "$INIT_OUTPUT" | grep "Unseal Key 1:" | sed 's/.*: //')
                  TMP_ROOT=$(echo "$INIT_OUTPUT" | grep "Initial Root Token:" | sed 's/.*: //')
                  if [ -z "$TMP_UNSEAL" ] || [ -z "$TMP_ROOT" ]; then
                    echo "ERROR: failed to parse temp init output (unseal key or root token missing)."
                    echo "Refusing to print raw output because it may contain secret material."
                    exit 1
                  fi

                  # 2. Unseal openbao-0 with the temp key and wait for a leader.
                  BAO_ADDR="$(addr 0)" bao operator unseal "$TMP_UNSEAL" >/dev/null
                  TRIES=24
                  until pod_status 0 | grep -q '"ha_mode": "active"'; do
                    TRIES=$((TRIES - 1))
                    if [ "$TRIES" -le 0 ]; then
                      echo "ERROR: openbao-0 never became the active node after temp init."
                      exit 1
                    fi
                    sleep 5
                  done

                  # 3. Restore the snapshot. -force skips the cluster-ID match
                  #    (the temp cluster's ID can never match the snapshot's).
                  echo "Restoring $NEWEST_SNAP..."
                  BAO_ADDR="$(addr 0)" BAO_TOKEN="$TMP_ROOT" \
                    bao operator raft snapshot restore -force "$NEWEST_SNAP"

                  # 4. The cluster's barrier is now the snapshot's, so the
                  #    stored pre-incident keys apply again — fall through to
                  #    the shared unseal loop with them. newly-initialized is
                  #    deliberately NOT written: store-keys must not overwrite
                  #    the openbao-unseal Secret that pairs with this snapshot.
                  cat /openbao/unseal/unseal-key > /shared/unseal-key
                  if [ -f /openbao/unseal/root-token ]; then
                    cat /openbao/unseal/root-token > /shared/root-token
                  fi
                  echo "Snapshot restored; unsealing with the stored key."
                else
                  echo "No initialized pod found — running bao operator init on openbao-0..."
                  INIT_OUTPUT=$(BAO_ADDR="$(addr 0)" bao operator init -key-shares=1 -key-threshold=1)

                  UNSEAL_KEY=$(echo "$INIT_OUTPUT" | grep "Unseal Key 1:" | sed 's/.*: //')
                  ROOT_TOKEN=$(echo "$INIT_OUTPUT" | grep "Initial Root Token:" | sed 's/.*: //')

                  if [ -z "$UNSEAL_KEY" ] || [ -z "$ROOT_TOKEN" ]; then
                    echo "ERROR: failed to parse init output (unseal key or root token missing)."
                    echo "Refusing to print raw output because it may contain secret material."
                    exit 1
                  fi

                  printf '%s' "$UNSEAL_KEY" > /shared/unseal-key
                  printf '%s' "$ROOT_TOKEN" > /shared/root-token
                  touch /shared/newly-initialized
                  echo "Vault initialized on openbao-0."
                fi
              else
                echo "Vault is already initialized."

                # Copy keys from the mounted Secret (Velero restore or previous init)
                if [ -f /openbao/unseal/unseal-key ] && [ -f /openbao/unseal/root-token ]; then
                  cat /openbao/unseal/unseal-key > /shared/unseal-key
                  cat /openbao/unseal/root-token > /shared/root-token
                elif [ -f /openbao/unseal/unseal-key ]; then
                  echo "WARNING: unseal-key present but root-token missing from openbao-unseal Secret."
                  echo "Restore the Secret from Velero backup or delete it and re-initialize."
                  cat /openbao/unseal/unseal-key > /shared/unseal-key
                fi
              fi

              if [ ! -f /shared/unseal-key ]; then
                echo "ERROR: vault is initialized but no unseal key is available."
                echo "Restore the openbao-unseal Secret from Velero backup or re-initialize."
                exit 1
              fi
              UNSEAL_KEY=$(cat /shared/unseal-key)

              # Unseal EVERY pod individually. Followers join the raft cluster
              # via retry_join only after a leader is unsealed, so loop until
              # all pods are unsealed or attempts run out. A wrong-key unseal
              # attempt fails harmlessly (logged) and never mutates state.
              ATTEMPTS=36
              while [ $ATTEMPTS -gt 0 ]; do
                ALL_UNSEALED=true
                for i in $(seq 0 $LAST); do
                  STATUS=$(pod_status "$i")
                  if echo "$STATUS" | grep -q '"sealed": false'; then
                    continue
                  fi
                  ALL_UNSEALED=false
                  if echo "$STATUS" | grep -q '"sealed": true'; then
                    echo "Unsealing openbao-$i..."
                    BAO_ADDR="$(addr "$i")" bao operator unseal "$UNSEAL_KEY" >/dev/null \
                      || echo "WARNING: unseal of openbao-$i failed (not joined yet, or key mismatch)"
                  else
                    echo "openbao-$i not reachable yet"
                  fi
                done
                if [ "$ALL_UNSEALED" = "true" ]; then
                  echo "All $REPLICAS pod(s) unsealed."
                  break
                fi
                ATTEMPTS=$((ATTEMPTS - 1))
                sleep 5
              done

              # Job succeeds if at least one pod is unsealed (the active
              # Service then has an endpoint); stragglers are logged above and
              # re-tried on every reconcile re-run of this Job.
              UNSEALED_ANY=false
              for i in $(seq 0 $LAST); do
                if pod_status "$i" | grep -q '"sealed": false'; then
                  UNSEALED_ANY=true
                fi
              done
              if [ "$UNSEALED_ANY" = "false" ]; then
                echo "ERROR: no pod could be unsealed — the stored key may not match this cluster."
                echo "After an automated snapshot restore this means the openbao-unseal Secret"
                echo "and the snapshot are from different generations — restore the matching"
                echo "pair (same backup day) and re-run. See docs/dr/openbao.md and"
                echo "docs/dr/openbao-raft-ha-migration.md for recovery."
                exit 1
              fi
              echo "Unseal phase complete."
        # --- 2. Persist credentials in K8s Secret (only on fresh init) ---
        - name: store-keys
          image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              # CPU limit for kubescape C-0270; generous so the kubectl step
              # never throttles.
              cpu: 250m
              memory: 256Mi
          command:
            - /bin/sh
            - -ec
            - |
              if [ -f /shared/newly-initialized ]; then
                echo "Storing vault credentials in openbao-unseal Secret..."
                kubectl create secret generic openbao-unseal \
                  --namespace=openbao \
                  --from-file=unseal-key=/shared/unseal-key \
                  --from-file=root-token=/shared/root-token \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "Secret openbao-unseal created."
              else
                echo "Vault was already initialized — no new keys to store."
              fi
      containers:
        - name: vault-config
          image: quay.io/openbao/openbao:2.5.3@sha256:fdc6da21ca6963560c32336fd7feb9cf2d5e52668f1a1647205a4b41171f0806
          securityContext:
            # The openbao image's own baked `openbao` user (openbao:x:100:1000
            # in its /etc/passwd) — see the checkov.io/skip2 rationale.
            runAsUser: 100
            # gid 1000 is the same baked identity (openbao:x:100:1000); these two
            # containers are the only ones that carry it.
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BAO_ADDR
              # openbao-active = unsealed Raft leader only. Configuration
              # writes must not round-robin onto sealed-but-Ready standbys
              # (503 "Vault is sealed").
              value: http://openbao-active.openbao.svc.cluster.local:8200
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: oidc-secrets
              mountPath: /vault-config/oidc
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # CPU limit for kubescape C-0270; generous so OpenBao init/config
              # work never throttles.
              cpu: 200m
              memory: 64Mi
          command:
            - /bin/sh
            - -ec
            - |
              set -e

              ROOT_TOKEN=$(cat /shared/root-token 2>/dev/null || true)
              if [ -z "$ROOT_TOKEN" ]; then
                echo "ERROR: root-token not available."
                echo "The vault-init container should have populated /shared/root-token."
                exit 1
              fi
              export BAO_TOKEN="$ROOT_TOKEN"

              # Wait for OpenBao to be unsealed
              echo "Waiting for OpenBao to be ready..."
              until bao status -format=json 2>/dev/null | grep -q '"sealed": false'; do
                echo "  ...waiting (sealed or unavailable)"
                sleep 5
              done
              echo "OpenBao is unsealed and ready."

              # --- 1. Enable KV v2 secrets engine ---
              if ! bao secrets list -format=json | grep -q '"secret/"'; then
                echo "Enabling KV v2 secrets engine at secret/..."
                bao secrets enable -path=secret -version=2 kv
              else
                echo "KV v2 already enabled at secret/."
              fi

              # --- 1b. Seed placeholder GitHub App credentials (only if absent) ---
              # provider-upjet-github (the github-config app) authenticates as a
              # GitHub App; its credentials live at secret/infrastructure/github/app
              # and are read by the github-app-credentials ExternalSecret. We seed
              # PLACEHOLDERS here declaratively (no SOPS) ONLY when the secret is
              # absent, so the maintainer can overwrite them in place via the
              # OpenBao UI/CLI and a later Job re-run won't clobber the real values.
              # OpenBao is backed up (Raft snapshots → R2 via Velero), so these
              # manually-set values are durable — no GitOps re-seed is needed.
              if ! bao kv get -mount=secret infrastructure/github/app >/dev/null 2>&1; then
                echo "Seeding placeholder GitHub App credentials at secret/infrastructure/github/app..."
                bao kv put -mount=secret infrastructure/github/app \
                  app_id="REPLACE_WITH_GITHUB_APP_ID" \
                  installation_id="REPLACE_WITH_GITHUB_APP_INSTALLATION_ID" \
                  pem="REPLACE_WITH_GITHUB_APP_PRIVATE_KEY_PEM"
              else
                echo "GitHub App credentials already present at secret/infrastructure/github/app (leaving as-is)."
              fi

              # --- 1c. Seed placeholder UniFi controller credentials (only if absent) ---
              # The `unifi` tenant's Crossplane provider (provider-upjet-unifi) reads
              # the UniFi credentials from secret/infrastructure/unifi/controller via
              # the unifi-controller-credentials ExternalSecret. We seed PLACEHOLDERS
              # here declaratively (no SOPS) ONLY when the secret is absent, so the
              # maintainer can overwrite them in place via the OpenBao UI/CLI and a
              # later Job re-run won't clobber the real values. OpenBao is backed up
              # (Raft snapshots → R2 via Velero), so these manually-set values are
              # durable — no GitOps re-seed is needed. GATE: overwrite `api_key` with a
              # UniFi Site Manager / Cloud API key that has WRITE scope (unifi.ui.com →
              # API, Site + Application scope) — the provider runs in Cloud Connector
              # mode (routes through https://api.ui.com), so a local Limited-Admin key
              # is NOT used, and `api_url` is left as an unused placeholder for a
              # possible future local/tunnel path.
              if ! bao kv get -mount=secret infrastructure/unifi/controller >/dev/null 2>&1; then
                echo "Seeding placeholder UniFi credentials at secret/infrastructure/unifi/controller..."
                bao kv put -mount=secret infrastructure/unifi/controller \
                  api_url="https://REPLACE_WITH_UNIFI_CONTROLLER_URL" \
                  api_key="REPLACE_WITH_UNIFI_API_KEY"
              else
                echo "UniFi credentials already present at secret/infrastructure/unifi/controller (leaving as-is)."
              fi

              # --- 1d. Seed placeholder UniFi WireGuard keys (only if absent) ---
              # The `unifi` tenant's WireGuard VPN Client managed resource
              # references these via the cluster-wireguard ExternalSecret: the
              # gateway's own private key (sensitive) and the Talos server's public
              # key (not secret, but the provider schema requires a Secret ref).
              # Placeholders until the platform WireGuard server lands; the
              # maintainer overwrites them in place via the OpenBao UI/CLI. Same
              # seed-if-absent + durable-via-backup pattern as the controller creds.
              if ! bao kv get -mount=secret infrastructure/unifi/wireguard >/dev/null 2>&1; then
                echo "Seeding placeholder UniFi WireGuard keys at secret/infrastructure/unifi/wireguard..."
                bao kv put -mount=secret infrastructure/unifi/wireguard \
                  private_key="REPLACE_WITH_GATEWAY_WIREGUARD_PRIVATE_KEY" \
                  peer_public_key="REPLACE_WITH_TALOS_WG_SERVER_PUBLIC_KEY"
              else
                echo "UniFi WireGuard keys already present at secret/infrastructure/unifi/wireguard (leaving as-is)."
              fi

              # --- 1e. Seed placeholder AWS bootstrap credentials (only if absent) ---
              # provider-aws-iam (the future `aws` tenant, platform#2325) authenticates
              # with a bootstrap IAM access key; it lives at
              # secret/infrastructure/aws/bootstrap and is read by the tenant's
              # aws-bootstrap-credentials ExternalSecret. We seed PLACEHOLDERS here
              # declaratively (no SOPS) ONLY when the secret is absent, so the
              # maintainer can overwrite them in place via the OpenBao UI/CLI and a
              # later Job re-run won't clobber the real values. OpenBao is backed up
              # (Raft snapshots → R2 via Velero), so these manually-set values are
              # durable — no GitOps re-seed is needed.
              if ! bao kv get -mount=secret infrastructure/aws/bootstrap >/dev/null 2>&1; then
                echo "Seeding placeholder AWS bootstrap credentials at secret/infrastructure/aws/bootstrap..."
                bao kv put -mount=secret infrastructure/aws/bootstrap \
                  access_key_id="REPLACE_WITH_AWS_ACCESS_KEY_ID" \
                  secret_access_key="REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
              else
                echo "AWS bootstrap credentials already present at secret/infrastructure/aws/bootstrap (leaving as-is)."
              fi

              # --- 1f. Retire the pre-isolation Velero repository password copy ---
              # The Velero kopia repository password used to be mirrored to
              # secret/infrastructure/backup/velero-repo, which the broad
              # infra-backup-readonly policy grants read on. It now lands at
              # secret/infrastructure/velero/repo instead (see the PushSecret in
              # vault-seed/), but a PushSecret only writes the new path -- it never
              # migrates or removes the old one. Left in place, the old entry stays
              # readable by every infra-backup-readonly holder, so the isolation
              # would not actually have happened.
              #
              # Destroy the old entry, but ONLY once the new path is confirmed to
              # hold the password, so a run that happens before ESO has synced can
              # never leave the platform with neither copy. `kv metadata delete`
              # removes every version plus the metadata (a plain `kv delete` only
              # soft-deletes the latest version and is trivially undeleted, which
              # would not remove the exposure). Both branches are idempotent, so a
              # later Job re-run is a no-op once the migration has completed.
              if bao kv get -mount=secret -field=repository-password \
                   infrastructure/velero/repo >/dev/null 2>&1; then
                if bao kv metadata get -mount=secret \
                     infrastructure/backup/velero-repo >/dev/null 2>&1; then
                  echo "Retiring pre-isolation copy at secret/infrastructure/backup/velero-repo..."
                  bao kv metadata delete -mount=secret infrastructure/backup/velero-repo
                  echo "Retired: the Velero repository password now lives only at secret/infrastructure/velero/repo."
                else
                  echo "No pre-isolation Velero repository password copy present (already retired)."
                fi
              else
                echo "WARNING: secret/infrastructure/velero/repo is not populated yet -- leaving the old copy at secret/infrastructure/backup/velero-repo in place until the PushSecret has synced."
              fi

              # --- 2. Enable Kubernetes auth ---
              if ! bao auth list -format=json | grep -q '"kubernetes/"'; then
                echo "Enabling Kubernetes auth method..."
                bao auth enable kubernetes
              else
                echo "Kubernetes auth already enabled."
              fi

              # --- 3. Configure Kubernetes auth ---
              # OpenBao auto-discovers the cluster CA and SA token when running
              # in-cluster, so only kubernetes_host is required.
              echo "Configuring Kubernetes auth..."
              bao write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc.cluster.local:443"

              # --- 4. Create policies ---
              echo "Writing vault policies..."

              bao policy write infra-backup-readonly - <<'POLICY'
              path "secret/data/infrastructure/backup/*" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write infra-dns-readonly - <<'POLICY'
              path "secret/data/infrastructure/dns/*" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write infra-monitoring-readonly - <<'POLICY'
              path "secret/data/infrastructure/monitoring/*" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write infra-hcloud-readonly - <<'POLICY'
              path "secret/data/infrastructure/hcloud/*" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write infra-tls-readonly - <<'POLICY'
              path "secret/data/infrastructure/tls/*" {
                capabilities = ["read"]
              }
              POLICY

              # Read the shared GHCR image-pull credential. Consumed by the
              # platform-authored `ghcr-auth` ExternalSecrets in the tenant
              # namespaces via the `external-secrets` ClusterSecretStore role, so
              # tenants get their pull secret from OpenBao instead of a per-tenant
              # SOPS file. Platform-side, not a tenant secret: those ExternalSecrets
              # are reconciled by flux-system, never by a tenant ServiceAccount.
              bao policy write infra-ghcr-readonly - <<'POLICY'
              path "secret/data/infrastructure/ghcr/*" {
                capabilities = ["read"]
              }
              POLICY

              # Read the GitHub App credential for provider-upjet-github
              # (declarative GitHub management). Consumed by the
              # github-app-credentials ExternalSecret in the github-config
              # namespace via the `external-secrets` ClusterSecretStore role;
              # seeded from variables-cluster by the seed-github-app PushSecret
              # (see k8s/bases/apps/github-config/).
              bao policy write infra-github-readonly - <<'POLICY'
              path "secret/data/infrastructure/github/*" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write app-fleetdm-readonly - <<'POLICY'
              path "secret/data/apps/fleetdm/*" {
                capabilities = ["read"]
              }
              POLICY

              # Read the OpenBao-rotated MySQL credential for the fleet app user
              # (Database secrets engine static role). Consumed by ESO via the
              # VaultDynamicSecret generator in the fleetdm namespace.
              bao policy write app-fleetdm-db-readonly - <<'POLICY'
              path "database/static-creds/fleet" {
                capabilities = ["read"]
              }
              POLICY

              # Read the OpenBao-rotated PostgreSQL credential for the umami app
              # user (Database secrets engine static role). Consumed by ESO via
              # the VaultDynamicSecret generator in the umami namespace.
              bao policy write app-umami-db-readonly - <<'POLICY'
              path "database/static-creds/umami" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write app-wedding-readonly - <<'POLICY'
              path "secret/data/apps/wedding-app/*" {
                capabilities = ["read"]
              }
              POLICY

              # Tenant-scoped policy for wedding-app's OWN namespaced SecretStore
              # (k8s/bases/apps/wedding-app/secretstore.yaml) and the ExternalSecret
              # the tenant ships in its deploy/ artifact. Read + seed-write, confined
              # to secret/{data,metadata}/apps/wedding-app/* so the tenant can both
              # seed (generator/PushSecret) and read its own app secrets and can
              # never reach infra or another tenant's path. Bound via the dedicated
              # `wedding-app` Kubernetes auth role below — NOT the broad shared
              # `external-secrets` role used by the ClusterSecretStore.
              bao policy write app-wedding-app - <<'POLICY'
              path "secret/data/apps/wedding-app/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/wedding-app/*" {
                capabilities = ["create", "update", "read"]
              }
              POLICY

              bao policy write app-umami-readonly - <<'POLICY'
              path "secret/data/apps/umami/*" {
                capabilities = ["read"]
              }
              POLICY

              # actual-budget reads its Enable Banking bank-sync credential
              # (application-id + secret-key) from OpenBao via the shared
              # `external-secrets` ClusterSecretStore role (apps/actual-budget/
              # enablebanking); the path is create-seeded with placeholders by
              # the seed-actual-budget-enablebanking PushSecret in
              # infrastructure/vault-seed and the operator types the real values
              # in by hand. Read back by the actual-budget
              # external-secret-enablebanking ExternalSecret.
              bao policy write app-actual-budget-readonly - <<'POLICY'
              path "secret/data/apps/actual-budget/*" {
                capabilities = ["read"]
              }
              POLICY

              # crossview reads its bundled-Postgres password, app session secret,
              # and break-glass admin password from OpenBao via the shared
              # `external-secrets` ClusterSecretStore role (apps/crossview/{db,app,
              # admin}); the values are generated and seeded by
              # infrastructure/vault-seed. (Its OIDC client secret is read from the
              # shared infrastructure/oidc/dex path via infra-oidc-readonly, also on
              # that role — no crossview-specific grant needed.)
              bao policy write app-crossview-readonly - <<'POLICY'
              path "secret/data/apps/crossview/*" {
                capabilities = ["read"]
              }
              POLICY

              # actual-budget reads its Enable Banking bank-sync credentials from
              # OpenBao via the shared `external-secrets` ClusterSecretStore role
              # (apps/actual-budget/enablebanking). The value is seeded as a
              # placeholder by infrastructure/vault-seed and overwritten with the
              # real credentials out of band. (Its OIDC client secret is read from
              # the shared infrastructure/oidc/dex path via infra-oidc-readonly,
              # also on that role — no actual-budget-specific grant needed for it.)
              bao policy write app-actual-budget-readonly - <<'POLICY'
              path "secret/data/apps/actual-budget/*" {
                capabilities = ["read"]
              }
              POLICY

              # Read-only view of ascoachingogvaner's app path for the shared
              # ClusterSecretStore bundle: the cert-manager simply.com DNS01
              # solver consumes the tenant-owned simply.com API credentials
              # (apps/ascoachingogvaner/simply) to issue the tenant's
              # certificate on the shared Gateway.
              bao policy write app-ascoachingogvaner-readonly - <<'POLICY'
              path "secret/data/apps/ascoachingogvaner/*" {
                capabilities = ["read"]
              }
              POLICY

              # Tenant-scoped policy for ascoachingogvaner's OWN namespaced
              # SecretStore (k8s/bases/apps/ascoachingogvaner/secretstore.yaml)
              # and the ExternalSecrets the tenant ships in its deploy/ artifact
              # (today: the simply.com credentials for its tenant-owned
              # external-dns). Read + seed-write, confined to
              # secret/{data,metadata}/apps/ascoachingogvaner/* — mirrors
              # app-wedding-app. Bound via the dedicated `ascoachingogvaner`
              # Kubernetes auth role below.
              bao policy write app-ascoachingogvaner - <<'POLICY'
              path "secret/data/apps/ascoachingogvaner/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/ascoachingogvaner/*" {
                capabilities = ["create", "update", "read"]
              }
              POLICY

              bao policy write infra-oidc-readonly - <<'POLICY'
              path "secret/data/infrastructure/oidc/*" {
                capabilities = ["read"]
              }
              POLICY

              # UniFi controller API credentials read by the `unifi` tenant's
              # ExternalSecret (providers/hetzner/unifi/). Not bootstrap-critical
              # — the network keeps serving while the reconcile waits.
              bao policy write infra-unifi-readonly - <<'POLICY'
              path "secret/data/infrastructure/unifi/*" {
                capabilities = ["read"]
              }
              POLICY

              # AWS bootstrap IAM access key read by the future `aws` tenant's
              # ExternalSecret (platform#2325; seeded as a placeholder in step 1e).
              # Scoped to the aws path only — the tenant role below carries just
              # this policy, mirroring github-config/unifi isolation.
              bao policy write infra-aws-readonly - <<'POLICY'
              path "secret/data/infrastructure/aws/*" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write vault-snapshot-readonly - <<'POLICY'
              path "sys/health" {
                capabilities = ["read"]
              }
              # Raft snapshot export for the vault-snapshot CronJob
              # (GET /v1/sys/storage/raft/snapshot).
              path "sys/storage/raft/snapshot" {
                capabilities = ["read"]
              }
              POLICY

              bao policy write vault-admin - <<'POLICY'
              path "*" {
                capabilities = ["create", "read", "update", "delete", "list", "sudo"]
              }
              POLICY

              bao policy write vault-seed-write - <<'POLICY'
              # Write access for seeding vault from PushSecrets.
              # Paths must be at least as specific as the read-only policies
              # because Vault ACL uses most-specific-path-wins resolution.
              path "secret/data/infrastructure/backup/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/dns/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/monitoring/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/hcloud/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/tls/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/oidc/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/git/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/ghcr/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/infrastructure/velero/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/apps/fleetdm/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/apps/wedding-app/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/apps/umami/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/apps/actual-budget/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/apps/crossview/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/apps/actual-budget/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/data/flux/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/backup/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/dns/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/monitoring/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/hcloud/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/tls/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/oidc/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/git/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/ghcr/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/infrastructure/velero/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/fleetdm/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/wedding-app/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/umami/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/actual-budget/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/crossview/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/apps/actual-budget/*" {
                capabilities = ["create", "update", "read"]
              }
              path "secret/metadata/flux/*" {
                capabilities = ["create", "update", "read"]
              }
              POLICY

              # --- 5. Create auth roles ---
              echo "Writing Kubernetes auth roles..."

              # ESO needs broad read access for ExternalSecrets + write for PushSecrets.
              # This role is bound to the ESO controller's own SA via the
              # `openbao` ClusterSecretStore and covers KV-engine reads only.
              # The fleetdm MySQL Database-engine static credential is handled
              # by a separate, narrowly scoped role below — keep
              # app-fleetdm-db-readonly off this bundle.
              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=infra-backup-readonly,infra-dns-readonly,infra-monitoring-readonly,infra-hcloud-readonly,infra-tls-readonly,infra-ghcr-readonly,app-fleetdm-readonly,app-wedding-readonly,app-umami-readonly,app-actual-budget-readonly,app-crossview-readonly,app-ascoachingogvaner-readonly,infra-oidc-readonly,vault-seed-write \
                ttl=1h

              # Dedicated role for the fleetdm VaultDynamicSecret generator.
              # The generator authenticates with the `external-secrets` SA in
              # the fleetdm namespace (the generator's own namespace — ESO
              # silently ignores serviceAccountRef.namespace for generators,
              # see ESO #4629). Scoped to the database static-creds read only.
              bao write auth/kubernetes/role/fleetdm-mysql-rotated \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=fleetdm \
                policies=app-fleetdm-db-readonly \
                ttl=1h

              # Dedicated role for the umami VaultDynamicSecret generator (the
              # `external-secrets` SA in the umami namespace — same ESO #4629
              # constraint as fleetdm). Scoped to the umami DB static-creds read.
              bao write auth/kubernetes/role/umami-db-rotated \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=umami \
                policies=app-umami-db-readonly \
                ttl=1h

              # Dedicated tenant role for github-config. Authenticates the app's
              # own `github-config` ServiceAccount (used by its namespaced
              # SecretStore, k8s/bases/apps/github-config/secret-store.yaml) and
              # carries ONLY `infra-github-readonly` (read on
              # secret/data/infrastructure/github/*) — never the broad
              # `external-secrets` bundle — so the tenant can read the GitHub App
              # credential and nothing else.
              bao write auth/kubernetes/role/github-config \
                bound_service_account_names=github-config \
                bound_service_account_namespaces=github-config \
                policies=infra-github-readonly \
                ttl=1h

              # Dedicated tenant role for the unifi app. Authenticates the app's
              # own `unifi` ServiceAccount (used by its namespaced SecretStore,
              # providers/hetzner/apps/unifi/secret-store.yaml) and carries ONLY
              # `infra-unifi-readonly` (read on secret/data/infrastructure/unifi/*)
              # — never the broad `external-secrets` bundle — so the tenant reads
              # its UniFi controller credentials + WireGuard keys and nothing else.
              bao write auth/kubernetes/role/unifi \
                bound_service_account_names=unifi \
                bound_service_account_namespaces=unifi \
                policies=infra-unifi-readonly \
                ttl=1h

              # Dedicated tenant role for the aws tenant (platform#2325).
              # Authenticates the tenant's own `aws` ServiceAccount (used by its
              # namespaced SecretStore once the devantler-tech/aws tenant wiring
              # lands) and carries ONLY `infra-aws-readonly` (read on
              # secret/data/infrastructure/aws/*) — never the broad
              # `external-secrets` bundle — so the tenant reads its bootstrap IAM
              # access key and nothing else. Declared ahead of the namespace/SA:
              # an auth role is inert config until something authenticates with it.
              bao write auth/kubernetes/role/aws \
                bound_service_account_names=aws \
                bound_service_account_namespaces=aws \
                policies=infra-aws-readonly \
                ttl=1h

              # Dedicated tenant role for wedding-app. Authenticates the tenant's
              # own `wedding-app` ServiceAccount (used by its namespaced
              # SecretStore + deploy/ ExternalSecret) and carries ONLY the
              # path-scoped `app-wedding-app` policy — never the broad
              # `external-secrets` bundle — so the tenant is confined to
              # secret/{data,metadata}/apps/wedding-app/*. This is what lets
              # wedding-app source its app secrets from OpenBao via a namespaced
              # store instead of SOPS, with per-tenant Vault isolation.
              bao write auth/kubernetes/role/wedding-app \
                bound_service_account_names=wedding-app \
                bound_service_account_namespaces=wedding-app \
                policies=app-wedding-app \
                ttl=1h

              # Dedicated tenant role for ascoachingogvaner — same shape as
              # wedding-app above. Authenticates the tenant's own
              # `ascoachingogvaner` ServiceAccount (used by its namespaced
              # SecretStore + deploy/ ExternalSecret) and carries ONLY the
              # path-scoped `app-ascoachingogvaner` policy, confining the
              # tenant to secret/{data,metadata}/apps/ascoachingogvaner/*.
              bao write auth/kubernetes/role/ascoachingogvaner \
                bound_service_account_names=ascoachingogvaner \
                bound_service_account_namespaces=ascoachingogvaner \
                policies=app-ascoachingogvaner \
                ttl=1h

              # Snapshot CronJob needs health check read
              bao write auth/kubernetes/role/vault-snapshot \
                bound_service_account_names=vault-snapshot \
                bound_service_account_namespaces=openbao \
                policies=vault-snapshot-readonly \
                ttl=15m

              # --- 6. Enable OIDC auth (Dex) ---
              if ! bao auth list -format=json | grep -q '"oidc/"'; then
                echo "Enabling OIDC auth method..."
                bao auth enable oidc
              else
                echo "OIDC auth already enabled."
              fi

              DEX_SECRET=$(cat /vault-config/oidc/dex-client-secret 2>/dev/null || echo "")
              if [ -n "$DEX_SECRET" ]; then
                # Dex lives in the 'infrastructure' Flux layer and isn't
                # reachable when this Job first runs from
                # 'infrastructure-controllers'. The OIDC config write
                # validates the discovery URL, so it will 400 until Dex is
                # up. Treat that as expected on first pass — Flux will
                # recreate this Job on the next reconcile once Dex is
                # ready (force annotation), and the block will succeed.
                echo "Configuring OIDC auth with Dex..."
                if bao write auth/oidc/config \
                  oidc_discovery_url="https://dex.${domain}" \
                  oidc_client_id="public-client" \
                  oidc_client_secret="$DEX_SECRET" \
                  default_role="admin"; then

                  # bound_claims is a map. OpenBao's CLI cannot set map
                  # values through key=value arguments, so write the complete
                  # role as a typed JSON document.
                  bao write auth/oidc/role/admin - <<'OIDC_ROLE_JSON'
                  {
                    "bound_audiences": ["public-client"],
                    "allowed_redirect_uris": [
                      "https://vault.${domain}/ui/vault/auth/oidc/oidc/callback",
                      "http://localhost:8250/oidc/callback"
                    ],
                    "user_claim": "email",
                    "groups_claim": "groups",
                    "oidc_scopes": ["openid", "email", "profile", "groups"],
                    "bound_claims": {
                      "email": ["${admin_email}"],
                      "groups": ["devantler-tech:maintainers"]
                    },
                    "policies": ["vault-admin"],
                    "ttl": "8h"
                  }
              OIDC_ROLE_JSON

                  # Make OIDC the default auth method on the login page
                  bao auth tune -listing-visibility=unauth oidc/
                  echo "OIDC auth configured."
                else
                  echo "OIDC discovery URL not yet reachable (Dex not ready) -- skipping."
                  echo "It will be configured on the next vault-config reconciliation."
                fi
              else
                echo "OIDC secret not yet available -- skipping OIDC configuration."
                echo "It will be configured on the next vault-config reconciliation."
              fi

              # NOTE: the file audit device used to be enabled here at
              # runtime. OpenBao rejects that path -- `bao audit enable`
              # returns "cannot enable audit device via API; use
              # declarative, config-based audit device management
              # instead". The audit device is now declared in the
              # openbao HelmRelease's standalone.config HCL, alongside
              # listener and storage:
              #
              #   audit "file" {
              #     type    = "file"
              #     path    = "file/"
              #     options = {
              #       file_path = "/openbao/audit/audit.log"
              #     }
              #   }
              #
              # See https://openbao.org/docs/configuration/audit for the
              # full shape (both `type` and `path` are required). No
              # runtime step is needed for OpenBao to start auditing.

              # --- 7. Database secrets engine: fleetdm MySQL static-role rotation ---
              # OpenBao owns and periodically rotates the 'fleet' MySQL user's
              # password; ESO reads the current value via the VaultDynamicSecret
              # generator in the fleetdm namespace.
              if ! bao secrets list -format=json | grep -q '"database/"'; then
                echo "Enabling database secrets engine..."
                bao secrets enable database
              else
                echo "Database secrets engine already enabled."
              fi

              # OpenBao needs MySQL admin (root) creds to manage the fleet user;
              # the root password is seeded into KV by the fleetdm PushSecret.
              FLEET_DB_ROOT=$(bao kv get -mount=secret -field=mysql-root-password apps/fleetdm/mysql 2>/dev/null || echo "")
              if [ -n "$FLEET_DB_ROOT" ]; then
                # Writing the connection validates connectivity, so this 400s
                # until fleetdm-mysql is up (apps layer). Treat that as expected
                # on early passes -- Flux recreates this Job (force annotation)
                # and the block succeeds once MySQL is reachable.
                echo "Configuring fleetdm MySQL database connection..."
                if bao write database/config/fleetdm-mysql \
                  plugin_name=mysql-database-plugin \
                  allowed_roles="fleet" \
                  connection_url="{{username}}:{{password}}@tcp(fleetdm-mysql.fleetdm.svc.cluster.local:3306)/" \
                  username="root" \
                  password="$FLEET_DB_ROOT" 2>/dev/null; then

                  # Create the static role only if absent: creation triggers an
                  # initial rotation of the 'fleet' user's password (the fleetdm
                  # ExternalSecret + Reloader then pick it up). Guarding avoids
                  # re-rotating on every idempotent Job re-run. App user only,
                  # never root.
                  if ! bao read database/static-roles/fleet >/dev/null 2>&1; then
                    # Default rotation: 168h (7 days). Was 2160h (90 days)
                    # which gave a leaked credential a 90-day half-life.
                    # 7 days matches HashiCorp's documented sweet spot for
                    # interactive workloads (long enough that cache misses
                    # are rare, short enough that a leak is bounded).
                    # Overridable via the fleetdm_mysql_rotation_period
                    # cluster variable for fork operators with different
                    # constraints.
                    bao write database/static-roles/fleet \
                      db_name=fleetdm-mysql \
                      username="fleet" \
                      rotation_period="${fleetdm_mysql_rotation_period:=168h}"
                    echo "fleetdm MySQL static role created."
                  else
                    echo "fleetdm MySQL static role already exists."
                  fi
                else
                  echo "fleetdm MySQL not reachable yet -- skipping DB role config."
                  echo "It will be configured on the next vault-config reconciliation."
                fi
              else
                echo "fleetdm MySQL root credential not in KV yet -- skipping DB role config."
              fi

              # --- 8. Database secrets engine: umami PostgreSQL static-role rotation ---
              # OpenBao owns and rotates the 'umami' PostgreSQL user's password on
              # a 7-day static-role schedule; ESO reads the current value via the
              # VaultDynamicSecret generator in the umami namespace. The connection
              # admin is the CNPG-managed postgres superuser (stable, not rotated),
              # whose password is synced into KV by the umami db-superuser PushSecret.
              UMAMI_DB_SUPER=$(bao kv get -mount=secret -field=postgres-password apps/umami/db 2>/dev/null || echo "")
              if [ -n "$UMAMI_DB_SUPER" ]; then
                # Writing the connection validates connectivity, so this fails
                # until umami-db (CNPG, apps layer) is up. Treat that as expected
                # on early passes -- Flux recreates this Job (force annotation)
                # and the block succeeds once PostgreSQL is reachable.
                echo "Configuring umami PostgreSQL database connection..."
                if bao write database/config/umami-postgres \
                  plugin_name=postgresql-database-plugin \
                  allowed_roles="umami" \
                  connection_url="postgresql://{{username}}:{{password}}@umami-db-rw.umami.svc.cluster.local:5432/umami?sslmode=require" \
                  username="postgres" \
                  password="$UMAMI_DB_SUPER" 2>/dev/null; then

                  # Create the static role only if absent: creation triggers an
                  # initial rotation of the 'umami' user's password (the umami
                  # ExternalSecret then picks it up). Guarding avoids re-rotating
                  # on every idempotent Job re-run. App user only, never superuser.
                  if ! bao read database/static-roles/umami >/dev/null 2>&1; then
                    bao write database/static-roles/umami \
                      db_name=umami-postgres \
                      username="umami" \
                      rotation_period="${umami_db_rotation_period:=168h}"
                    echo "umami PostgreSQL static role created."
                  else
                    echo "umami PostgreSQL static role already exists."
                  fi
                else
                  echo "umami PostgreSQL not reachable yet -- skipping DB role config."
                  echo "It will be configured on the next vault-config reconciliation."
                fi
              else
                echo "umami PostgreSQL superuser credential not in KV yet -- skipping DB role config."
              fi

              echo "Vault configuration complete."
