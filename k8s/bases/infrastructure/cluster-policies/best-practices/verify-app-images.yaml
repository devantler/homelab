---
# All first-party images share one IVPOL because Kyverno v1.18.2 replaces the
# image-verification outcomes annotation rather than merging it when multiple
# fine-grained mutating webhooks run. Splitting the app/provider and KSail
# identities across timeout-bearing IVPOLs therefore makes the later webhook
# erase the earlier policy's result and fail-closes validation with
# "policy not evaluated". Keep the identities in separate attestors and CEL
# filters inside this one policy so each image class remains independently
# constrained while slow, cold signature lookups get the 30-second budget.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-app-images
  annotations:
    policies.kyverno.io/title: Verify First-Party Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires keyless cosign signatures from the matching devantler-tech
      release pipeline on first-party container images at Pod admission:
      publish-app for app images, the platform's dedicated Kubescape storage
      compatibility publisher, each Crossplane provider's own package workflow,
      and KSail's release workflow. Each class is verified only against its own
      identity; third-party images admit unverified.
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  # Keyless verification can need more than the default 10s while GHCR or the
  # Sigstore trust root is cold. Kyverno caps admission webhook timeouts at 30s.
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchImageReferences:
    # The expression variable for image references is `ref`. Keep KSail in a
    # separate matcher so the app expression cannot route it to publishapp.
    - expression: >-
        ref.startsWith('ghcr.io/devantler-tech/') &&
        !ref.startsWith('ghcr.io/devantler-tech/ksail')
    - glob: ghcr.io/devantler-tech/ksail*
  credentials:
    secrets: [ghcr-auth]
  validationConfigurations:
    required: true
    verifyDigest: false
    mutateDigest: false
  attestors:
    - name: publishapp
      cosign:
        keyless:
          # publish-app.yaml lives in the actions monorepo. Callers pin that
          # reusable workflow by commit SHA, so the ref admits that form alone
          # and rejects everything else — a mutable ref such as @main, and a
          # release tag — the same shape as the tenants' Flux OCIRepository
          # verify blocks (#3022). Keep this to exactly ONE identity
          # entry: the IVPOL engine verifies cosign v3 bundles through
          # sigstore-go, which rejects more than one identity per verification
          # ("unsupported: multiple identities are not supported at this
          # time" — sigstore/cosign pkg/cosign/verify.go), so a second entry
          # fail-closes EVERY image this attestor gates (observed live
          # 2026-07-04: wedding-app v1.14.1 denied at admission for hours,
          # wedging the whole merge queue). Express any additional accepted
          # form as an alternation inside this one regex.
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/actions/\.github/workflows/publish-app\.yaml@[0-9a-f]{40}$
    # The Kubescape storage compatibility image is produced inside this
    # repository rather than through actions/publish-app.yaml: its publisher
    # checks out one immutable upstream storage commit, applies the reviewed
    # timeout patch, tests it, and signs only from main. Keep this identity in a
    # separate attestor and route only the exact storage repository to it; adding
    # the identity to publishapp would let this one-off workflow satisfy
    # verification for every ordinary first-party app image.
    - name: publishkubescapestorage
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kubescape-storage-hotfix\.yaml@refs/heads/main$
    # Crossplane provider packages (provider-upjet-*): the crossplane-contrib
    # reusable publish workflow they use cannot sign, so each provider repo
    # attaches the keyless signature in its own publish-provider-package.yml
    # follow-up job (provider-upjet-unifi#12), which is the workflow identity
    # Fulcio certifies. Their package-runtime Deployments run the package
    # image itself, so without this identity every devantler-tech provider
    # pod is denied at admission (observed on prod 2026-07-02:
    # provider-upjet-unifi stuck 0/1, the whole UniFi Crossplane migration
    # stalled). Kept as a SEPARATE attestor, verified only against
    # provider-upjet-* images in the validations below — folding it into
    # publishapp would let a provider-workflow signature satisfy
    # verification for ANY app image (identities within one attestor are
    # OR'd per image).
    # The ref is pinned to release tags: publish-provider-package.yml rejects
    # any non-tag ref before it checks anything out, so a v* tag is the sole
    # legitimate signing ref. Pinning it rejects a package signed from an
    # arbitrary branch, which an unconstrained ref accepts.
    # The tag grammar mirrors the publisher's `scripts/release-version.sh` OCI-semver
    # grammar, spelled out here rather than deferred to it: this verifier is the
    # independent half of that pair, so it must not inherit its boundary from the
    # repository it verifies.
    # A trailing `.+` after the version would accept refs/tags/v1latest and
    # refs/tags/v1.0.0/../evil, which are tags only in shape.
    # DELIBERATE DIFFERENCE from the publisher, pinned by the inventory test: that script also
    # caps the tag at 128 characters (the OCI tag-length limit); this expression does not.
    # RE2 has no lookahead, so a joint length bound across the version components cannot be
    # expressed without bounding each part separately, and a bound set too tight would REJECT a
    # legitimate release — breaking admission of a real image, which is strictly worse than
    # admitting an identity that cannot exist. An over-length tag is not a valid OCI reference,
    # so no signature can carry one.
    - name: publishprovider
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/provider-upjet-[a-z0-9-]+/\.github/workflows/publish-provider-package\.yml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
    # ksail images are signed by ksail's OWN release pipeline (cd.yaml). The
    # ref is pinned to the release-tag GRAMMAR, not merely to `v*`: cd.yaml
    # signs on any `v*` tag push and checks nothing about the tag itself, so a
    # `v.+` ref clause would accept refs/tags/vanything and refs/tags/v/../evil,
    # which are tags in shape only. Same OCI-semver grammar and same DELIBERATE
    # no-length-cap difference as the provider identity above; kept
    # byte-identical to the Talos ImageVerificationConfig rule by the inventory
    # test. The publisher's own check is tracked at devantler-tech/ksail#6895.
    - name: ksailcd
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/ksail/\.github/workflows/cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image, image.startsWith('ghcr.io/devantler-tech/') &&
          !image.startsWith('ghcr.io/devantler-tech/ksail') &&
          !image.startsWith('ghcr.io/devantler-tech/provider-upjet-') &&
          image != 'ghcr.io/devantler-tech/platform-kubescape-storage' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage@'))
        .map(image, verifyImageSignatures(image, [attestors.publishapp]))
        .all(e, e > 0)
      message: >-
        first-party app image is not signed by the publish-app release
        pipeline (keyless cosign, actions publish-app.yaml identity, pinned by
        commit SHA — a release tag is not accepted)
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-kubescape-storage' ||
          image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage@'))
        .map(image, verifyImageSignatures(image, [attestors.publishkubescapestorage]))
        .all(e, e > 0)
      message: >-
        Kubescape storage compatibility image is not signed by the platform
        repository's dedicated main-branch publisher (keyless cosign)
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image, image.startsWith('ghcr.io/devantler-tech/provider-upjet-'))
        .map(image, verifyImageSignatures(image, [attestors.publishprovider]))
        .all(e, e > 0)
      message: >-
        provider-upjet package image is not signed by its repo's
        publish-provider-package workflow from a release tag (keyless cosign)
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image, image.startsWith('ghcr.io/devantler-tech/ksail'))
        .map(image, verifyImageSignatures(image, [attestors.ksailcd]))
        .all(e, e > 0)
      message: >-
        ksail image is not signed by the ksail release pipeline
        (keyless cosign, ksail cd.yaml tag identity)
