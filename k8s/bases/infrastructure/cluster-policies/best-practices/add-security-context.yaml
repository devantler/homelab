# Mutates pods — and, in namespaces opted in to the baseline-context rules, the
# stored specs of their controllers — to apply security best-practices that
# kubescape checks:
# - seccompProfile: RuntimeDefault (C-0055 Linux hardening) — pod + container
# - allowPrivilegeEscalation: false (C-0016)
# - readOnlyRootFilesystem: true (C-0017)
# - drop ALL capabilities (C-0055)
# - runAsNonRoot: true (C-0013) — pod + container
# - runAsUser: 1000 + runAsGroup: 1000 (C-0013/C-0211 non-root user+group) — pod level
# - fsGroup: 1000 + fsGroupChangePolicy: OnRootMismatch (C-0211) — pod level
# - seLinuxOptions: {} (C-0211 CIS-5.7.3) — containers + initContainers
# - hostUsers: false — only in namespaces that explicitly opt in after userns
#   validation
#
# Together these complete the security context kubescape's CIS-5.7.3 (C-0211) checks
# (non-root-containers, set-fsgroup-value, set-fsgroupchangepolicy-value,
# set-seLinuxOptions). Why each is safe to inject cluster-wide:
# - runAsUser and runAsGroup are injected TOGETHER at the POD level, and only there.
#   A pod-level runAsGroup with NO runAsUser yields the OCI user string ":1000",
#   which containerd rejects ("user group \"1000\" is specified without user") so the
#   pod sandbox never starts. Injecting runAsGroup alone did exactly that to homepage
#   (its chart sets runAsUser only at the CONTAINER level) and to tofu-controller's
#   tf-runner. Pairing a matching runAsUser:1000 keeps the pod-level user+group
#   complete so the sandbox always builds. Both use +(key) conditional anchors: a
#   chart that sets its own pod-level value keeps it, and a container that sets its
#   own runAsUser still overrides this pod-level default for that container (so e.g.
#   homepage's container keeps runAsUser:1000, auth-proxy keeps 65532, etc.).
# - EXEMPTIONS — images with a baked-in non-1000 UID and no chart-set runAsUser must
#   NOT be forced to 1000 (cert-manager / trust-manager / origin-ca-issuer = 65532,
#   keda = 65532, opencost = 1001; tofu-controller tf-runner takes its UID from its
#   runnerPodTemplate). They are excluded from add-pod-security-context and handled by
#   add-imageuid-pod-security-context below, which supplies pod-level seccomp,
#   runAsNonRoot, fsGroup and fsGroupChangePolicy but NEITHER runAsUser NOR runAsGroup
#   — so they keep their image UID and their sandbox still builds (no group without
#   user). Add a namespace here only when a workload genuinely cannot run as 1000;
#   the default (forced 1000:1000) is the more hardened posture.
# - fsGroup uses a conditional anchor, so any workload that sets its own (every
#   PVC-mounting workload in scope does) keeps it; only stateless pods get the
#   default, where it governs emptyDir/projected-volume ownership harmlessly.
# - Empty seLinuxOptions satisfies C-0211 without pinning a level or type.
#   The runtime retains its default SELinux type and per-pod MCS categories on
#   SELinux nodes; this AppArmor cluster ignores the options. Explicit pod or
#   container options are preserved as whole objects, including empty mappings.
#
# Uses +(key) anchors or presence guards to preserve explicit chart values.
# Excluded namespaces require elevated privileges by design.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-security-context
  annotations:
    policies.kyverno.io/title: Security Context Defaults
    policies.kyverno.io/category: Pod Security, Best Practices
    policies.kyverno.io/subject: Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Mutates all pods to set security best-practice defaults using
      conditional anchors so explicit chart values are never overwritten.
      In namespaces labelled baseline-context-controllers it also writes the
      two inert C-0211 fields into the stored pod templates of Deployments,
      StatefulSets, DaemonSets, Jobs and CronJobs.
spec:
  rules:
    # User namespaces are default-off and enabled per namespace only after the
    # workload and its volume types have been validated on the real-kernel
    # Hetzner provider. The local Docker provider stays opted out because Talos
    # runs nested there and idmapped-mount support is not guaranteed. A
    # conditional anchor preserves an explicit workload choice.
    - name: add-user-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/user-namespaces: enabled
      # CNPG-managed pods (instances and their initdb/join jobs, all labelled
      # cnpg.io/cluster) stay on host user namespaces even in an opted-in
      # namespace: their Longhorn PVCs would need idmapped-mount support,
      # which is unvalidated (#1807 sequences stateful workloads last). This
      # lets mixed namespaces (stateless app + CNPG database) opt in safely.
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            +(hostUsers): false
    - name: add-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only. Without this, Kyverno also mutates pod UPDATEs;
              # pod spec is immutable, so for any pod created while the
              # policy/webhook wasn't active yet (fresh-cluster bring-up
              # ordering) EVERY later update — including OpenBao's
              # service-registration label patches — is rejected with
              # HTTP 422 "pod updates may not change fields other than
              # image...". That froze openbao-active at zero endpoints and
              # broke every system test from 2026-06-10 (#1990 probe output).
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
          # Workloads with an image-baked non-1000 UID and no chart-set runAsUser
          # (cert-manager/trust-manager/origin-ca-issuer = 65532, keda = 65532,
          # opencost = 1001). Forcing pod-level runAsUser:1000 would override their
          # image UID; instead they are handled by add-imageuid-pod-security-context
          # below, which omits runAsUser/runAsGroup so they keep their UID and the
          # sandbox still builds.
          - resources:
              namespaces:
                - cert-manager
                - keda
                - opencost
          # tofu-controller runner pods take their UID from their runnerPodTemplate
          # and ship no image-baked UID; same handling as the namespaces above.
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/created-by: tofu-controller
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
              +(runAsNonRoot): true
              +(runAsUser): 1000
              +(runAsGroup): 1000
              +(fsGroup): 1000
              +(fsGroupChangePolicy): OnRootMismatch
    - name: add-container-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only — same immutability rationale as above.
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      +(readOnlyRootFilesystem): true
                      +(runAsNonRoot): true
                      +(capabilities):
                        drop:
                          - ALL
                      +(seccompProfile):
                        type: RuntimeDefault
          - list: "request.object.spec.initContainers[]"
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      +(readOnlyRootFilesystem): true
                      +(runAsNonRoot): true
                      +(capabilities):
                        drop:
                          - ALL
                      +(seccompProfile):
                        type: RuntimeDefault
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/containers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
          - list: "request.object.spec.initContainers[]"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/initContainers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
    # Pods exempt from the pod-level runAsUser/runAsGroup injection in
    # add-pod-security-context (image-baked non-1000 UIDs: cert-manager, keda,
    # opencost; and tofu-controller runner pods) still must satisfy the rest of
    # C-0211 at the pod level. tofu-controller does NOT propagate its
    # runnerPodTemplate's pod-level securityContext to the created runner pod, and
    # the excluded namespaces' charts do not all set these either, so re-supply them
    # here — everything the pod rule injects EXCEPT the sandbox-sensitive
    # runAsUser/runAsGroup: seccompProfile + runAsNonRoot + fsGroup +
    # fsGroupChangePolicy. These pods keep their image UID; the sandbox builds because
    # neither runAsUser nor runAsGroup is set at the pod level (no group without user).
    - name: add-imageuid-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only — same immutability rationale as the rules above.
              operations:
                - CREATE
              selector:
                matchLabels:
                  app.kubernetes.io/created-by: tofu-controller
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaces:
                - cert-manager
                - keda
                - opencost
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
              +(runAsNonRoot): true
              +(fsGroup): 1000
              +(fsGroupChangePolicy): OnRootMismatch
    # The twelve namespaces excluded from add-pod-security-context and
    # add-container-security-context are excluded because their workloads need
    # elevated PRIVILEGE. That rationale covers runAsUser/runAsGroup/fsGroup and
    # the container hardening fields — it does not cover fsGroupChangePolicy or
    # seLinuxOptions, which are not privilege fields:
    # - fsGroupChangePolicy only governs ownership-relabel behaviour when the
    #   kubelet applies an fsGroup to a volume. It grants nothing.
    # - Empty seLinuxOptions keeps runtime SELinux label allocation, satisfies
    #   C-0211, and is a no-op on this AppArmor cluster.
    # Excluding them cost both controls across the whole excluded population:
    # measured against live prod specs 2026-08-29, 210/210 pods in those twelve
    # namespaces have no fsGroupChangePolicy and 189/210 have at least one
    # container with no seLinuxOptions.
    #
    # DEFAULT-OFF. This rule is gated on an explicit namespace opt-in label, the
    # same mechanism add-user-namespaces uses, so merging it changes nothing until
    # a namespace is labelled. Roll out one namespace at a time.
    #
    # Deliberately NOT injected here: fsGroup. It is a group field, so supplying it
    # is exactly the privilege change the exclusion exists to prevent. The
    # consequence is recorded rather than hidden — where a pod sets no fsGroup
    # (119 of the 210 measured), fsGroupChangePolicy has no runtime effect at all
    # and only satisfies the control. That inertness is the point: this rule can
    # change a pod's declared posture without changing how it runs.
    #
    # Neither field carries the runAsGroup-without-runAsUser coupling documented
    # above, so no pod sandbox can fail to build on account of this rule.
    - name: add-baseline-context-optin-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only — same pod-spec immutability rationale as the rules
              # above; existing pods pick this up when they are next recreated.
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context: enabled
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(fsGroupChangePolicy): OnRootMismatch
    # Default only a missing container object when no pod object is inherited.
    # Kubernetes replaces the whole pod-level struct with a container override,
    # even an empty one. Never fill individual leaves or shadow pod options.
    # JSON Patch preserves the empty mapping that strategic merge omits; key
    # presence guards supply the same preservation boundary as a +() anchor.
    - name: add-baseline-context-optin-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context: enabled
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/containers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
          - list: "request.object.spec.initContainers[]"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/initContainers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
    # CONTROLLER-KIND COUNTERPARTS of the two opt-in rules above. Those rules
    # match `Pod` and this policy generates no autogen rules (its live
    # `status.autogen` is empty), so they mutate only at pod admission and the
    # STORED controller spec — the one Kubescape scores for C-0211 — is never
    # touched. Measured 2026-09-03 against live prod after observability and
    # longhorn-system were opted in: 0 of 15 and 0 of 12 stored specs carried
    # either field, while the running pods created since the label did. The
    # seven Coroot-operator workloads and Longhorn's CSI and manager workloads
    # cannot take the template route the plain manifests took, because their
    # specs are written by an operator whose CRD exposes no securityContext
    # field (verified against the coroot-operator v1.9.5 CRD). These rules reach
    # them where the pod rules cannot: at the controller object.
    #
    # DEFAULT-OFF behind ITS OWN label, `baseline-context-controllers`, distinct
    # from the pod rules' `baseline-context`. The two fields are inert, but
    # writing them into a stored pod template changes the template hash, so the
    # first admission of a pre-existing workload ROLLS it — a Longhorn manager
    # DaemonSet or a Coroot ClickHouse StatefulSet restarts at whatever moment
    # its owner next writes it. That is a rollout, not a posture edit, and it is
    # opted into one namespace at a time with the live workloads read back
    # afterwards; a namespace carrying only the pod-rule label is untouched.
    #
    # CREATE and UPDATE for Deployment, StatefulSet and DaemonSet, whose pod
    # template is mutable — UPDATE is the only way an already-stored spec that an
    # operator rewrites on reconcile ever receives the fields. The `+()` anchors
    # inspect the INCOMING request, not the stored object, so they make an
    # admission a no-op only when the writer already carries the fields: an
    # owner that reads the stored object back and preserves unknown fields
    # (controller-runtime CreateOrUpdate on the fetched object) converges after
    # one write, but an owner that REBUILDS its template from its own desired
    # state omits the fields on every write, Kyverno re-adds them before
    # persistence, and the live object never equals what that owner wanted —
    # each write still advances resourceVersion, which can requeue the owner
    # into a continuous reconcile loop. Coroot is a known candidate: it already
    # fights external ownership of its generated Deployment
    # (docs/progressive-delivery.md). The label therefore makes NO claim that a
    # namespace's owners converge; that is what the per-namespace flip proves.
    #
    # Labelling a namespace also does not by itself touch anything already
    # stored: helm-controller reapplies a rendered resource only on a chart or
    # values change and excludes `/spec/template` from drift correction, so a
    # Helm-rendered controller (Longhorn's manager, CSI and UI) keeps its old
    # template indefinitely until some writer issues an UPDATE. The flip is
    # therefore a procedure, not a label edit. For each namespace it:
    #   1. adds the label and, per existing Deployment, StatefulSet, DaemonSet
    #      and CronJob, issues a `kubectl rollout restart`-style
    #      template-annotation UPDATE — the admission of that write is what
    #      backfills the fields (and it is the one rollout per workload the
    #      paragraph above warns about). A pre-existing Job is OUT of that
    #      backfill: its template is immutable, so no UPDATE can carry the
    #      fields into it. A CronJob-spawned Job is replaced with the fields at
    #      its next schedule (a fresh CREATE); a standalone Job keeps its stored
    #      template until it is deleted and recreated, and the read-back lists
    #      it as such rather than counting it as backfilled;
    #   2. reads the stored specs back and confirms both fields landed on every
    #      restarted kind, and names any pre-existing Job left as-is;
    #   3. watches every owner's write rate on those objects for the loop above
    #      (resourceVersion advancing with no spec change) and, on a loop,
    #      reverts the label or excludes that owner's objects by ownerReference
    #      before the label is kept;
    #   4. records the read-back on the namespace manifest, which is what the
    #      inventory gate in tests/add-baseline-context expects.
    # Job is CREATE-only: a Job's template is immutable once created, so an
    # UPDATE-time mutation would turn any later edit (a label, `suspend`) into a
    # rejected template change — the same 422 hazard that keeps the pod rules
    # CREATE-only. A Job spawned from a mutated CronJob already carries the
    # fields; a standalone Job gets them at creation.
    #
    # Same two fields, same whole-object SELinux guards and the same
    # wholesale-replace guards as the pod rules; only the path differs
    # (`spec.template.spec`, and `spec.jobTemplate.spec.template.spec` for
    # CronJobs). `tests/add-baseline-context` pins every state for the
    # controller kinds too.
    - name: add-baseline-context-optin-controllers
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
                - UPDATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context-controllers: enabled
          - resources:
              kinds:
                - Job
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context-controllers: enabled
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                securityContext:
                  +(fsGroupChangePolicy): OnRootMismatch
    - name: add-baseline-context-optin-controllers-containers
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
                - UPDATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context-controllers: enabled
          - resources:
              kinds:
                - Job
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context-controllers: enabled
      mutate:
        foreach:
          - list: "request.object.spec.template.spec.containers"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.template.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/template/spec/containers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
          - list: "request.object.spec.template.spec.initContainers[]"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.template.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/template/spec/initContainers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
    - name: add-baseline-context-optin-cronjobs
      match:
        any:
          - resources:
              kinds:
                - CronJob
              operations:
                - CREATE
                - UPDATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context-controllers: enabled
      mutate:
        patchStrategicMerge:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    securityContext:
                      +(fsGroupChangePolicy): OnRootMismatch
    - name: add-baseline-context-optin-cronjobs-containers
      match:
        any:
          - resources:
              kinds:
                - CronJob
              operations:
                - CREATE
                - UPDATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context-controllers: enabled
      mutate:
        foreach:
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.jobTemplate.spec.template.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/jobTemplate/spec/template/spec/containers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
          - list: "request.object.spec.jobTemplate.spec.template.spec.initContainers[]"
            preconditions:
              all:
                - key: "{{ to_string(contains(keys(request.object.spec.jobTemplate.spec.template.spec.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
                - key: "{{ to_string(contains(keys(element.securityContext || `{}`), 'seLinuxOptions')) }}"
                  operator: Equals
                  value: "false"
            patchesJson6902: |-
              - op: add
                path: /spec/jobTemplate/spec/template/spec/initContainers/{{elementIndex}}/securityContext/seLinuxOptions
                value: {}
