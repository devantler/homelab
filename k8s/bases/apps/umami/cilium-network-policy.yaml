# Mirrors the wedding-app policy: an always-on web app plus a CloudNativePG
# cluster in one namespace. Covers Gateway ingress to Umami (3000), intra-namespace
# app<->db traffic. The generated allow-cnpg-operator policy supplies management
# ingress only to database instance pods from the operator's exact identity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-umami
  namespace: umami
spec:
  endpointSelector: {}
  ingress:
    # Gateway ingress -> Umami HTTP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Flagger load-tester (acceptance smoke + load) -> the canary pods.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flagger-system
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Intra-namespace (Umami -> DB, CNPG replication)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: umami
    # OpenBao Database secrets engine: the OpenBao server connects to PostgreSQL
    # to validate database/config/umami-postgres and rotate the 'umami' static
    # role (the postgresql-database-plugin runs in-process in the OpenBao pod).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # Intra-namespace (Umami -> DB)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: umami
    # CNPG -> Cloudflare R2 (S3) for barmanObjectStore WAL archiving + base
    # backups (cluster.yaml). Pinned by FQDN instead of world:443 so
    # a compromised pod cannot exfiltrate to arbitrary external services; the
    # R2 pattern matches any account host without committing the account id.
    # The umami.is names keep Umami's version check / telemetry from logging
    # connection errors.
    - toFQDNs:
        - matchPattern: "*.r2.cloudflarestorage.com"
        - matchName: "api.umami.is"
        - matchName: "telemetry.umami.is"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Kube API (CNPG operator manages the cluster)
    - toEntities:
        - kube-apiserver
    # DNS resolution. rules.dns engages Cilium's L7 DNS proxy so the toFQDNs
    # allow-list above can be enforced; matchPattern "*" leaves resolution
    # itself unrestricted (the FQDN list constrains where traffic may go).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
