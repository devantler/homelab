---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: ksail
  name: wedding-app
  namespace: wedding-app
spec:
  interval: 1m
  ref:
    tag: 1.15.10
  url: oci://ghcr.io/devantler-tech/wedding-app/manifests
  secretRef:
    name: ghcr-auth
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Generated from scripts/publish-workflow-approved-revisions.tsv by
      # scripts/write-publish-workflow-matchers.sh. Accept the deployed artifact
      # signer and this consumer's current publish-workflow pin in one identity.
      # Regeneration updates the pair and the approved set in the same PR.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/actions/\.github/workflows/publish-app\.yaml@(6ae5d87b342984cdaf34740e60366b9d570d8fc5|36e6129f5fbbefb6f33816feaef04fb493575a43)$'
