# Active Barman Cloud Plugin ObjectStore for the wedding-db tenant database.
# It stays on the shared platform archive during the dedicated-store staging
# phase. The Cluster continues to reference this object as `wedding-db`, so WAL
# and base-backup continuity are unchanged until the existing catalog has been
# mirrored and a later reviewed cutover changes that reference.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: wedding-db
  namespace: wedding-app
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://${r2_bucket}/cnpg/wedding-db
    endpointURL: ${r2_endpoint}
    s3Credentials:
      accessKeyId:
        name: wedding-db-backup-r2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: wedding-db-backup-r2
        key: SECRET_ACCESS_KEY
      region:
        name: wedding-db-backup-r2
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
