name: Deploy to Production
description: >-
  Deploy the platform's GitOps manifests to the production Talos + Hetzner
  cluster with KSail: stage the OCI artifact in GHCR, cosign-sign it, attest an
  SBOM + SLSA provenance, promote that evidenced digest to latest, trigger Flux
  reconciliation, and finally sync Talos machine config. Shared by the
  merge-queue deploy (ci.yaml) and the manual
  deploy (cd.yaml) so the two paths can never drift. The repository must
  already be checked out. Composite actions cannot read `secrets`, so every
  secret is passed in as an input.

inputs:
  sops-age-key:
    description: SOPS Age private key (secrets.SOPS_AGE_KEY) for decrypting SOPS-encrypted manifests.
    required: true
  kube-config:
    description: kubeconfig for the prod cluster (secrets.KUBE_CONFIG); must contain the admin@prod context.
    required: true
  talos-config:
    description: talosconfig for the prod cluster (secrets.TALOS_CONFIG) used by `ksail cluster update`.
    required: true
  ghcr-token:
    description: GHCR PAT with write:packages (secrets.GHCR_TOKEN) for OCI push and signing; every pull path uses the Git/SOPS credential.
    required: true
  hcloud-token:
    description: Hetzner Cloud API token (secrets.HCLOUD_TOKEN) used by the KSail Hetzner provider and CCM/CSI.
    required: true
  wg-server-private-key:
    description: >-
      WireGuard private key for the control-plane wg0 listener
      (secrets.WG_SERVER_PRIVATE_KEY); env-expanded by ksail into
      talos/control-planes/wireguard.yaml when rendering machine config.
    required: true
  recover-orphaned-fence:
    description: >-
      Release the GHCR synchronization Lease before staging when its holder is a
      GitHub run the API reports terminal, no other fence is held, and its
      heartbeat has stopped. Default-off: a deploy that dies holding the Lease
      blocks every later deploy AND its own heal path, and clearing that today
      needs a human with cluster write access. Any unproven condition refuses
      rather than releasing.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The action and policy come from the same checkout. Recovery therefore
    # restores the policy of main even during the first narrowing rollout.
    - name: 🔐 Enforce approved publication signers
      shell: bash
      env:
        APPROVED_REVISIONS_ENFORCE: '1'
      run: ./scripts/guard-publish-workflow-approved-revisions.sh

    - name: ⚙️ Setup KSail
      # Install the KSail CLI from the release tarball and verify the
      # downloaded asset against GitHub's published release checksum before
      # running it with production credentials. We still use the tarball rather
      # than brew/setup-ksail-cli because v7.20.0 shipped only desktop artifacts
      # (linux CLI missing, 404 on the tarball); Renovate keeps this pin current.
      shell: bash
      env:
        # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
        KSAIL_VERSION: "7.181.0"
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        .github/scripts/setup-ksail.sh

    - name: ⚙️ Setup talosctl
      # refresh-flux-ghcr-auth.sh uses the host API for a secret-safe,
      # per-node RegistryAuthConfig patch and exact image-pull proof.
      shell: bash
      run: |
        .github/scripts/setup-talosctl.sh

    - name: 🔐 Create SOPS Age key
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        mkdir -p ~/.config/sops/age
        umask 077
        echo "${SOPS_AGE_KEY}" > ~/.config/sops/age/keys.txt
        chmod 600 ~/.config/sops/age/keys.txt

    - name: 🔑 Restore kubeconfig
      # ksail cluster update needs a valid kubeconfig to detect the current
      # cluster state. Without it, the component detector returns defaults and
      # triggers spurious changes that all fail. The KUBE_CONFIG secret must be
      # kept up-to-date from the homelab after any cluster recreation.
      # See devantler-tech/ksail#4369 for the upstream design context.
      shell: bash
      env:
        KUBE_CONFIG: ${{ inputs.kube-config }}
      run: |
        mkdir -p ~/.kube
        umask 077
        printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: 🔗 Select stable prod API endpoint
      # KUBE_CONFIG can outlive the control-plane node whose public IP was the
      # endpoint when the secret was minted. `cluster update` deliberately
      # rolls those nodes, so retaining that address makes this deploy sever
      # its own API connection even while the other control planes are Ready.
      # Resolve the KSail-owned floating IP live, fail closed on missing or
      # foreign ownership labels, and switch admin@prod before any API call.
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
      run: ./scripts/use-prod-stable-api-endpoint.sh

    - name: 🔑 Restore talosconfig
      # ksail cluster update talks to the Talos API to sync machine config.
      # Without the talosconfig it uses stale/derived certs and fails with
      # "x509: certificate signed by unknown authority (talos)". The
      # TALOS_CONFIG secret must be kept up-to-date from the homelab after any
      # cluster recreation, same as KUBE_CONFIG.
      shell: bash
      env:
        TALOS_CONFIG: ${{ inputs.talos-config }}
      run: |
        mkdir -p ~/.talos
        umask 077
        printf '%s' "${TALOS_CONFIG}" > ~/.talos/config
        chmod 600 ~/.talos/config

    - name: 🩺 Verify prod cluster is reachable
      # Fail fast if the restored kubeconfig can't reach the prod API server.
      # When the cluster is unreachable — most commonly because KUBE_CONFIG /
      # TALOS_CONFIG are stale after a cluster rebuild — `ksail cluster update`
      # otherwise only warns, falls back to a "nothing is installed" baseline,
      # proposes a full reinstall, and then fails mid-apply against the live
      # nodes (a confusing, potentially destructive failure mode). Catch it
      # here with an actionable message instead.
      # Upstream: devantler-tech/ksail#4868 (fail fast) and #4869 (baseline).
      # Refresh procedure: docs/dr/runbook.md → "Refresh CI deploy credentials".
      # Pin --context to admin@prod (ksail.prod.yaml's connection.context) so
      # the check targets the same cluster `ksail cluster update` will use,
      # regardless of the restored kubeconfig's current-context.
      shell: bash
      run: |
        # A missing admin@prod context means a malformed/incomplete kubeconfig,
        # not an unreachable cluster — surface that case distinctly.
        if ! kubectl config get-contexts -o name | grep -qx 'admin@prod'; then
          echo "::error::Restored kubeconfig has no 'admin@prod' context (ksail.prod.yaml's connection.context). KUBE_CONFIG looks malformed or incomplete — refresh it. See docs/dr/runbook.md → 'Refresh CI deploy credentials'."
          exit 1
        fi
        last_err=""
        for attempt in 1 2 3; do
          # Capture kubectl's own stderr so the failure message is accurate.
          if out=$(kubectl --context admin@prod get --raw='/readyz' --request-timeout=30s 2>&1); then
            echo "✅ Prod API server reachable."
            exit 0
          fi
          last_err="$out"
          echo "Attempt ${attempt}/3: prod API server (context admin@prod) not reachable: ${out}"
          sleep 10
        done
        last_err=$(printf '%s' "$last_err" | tr '\n' ' ')
        echo "::error::Prod cluster (context admin@prod) is unreachable with the restored kubeconfig (last kubectl error: ${last_err}). KUBE_CONFIG (and likely TALOS_CONFIG) are probably stale after a cluster rebuild — refresh both and update the 'prod' environment secrets. See docs/dr/runbook.md → 'Refresh CI deploy credentials'."
        exit 1

    - name: 💾 Validate live persistence retirement safety
      # A commit parent is not evidence that its protection reached production:
      # two direct pushes can be waiting behind one manual dispatch. Compare the
      # candidate with the actual Flux-owned PVCs, HelmReleases, and Namespaces
      # after restoring the pinned prod context, but before moving the mutable
      # artifact tag. Any removed live object must already carry prune=disabled.
      shell: bash
      env:
        PVC_PRUNE_LIVE_CONTEXT: admin@prod
      run: |
        shellcheck scripts/tests/test-pvc-prune-safety.sh
        bash scripts/tests/test-pvc-prune-safety.sh

    - name: 🛡️ Suspend autoscaling for gated Cilium rollout
      id: cilium_rollout_gate
      # The widened device component deliberately uses OnDelete so the Cilium
      # agents can be stepped one node at a time. OnDelete does not protect a
      # newly autoscaled node: it would boot the widened device set immediately.
      # Suspend before the mutable artifact is published, because Flux may
      # observe the new tag before the explicit reconcile step. The script
      # records the pre-existing replica count so only this gate can restore it.
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
      run: ./scripts/guard-cilium-homogeneous-device-rollout.sh --before-publish

    - name: 🧯 Recover an orphaned GHCR deploy fence
      # Runs BEFORE staging, because staging is what fails when the Lease is
      # orphaned — and both the deploy job and the heal job reach this composite,
      # so one step covers the two paths that wedge together.
      #
      # GH_TOKEN is what makes the liveness proof possible: the holder identity
      # embeds its run reference, and only the API can say whether that attempt
      # is terminal. Without it the script refuses rather than guessing.
      if: inputs.recover-orphaned-fence == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/refresh-flux-ghcr-auth.sh --recover-fences

    - name: 🔑 Stage Flux and consumer GHCR pull credential
      id: stage_flux_ghcr_auth
      # Validate all eight packages, synchronize and prove an uncached pull of
      # the declared incoming image on every stale Talos node, then stage and
      # verify the Kubernetes fan-out BEFORE publishing latest. Every pull
      # consumer has one known-readable credential before the mutable tag can
      # be observed. The non-secret exact-node proof survives only in this job
      # so the post-update pass can distinguish annotation loss from real
      # credential, image, or node drift.
      shell: bash
      run: >-
        ./scripts/refresh-flux-ghcr-auth.sh
        --record-runtime-proof
        "${RUNNER_TEMP}/ghcr-runtime-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

    - name: 📋 Record the Flux control-plane baseline
      # Before the mutable tag moves, because Flux may observe the new revision
      # before the reconcile step runs — the same reason the Cilium gate suspends
      # autoscaling pre-publish. A control-plane rollout that begins in that
      # window would already be reflected in a snapshot taken inside the reconcile
      # wrapper, making its "before" and "after" identical and reporting a
      # cancellation this deploy inflicted on itself as a workload failure
      # (#3478). Never fails the deploy: without a baseline the wrapper reads the
      # generations itself, exactly as it did before this step existed.
      shell: bash
      env:
        FLUX_CONTROL_PLANE_BASELINE_FILE: ${{ runner.temp }}/flux-control-plane-baseline
      run: |
        ./scripts/reconcile-flux-workloads.sh --snapshot-baseline \
          >"${FLUX_CONTROL_PLANE_BASELINE_FILE}"

    # Publish the GitOps manifests (stage → sign → attest → promote → reconcile) BEFORE
    # syncing Talos machine config (the "🔄 Update cluster" step runs LAST).
    # Manifest delivery never touches the nodes, so it must not be gated on
    # every control-plane node being reachable: when one node's Talos API was
    # down, `ksail cluster update` ran first, hard-failed the job, and froze
    # ALL app/config delivery to an otherwise-healthy cluster (the apiserver
    # and Flux were fine on the two surviving control-plane nodes).
    - name: 📦 Publish evidenced manifests to GHCR
      id: publish_platform_manifest
      uses: ./.github/actions/deploy-prod/publish-platform-manifests
      with:
        ghcr-token: ${{ inputs.ghcr-token }}
        hcloud-token: ${{ inputs.hcloud-token }}

    - name: 🔎 Verify Flux GHCR pull credential after publish
      id: verify_flux_ghcr_auth_after_push
      # Revalidate the newly-published artifact before apps reconcile. The
      # complete consumer fan-out was staged before the mutable tag moved.
      shell: bash
      run: ./scripts/refresh-flux-ghcr-auth.sh --check-only

    - name: 🔁 Trigger Flux reconciliation
      id: reconcile
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        FLUX_CONTROL_PLANE_BASELINE_FILE: ${{ runner.temp }}/flux-control-plane-baseline
      # Through the wrapper, not the bare command: a deploy that changes the Flux
      # control plane restarts the controllers this reconcile runs through, which
      # cancels the reconcile the deploy itself triggered (#3478). The wrapper
      # retries once, and ONLY on evidence that this deploy restarted the control
      # plane; a genuine failure still fails on the first attempt.
      run: ./scripts/reconcile-flux-workloads.sh

    - name: 🩺 Diagnose Flux on failure
      if: failure() && steps.reconcile.outcome == 'failure'
      # Shared composite (extracted from the richest platform-template variant,
      # devantler-tech/actions#367). Its default `kustomizations` input is
      # `infrastructure-controllers infrastructure apps` — identical to the list
      # this callsite previously hard-coded — so this is behaviour-preserving for
      # the describe loop and a strict diagnostics upgrade otherwise (Nodes,
      # all-pods, failing/CrashLooping pod logs, Job logs, failing-Job describes,
      # larger --tail values). Failure-path-only: it cannot affect a green deploy.
      uses: devantler-tech/actions/diagnose-flux@e182f2207fb386ef827f48b3cc9b7deac873046a # v7.1.0

    - name: ⏳ Wait for the newly published Flux revision
      id: wait_flux_revision
      # Pin the mutable latest tag to the digest resolved immediately after
      # publish. A successful reconcile command only proves that Flux accepted
      # the request; autoscaling and Talos mutation stay blocked until the
      # infrastructure controller layer has applied this exact artifact and
      # reports Ready. The temporary Cilium component disables Helm's pod wait
      # while OnDelete controls replacement, so this proof still completes
      # without weakening Flux dependency convergence.
      shell: bash
      env:
        PLATFORM_MANIFEST_DIGEST: ${{ steps.publish_platform_manifest.outputs.digest }}
      run: ./scripts/wait-for-platform-flux-revision.sh "${PLATFORM_MANIFEST_DIGEST}"

    - name: 🛡️ Restore autoscaling once the released revision is Ready
      id: cilium_rollout_gate_release
      # `ksail cluster update` waits for the cluster-autoscaler Deployment to be
      # ready, and KSail treats zero replicas as never-ready — so a deploy that
      # releases the gate would hang on the suspension the gate itself owns and
      # fail at its own config sync. Restore between the exact-revision proof and
      # cluster update: the safe artifact is deployed by now, which is what the
      # gate requires before autoscaling may resume, and the autoscaler is ready
      # before the step that waits on it. A still-active gate stays suspended.
      if: >-
        !cancelled() &&
        steps.wait_flux_revision.outcome == 'success'
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
      run: ./scripts/guard-cilium-homogeneous-device-rollout.sh --after-revision-ready

    - name: 🔄 Update cluster (Talos machine config)
      id: cluster_update
      # Runs LAST, after manifest delivery, so an unreachable control-plane
      # node cannot block GitOps delivery (see the Push step's comment). Talos
      # config sync still runs on every deploy and a genuine node-reachability
      # problem still fails the deploy (red) — it just no longer takes the
      # app/config pipeline down with it. The temporary homogeneous-device
      # rollout gate also skips this step: KSail owns Cluster Autoscaler and
      # could reconcile it back to one replica during the command, opening a
      # scale-up race before the first Cilium canary is verified. A reviewed
      # rollout-completion or rollback artifact removes the gate; because Flux
      # exact-revision wait happens first, that safe artifact is live before
      # cluster update runs again.
      if: >-
        steps.cilium_rollout_gate.outputs.active != 'true' &&
        steps.wait_flux_revision.outcome == 'success'
      shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        # ksail env-expands ${WG_SERVER_PRIVATE_KEY} in the talos patches at
        # load time; an unset var renders an empty key and Talos rejects the
        # whole machine config ('private key is invalid: wrong key "" length: 0').
        WG_SERVER_PRIVATE_KEY: ${{ inputs.wg-server-private-key }}
      run: ./scripts/run-ksail-prod-with-pull-auth.sh cluster update

    - name: 📣 Report suppressed machine-config sync
      # The step above is the pipeline's ONLY Talos machine-config sync, and the
      # rollout gate skips it. A skipped step inside a green deploy reads as
      # ordinary conditional behaviour, so the suppression went unnoticed for
      # over a week and misdirected the diagnosis of two unrelated issues
      # (#2951). The elapsed count belongs in the report, not in this comment,
      # where it would be stale the day after it was written.
      # Surface it in the job summary, and warn once it outruns the rollout's
      # intended window. always(), so an earlier failure cannot hide it.
      if: >-
        always() && steps.cilium_rollout_gate.outputs.active == 'true'
      shell: bash
      env:
        # Take the gate state from the gate itself — re-deriving it here would
        # let the two drift apart silently, which is the original defect.
        CILIUM_ROLLOUT_GATE_ACTIVE: ${{ steps.cilium_rollout_gate.outputs.active }}
      run: ./scripts/report-cilium-rollout-gate-suppression.sh

    - name: 🛡️ Reassert or release the Cilium rollout gate
      # Reassert the suspension after delivery while OnDelete is active.
      # A later, reviewed rollout-completion or rollback artifact removes the
      # gate; only after that artifact has reconciled does this phase restore
      # the replica count recorded by the pre-publish phase. `always()` also
      # preserves that fail-closed state when the safe, re-enabled cluster
      # update fails after reconciliation.
      if: >-
        always() &&
        steps.reconcile.outcome == 'success' &&
        (
          steps.cilium_rollout_gate.outputs.active == 'true' ||
          steps.wait_flux_revision.outcome == 'success'
        )
      shell: bash
      env:
        # The guard always reasserts suspension for an active rollout, including
        # failure cleanup, but may approve the rendered candidate only after
        # Flux proves this exact published revision Ready.
        CILIUM_ROLLOUT_REVISION_READY: ${{ steps.wait_flux_revision.outcome == 'success' }}
      run: ./scripts/guard-cilium-homogeneous-device-rollout.sh --after-deploy

    - name: 🔑 Reassert Flux and consumer GHCR pull credential
      id: reassert_flux_ghcr_auth
      # cluster update is already wrapped with Git/SOPS auth, but reassert the
      # full transaction afterward in case KSail fails part-way. Reassert after
      # its synchronous consumer fan-out when that update fails part-way, but
      # only after the publish, signing, attestation, post-publish auth check,
      # and Flux reconcile all succeeded. Never mutate auth as cleanup for a
      # failed delivery.
      # Runs on failure but NOT on cancellation. This step takes the
      # `ghcr-auth-refresh` Lease, which has no automatic expiry takeover
      # because Talos writes cannot be fenced — a non-empty holder needs
      # explicit human recovery. Under `always()` a cancelled job still
      # entered here, then the runner force-killed it when the
      # post-cancellation grace expired, so the release never landed and every
      # later deploy failed to acquire the Lease. A merge-queue eviction
      # cancels this job routinely. The next deploy's staging step performs
      # this same reassertion with a full time budget.
      # `ksail cluster update` re-renders Talos node annotations. Reuse only
      # the same job's credential+image+Node-UID proof to restore those markers
      # without another uncached pull or rolling reboot. Any mismatch falls
      # back to the full safety path.
      if: >-
        !cancelled() &&
        steps.verify_flux_ghcr_auth_after_push.outcome == 'success' &&
        steps.reconcile.outcome == 'success'
      shell: bash
      run: >-
        ./scripts/refresh-flux-ghcr-auth.sh
        --reuse-runtime-proof
        "${RUNNER_TEMP}/ghcr-runtime-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
