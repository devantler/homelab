name: Validate Image Verifier Liveness

# Assert that node-level image verification can enforce AT ALL.
#
# The ImageVerificationConfig rules in talos/cluster/verify-first-party-images.yaml
# read as correct whether or not anything on the node evaluates them, and nothing
# in CI can tell those two states apart: the rules are present, the node config
# matches the repository, and every check is green either way
# (devantler-tech/platform#2856).
#
# The mechanism is Talos' own. `security.ImageVerificationConfigController`
# materialises each rule into an `ImageVerificationRules.security.talos.dev`
# resource, and `security.TUFTrustedRootController` maintains the Sigstore TUF
# trust root keyless verification needs. The fleet check asserts both are live
# on every node.
#
# Two read-only questions about the same control live here, and they are
# different questions. The fleet check asks whether verification CAN enforce at
# all. The signature inventory asks what enforcement WOULD refuse — the blast
# radius that decides whether activation is safe to turn on (#3334).
#
# Both are DORMANT: they run only on demand (`workflow_dispatch`). Turning on a
# daily cadence belongs to #3336, which first establishes that a matched rule
# actually refuses an unsigned pull — running rules and trust material are
# necessary for enforcement, not proof of it, because a cached image is never
# re-pulled.
#
# Both checkers' OWN tests need no cluster and no secrets, so they gate every PR
# that touches them. They live in ci.yaml's `validate` job, which
# `CI - Required Checks` depends on, so they actually block a merge — a test
# that only reports is advisory, and a regression in a checker whose job is
# noticing a silent condition would itself be silent. This workflow therefore
# carries only the on-demand checks that need the fleet.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-image-verifier-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-image-verifier-liveness:
    name: 🔏 Validate Image Verifier Liveness
    # Dormancy is now the TRIGGER SET, not a job condition: `workflow_dispatch`
    # is the only event, so there is no PR or schedule path to guard against.
    # Adding the daily `schedule:` is what activation means (#3336).
    runs-on: ubuntu-latest
    # KUBE_CONFIG and TALOS_CONFIG are `prod` ENVIRONMENT secrets, not repository
    # secrets — every other consumer (ci.yaml's deploy jobs, cd.yaml, dr-rebuild)
    # declares this for the same reason. Without it GitHub resolves both to the
    # empty string, the restore steps write empty configs, and the check cannot
    # reach a single node. It would fail as an infrastructure error rather than
    # passing falsely, but a control that can never run is the same class of
    # problem as the one this whole PR exists to detect.
    environment: prod
    permissions:
      contents: read # checkout repository
    concurrency:
      # Read-only against prod, so it does not share the deploy lock — but two
      # copies of it racing each other buys nothing.
      group: validate-image-verifier-liveness-fleet
      cancel-in-progress: true
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup talosctl
        shell: bash
        run: |
          .github/scripts/setup-talosctl.sh

      - name: 🔑 Restore kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          umask 077
          printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: 🔑 Restore talosconfig
        shell: bash
        env:
          TALOS_CONFIG: ${{ secrets.TALOS_CONFIG }}
        run: |
          mkdir -p ~/.talos
          umask 077
          printf '%s' "${TALOS_CONFIG}" > ~/.talos/config
          chmod 600 ~/.talos/config

      - name: 🔏 Assert every node can enforce image verification
        shell: bash
        env:
          # Pinned for the same reason the deploy composite pins it: the
          # restored kubeconfig's current-context is not guaranteed to be prod,
          # and a check that silently read another cluster would report a
          # healthy fleet that is not the one being gated.
          KUBECTL_CONTEXT: admin@prod
        run: ./scripts/validate-image-verifier-liveness.sh

  # The job above answers "can the fleet enforce at all". This one answers the other half of
  # #3101 — "what would it REFUSE if it did" — which is the blast radius that decides whether
  # activation is safe. Both are read-only against prod and both are dormant for the same
  # reason: they belong to an epic that is not finished, and a permanently-red `main` spends
  # the "something broke" signal on a state that is already tracked (#3336 activates them).
  inventory-first-party-image-signatures:
    name: 🔏 Inventory First-Party Image Signatures
    runs-on: ubuntu-latest
    # `prod` ENVIRONMENT secret, exactly as the job above — resolved to the empty string
    # without this, which would leave the check unable to reach a single pod.
    environment: prod
    permissions:
      contents: read # checkout repository
    concurrency:
      group: inventory-first-party-image-signatures
      cancel-in-progress: true
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔑 Restore kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          umask 077
          printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # The two private first-party packages (`ascoachingogvaner`, `wedding-app`) answer 401 to an
      # anonymous manifest read, so without a credential the inventory can only report UNKNOWN for
      # them — and #3334 closes on zero UNKNOWNs. The credential used is the cluster's OWN Flux
      # pull secret, decrypted from SOPS: it is the one identity already proven to pull these
      # images, so no new secret path or registry grant is introduced here.
      - name: ⚙️ Setup KSail
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.181.0"
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-ksail.sh

      - name: 🔐 Create SOPS Age key
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          umask 077
          printf '%s' "${SOPS_AGE_KEY}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: 🔑 Stage the GHCR pull credential
        shell: bash
        # DOCKER_CONFIG is the single wiring point: cosign reads it natively through
        # go-containerregistry, and the manifest probe reads the same file through
        # scripts/registry-auth-lib.sh, so both halves of a verdict use one identity.
        # The decrypted config is written under RUNNER_TEMP with a restrictive umask and is
        # never echoed: `decrypt_flux_ghcr_docker_config` redirects ksail's stdout to
        # /dev/null and chmods the file, so the credential does not reach the job log.
        run: |
          set -euo pipefail
          source scripts/ghcr-auth-lib.sh
          # `require_flux_ghcr_yaml_tool` is deliberately NOT called: it gates on Mike Farah yq v4,
          # which only `flux_ghcr_revision` needs. `decrypt_flux_ghcr_docker_config` shells out to
          # ksail alone, so calling the gate would add a hard dependency this job never uses and
          # fail it on a runner image that drops yq.
          umask 077
          docker_config_dir="${RUNNER_TEMP}/ghcr-docker-config"
          mkdir -p "${docker_config_dir}"
          chmod 700 "${docker_config_dir}"
          decrypt_flux_ghcr_docker_config "${docker_config_dir}/config.json"
          echo "DOCKER_CONFIG=${docker_config_dir}" >> "${GITHUB_ENV}"

      - name: 🔏 Inventory what enforcement would refuse
        shell: bash
        # Pinned for the same reason the fleet check pins its context: an inventory taken
        # against another cluster would report a blast radius that is not this fleet's.
        run: ./scripts/inventory-first-party-image-signatures.sh --context admin@prod
