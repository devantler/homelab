name: Validate Main

# ci.yaml runs the authorization gate on `pull_request` and `merge_group` only,
# and cd.yaml runs it on a manual dispatch. A DIRECT PUSH to main fires none of
# those, so main could carry a broken authorization surface with every one of
# its own checks green — which is exactly what happened in f89efff4: the break
# stayed invisible on main for two days and surfaced only as an unexplained red
# on unrelated PRs, because a PR's CI builds the merge result and so inherits
# main's state.
#
# This workflow closes that hole: the same gate, on the push itself, so a
# regression is reported where it is introduced.
#
# Deliberately NOT path-filtered. The gate reads the whole rendered
# authorization surface, which a change anywhere in the overlays (or in the
# validator itself) can move; a paths filter here would recreate a narrower
# version of the same blind spot.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  # Every push to main is its own subject and its gate result is its own record,
  # so each run gets its own group and none of them can suppress another.
  #
  # Disabling cancellation is not enough on a shared key: a concurrency group
  # holds one running plus one pending run, and a third push cancels the pending
  # one. With a shared `github.ref` key the second push's gate would still be
  # evicted while queued, leaving main green on a check that never finished —
  # reopening the exact hole described above, from the other side.
  group: validate-main-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate-eks-authorization:
    name: 🔐 Validate Production Authorization
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Enforce approved publication signers
        env:
          APPROVED_REVISIONS_ENFORCE: '1'
        run: ./scripts/guard-publish-workflow-approved-revisions.sh

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ⚙️ Install pinned kubectl renderer
        shell: bash
        env:
          KUBECTL_VERSION: "v1.36.2"
          KUBECTL_SHA256: "1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82"
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/kubectl"
          curl -fsSL \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check
          sudo install "$kubectl_path" /usr/local/bin/kubectl
          kubectl version --client

      - name: 🔐 Validate static production authorization controls
        run: |
          go test ./scripts/validate-eks-ci-role-policy
          go run ./scripts/validate-eks-ci-role-policy .

      - name: ⚙️ Setup KSail for effective authorization validation
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.181.0"
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-ksail.sh

      - name: 🔐 Validate isolated chart child namespaces
        # Direct pushes must prove the same exact staged-off chart property as
        # pull requests and merge groups before main is accepted as healthy.
        timeout-minutes: 10
        run: |
          shellcheck scripts/tests/test-isolated-chart-namespace-rules.sh
          bash scripts/tests/test-isolated-chart-namespace-rules.sh

      - name: 🔐 Validate Helm-rendered production authorization controls
        # Same reasoning as the identical step in ci.yaml: this reaches every
        # upstream chart registry, so an unreachable registry would otherwise
        # stall the step for the job's full budget instead of failing promptly.
        timeout-minutes: 10
        run: |
          shellcheck scripts/tests/test-production-authorization-rules.sh
          bash scripts/tests/test-production-authorization-rules.sh
          ksail --config ksail.prod.yaml workload validate

  # The cosign subjects that trust the SHARED actions publish workflows must pin a
  # fixed revision, or a compromised branch build could be verified as first-party.
  # ci.yaml gates that on `pull_request` and `merge_group`; this is the same gate on
  # the push itself, for exactly the reason in this workflow's header — a direct push
  # to main fires neither of those, so a widened matcher would sit on main unreported
  # and be deployed by the manual CD route (#2818).
  #
  # Its own job, not a second step in the one above: a validator job that runs other
  # command steps can be subverted by one of them (BASH_ENV / a fake tool on $PATH),
  # which is the property scripts/validate-dr-signing enforces on cd.yaml's contract
  # job. Same shape here, so neither validator's job grows a tampering surface.
  validate-shared-publish-pin:
    name: 🔐 Validate Shared Publish Workflow Pins
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
      packages: read # report current GHCR package tags for signing-revision attribution
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Validate shared publish workflows are pinned
        run: ./scripts/guard-shared-publish-workflow-pin.sh

      # Which revision SIGNED what is deployed, against what each consumer pins now
      # (#3048). Reported on main rather than gated on a PR: it reads five other
      # repositories over the network, so a transient API failure here must never block
      # an unrelated pull request. Its hermetic half runs in ci.yaml on every PR.
      - name: 🔐 Report publish-workflow signing revisions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `set -o pipefail` is load-bearing: Actions' default shell does not set it, so
          # a bare pipe into `tee` would report TEE's status and a failed report would
          # read as a passing step.
          set -o pipefail
          ./scripts/report-publish-workflow-signing-revisions.sh | tee -a "$GITHUB_STEP_SUMMARY"


  # ci.yaml's validate-talos job runs the Kubernetes/Talos compatibility predicate on
  # `pull_request` and `merge_group`, but neither event fires for a direct push to main.
  # Such a push could otherwise reach the manually dispatched CD route unchecked.
  # `ksail workload validate` does not cover this: it
  # accepts the pins offline, the same way `talosctl validate --strict` does. Same gate on
  # the push itself, for this workflow's header reason.
  #
  # Its own job rather than a step in another, matching validate-shared-publish-pin: a
  # validator sharing a job with other command steps can be subverted by one of them.
  validate-talos-kubernetes-compatibility:
    name: 🧪 Validate Kubernetes/Talos Pin Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go for version compatibility validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: ✅ Validate Kubernetes against the pinned Talos release
        run: |
          go test ./scripts/validate-talos-kubernetes-compatibility
          go run ./scripts/validate-talos-kubernetes-compatibility ksail.prod.yaml
  # The pull-request gate extracts Kubernetes workloads nested in KRO RGDs because ordinary
  # manifest scanners see only the outer custom resource. A direct push bypasses that job and can
  # still reach the manual CD path, so main must exercise the identical behavioral contract.
  validate-rgd-templates:
    name: 🔬 Validate Nested RGD Workload Templates
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Trivy for nested RGD templates
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: 🔬 Validate nested RGD workload templates
        run: |
          shellcheck scripts/scan-rgd-templates.sh scripts/tests/test-rgd-template-static-scan.sh
          bash scripts/tests/test-rgd-template-static-scan.sh

  # This job is deliberately separate from the behavioral gate it protects. A direct push that
  # removes or renames validate-rgd-templates must still run this structural assertion and fail,
  # rather than leaving the remaining Validate Main jobs green while the manual CD route is open.
  validate-rgd-template-wiring:
    name: 🔐 Validate Nested RGD Gate Wiring
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Validate nested RGD gate wiring
        run: |
          shellcheck scripts/tests/test-rgd-template-static-scan-wiring.sh
          bash scripts/tests/test-rgd-template-static-scan-wiring.sh

  kubescape-baseline:
    name: 🛡️ Publish Kubescape Baseline
    runs-on: ubuntu-latest
    # ci.yaml scans and uploads on `pull_request` only, so every Kubescape
    # analysis lands on an ephemeral `refs/pull/<n>/merge` ref. Code Scanning
    # tracks alerts per (tool, category, ref): with no analysis for the default
    # branch there is nothing for those findings to dedupe against and nothing
    # to close, so the deployed tree has no durable posture baseline. Measured
    # on 2026-07-28 — six kubescape analyses, all on PR refs, and ZERO
    # default-branch kubescape alerts.
    #
    # This job publishes that baseline from main itself. It is the same scan
    # ci.yaml runs, so a finding fixed on a PR closes here on merge, and a
    # finding introduced by a direct push is reported where it is introduced.
    permissions:
      contents: read # checkout repository
      security-events: write # publish the Kubescape SARIF to Code Scanning
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ⚙️ Setup KSail
        # Kept at the version ci.yaml pins, so the baseline is produced by the
        # same renderer as the PR-ref analyses it is the baseline for. Renovate
        # updates both together (group 'ksail').
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.181.0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/setup-ksail.sh

      # The guard runs HERE too, not only in ci.yaml. A direct push to main
      # bypasses the merge queue, so without this a push that reduced the scan
      # below would execute that reduced scan with nothing checking it — the
      # exact gap this workflow exists to close, reopened one level up.
      # (Codex raised this on #3057.)
      - name: 🔐 Validate the Kubescape gate's framework coverage
        run: go run ./scripts/validate-kubescape-frameworks

      - name: 🔎 Scan manifests (Kubescape NSA + MITRE)
        # Same invocation and same justified exceptions as ci.yaml's gate, so
        # the two analyses are comparable. The threshold is kept: main can only
        # receive gated content, so a failure here means posture moved without
        # a PR — which this workflow exists to report.
        #
        # 🔴 THE FRAMEWORK LIST MUST MATCH ci.yaml'S EXACTLY, and the reason is
        # not tidiness. Both analyses upload under the same `kubescape-nsa`
        # Code Scanning category, so this run is the DURABLE BASELINE that PR
        # alerts are diffed against. If this scanned fewer frameworks, every
        # finding only the PR sees would fail to persist as a main-branch alert
        # — and a direct push to main (which bypasses the merge queue) would go
        # completely ungated on the missing framework.
        # scripts/validate-kubescape-frameworks enforces the match.
        run: |
          go test ./scripts/generate-kubescape-exceptions
          go run ./scripts/generate-kubescape-exceptions -o /tmp/kubescape-exceptions.json
          ksail workload scan --framework nsa,mitre --exceptions /tmp/kubescape-exceptions.json --compliance-threshold 95 --format sarif -o "${RUNNER_TEMP}/kubescape.sarif"

      - name: 🧭 Make the SARIF paths repo-root-relative
        # Kubescape reports paths relative to the directory it scanned; Code
        # Scanning resolves them against the repo root. Uploading them unchanged
        # creates alerts pointing at files that do not exist.
        id: normalize-sarif
        if: "!cancelled()"
        run: |
          if [ ! -f "${RUNNER_TEMP}/kubescape.sarif" ]; then
            echo "::notice::No SARIF written — the scan failed before producing one. Leaving its error as the visible failure."
            echo "sarif=absent" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Same split as ci.yaml: the normalizer drops empty-uri results because
          # Code Scanning cannot anchor them, so the upload reads the normalized
          # file and the summary below reads this untouched copy.
          cp "${RUNNER_TEMP}/kubescape.sarif" "${RUNNER_TEMP}/kubescape.raw.sarif"
          # Emitted before the normalizer: an unresolvable path aborts the step,
          # so the summary would otherwise be skipped exactly when a path-shape
          # change made the findings most worth reading.
          echo "raw=ready" >> "${GITHUB_OUTPUT}"
          bash scripts/normalize-sarif-paths.sh "${RUNNER_TEMP}/kubescape.sarif" k8s .
          echo "sarif=ready" >> "${GITHUB_OUTPUT}"

      - name: 🛡️ Upload Kubescape findings to Code Scanning
        # `!cancelled()` rather than `success()`: the findings are wanted most
        # when the scan's threshold FAILED, and ksail writes the SARIF before
        # applying it. Gated on the normalize OUTPUT so a normalizer failure
        # cannot fall through to publishing dead paths. No fork check is needed
        # — this runs on a push to main, which is never a fork.
        if: >-
          !cancelled() &&
          steps.normalize-sarif.outputs.sarif == 'ready'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/kubescape.sarif
          # MUST match ci.yaml's category: Code Scanning dedupes and closes per
          # (tool, category, ref), so a different category here would create a
          # parallel alert set instead of a baseline the PR findings resolve
          # against.
          category: kubescape-nsa

      - name: 📋 Summarize Kubescape findings
        # This job exists because ci.yaml scans on `pull_request` only, so a
        # posture change that arrived without a PR is invisible until this run
        # publishes it. That argument applies to the LOG as much as to the alert
        # set: without this step the push-to-main log can still read as a clean
        # scan while the same run uploads findings — the exact contradiction
        # #2846 is about, on the one path nobody opens a PR to look at.
        #
        # Reads the pre-normalization copy for the same reason ci.yaml does.
        # Informational only: this job's gate is the compliance threshold on the
        # scan step, and a summary that cannot be built says nothing about
        # posture, so it annotates rather than failing the baseline.
        continue-on-error: true
        if: >-
          !cancelled() &&
          steps.normalize-sarif.outputs.raw == 'ready'
        run: |
          shellcheck scripts/summarize-sarif-findings.sh
          bash scripts/summarize-sarif-findings.sh "${RUNNER_TEMP}/kubescape.raw.sarif"

  validate-scanner-versions:
    name: 🔢 Validate Scanner Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
      actions: read # read the mega-linter job log to learn the live versions
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔢 Compare recorded scanner versions against the live MegaLinter run
        # scripts/megalinter-scan-counts.sh reproduces CI's checkov and trivy
        # counts, and #2787 reads those counts as backlog movement. Its
        # equivalence holds only at the versions it records — and nothing in
        # THIS repository selects them: the MegaLinter action is pinned in
        # devantler-tech/actions, so the constants here go stale with no signal
        # when that pin moves. A rule-set change then looks exactly like someone
        # fixing findings.
        #
        # On main rather than on PRs for two reasons: reading Actions logs needs
        # a token a fork PR does not have, and version drift is slow-moving, so
        # per-PR is the wrong cadence. The offline parsing contract IS gated on
        # PRs, in ci.yaml.
        #
        # Exit 1 (measured drift) fails: the constants are wrong and #2787's counts cannot be read
        # until they are corrected. Exit 2 (could not verify) warns instead, because it is not a
        # statement about this repository at all — the managed workflow runs on its own path filter
        # and can simply go quiet here for longer than the bounded scan window reaches back. This
        # job runs after merge and gates nothing, so holding main red on another repository's
        # pipeline cadence costs the whole repository a red default branch while telling nobody
        # anything actionable. The warning is visible in the run summary and the next genuine run
        # resolves it either way.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          bash scripts/check-megalinter-version-drift.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            2)
              # Built up in parts rather than one continued string: a backslash-continuation inside
              # double quotes keeps the next line's YAML indentation, which lands as a run of spaces
              # in the middle of the annotation.
              msg="Could not establish the live MegaLinter scanner versions (exit 2)."
              msg="$msg The recorded constants are unchanged and no drift is claimed;"
              msg="$msg see the step log for which evidence was refused."
              echo "::warning title=Scanner versions unverified::$msg"
              ;;
            *) exit "$rc" ;;
          esac

  # The apps-base component gate and FANOUT_NAMESPACES must agree, or the
  # post-reconcile reassertion in deploy-prod (--reuse-runtime-proof, no
  # exemption) marks the fan-out incomplete and FAILS EVERY OTHERWISE-SUCCESSFUL
  # DEPLOY (#3476). ci.yaml gates that on `pull_request` only, so a direct push
  # to main — or an apps-base edit that reaches production by the manual CD
  # route — never exercises the invariant, and the disagreement surfaces for the
  # first time as a failed production deploy.
  #
  # Its own job, for the same reason as validate-shared-publish-pin above: this
  # validator must not share a job with steps that could subvert it.
  #
  # Deliberately not path-filtered, matching this workflow's header: the guard
  # reads both the apps base and the fan-out list, and a change to either side —
  # or to the guard itself — can move the result.
  validate-ghcr-fanout-component-gate:
    name: 🔗 Validate GHCR Fan-out Component Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔗 Validate the GHCR fan-out follows the apps-base component gate
        run: |
          shellcheck scripts/guard-ghcr-fanout-component-gate.sh
          shellcheck scripts/tests/test-guard-ghcr-fanout-component-gate.sh
          bash scripts/guard-ghcr-fanout-component-gate.sh
          bash scripts/tests/test-guard-ghcr-fanout-component-gate.sh
