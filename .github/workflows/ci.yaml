        # Render the full component contract so the cAdvisor scrape and its
        # least-privilege delivery path cannot silently disappear.
        run: bash scripts/tests/test-opencost-usage-scraper.sh

      - name: 🔄 Validate Crossplane sync exporter metrics path
        if: needs.changes.outputs.k8s == 'true'
        # A wrong GVK, a renamed series, or a scrape target that drifts from the
        # kube-state-metrics listen address all export nothing — and no series
        # reads exactly like a fleet with nothing wrong. Schema validation cannot
        # see any of it, so render the component contract instead.
        run: bash scripts/tests/test-crossplane-sync-exporter.sh

      - name: 🩺 Validate the CNPG degraded-cluster alert
        if: needs.changes.outputs.k8s == 'true'
        # This CronJob is the only signal for a database degraded without
        # crashlooping, and a broken check prints the same "none degraded" line
        # as a healthy fleet. Run its real script against a stubbed API and
        # delivery so both silent-zero guards and the credential's handling are
        # pinned by behaviour rather than by schema.
        run: bash scripts/tests/test-cnpg-degraded-alert.sh

      - name: 🩺 Validate the stranded-volume-attach alert
        if: needs.changes.outputs.k8s == 'true'
        # The only direct signal for the 2026-07-01 shape — a volume stranded on
        # a departed node, logged by the rescheduled pod for nine hours while
        # nothing alerted (#2363, #2754). Replays that shape and every ordinary
        # shape against a stubbed API and delivery, so the fire, each quiet
        # verdict and both silent-zero guards are pinned by behaviour.
        run: bash scripts/tests/test-stranded-volume-attach-alert.sh

      - name: 🔑 Validate the MinIO bucket Job's credential handling
        if: needs.changes.outputs.k8s == 'true'
        # checkov CKV_K8S_35 was dispositioned here by moving the root
        # credential out of the environment and into a mounted file. That
        # only holds while the Job imports the file, keeps the credential
        # out of argv, and waits on a command that actually reaches MinIO —
        # none of which schema validation can see.
        run: bash scripts/tests/test-minio-create-bucket-credentials.sh

      - name: 🧭 Validate the DR rebuild supersession gate
        if: needs.changes.outputs.k8s == 'true'
        # concurrency alone cannot stop a pending DR dispatch from rebuilding on
        # top of the rebuild that just recovered prod. The guard supplies that,
        # and this pins both its decision and the wiring that reaches it — a
        # guard the destructive job does not depend on protects nothing.
        run: bash scripts/tests/test-dr-rebuild-supersession-guard.sh

      - name: 🔍 Validate the published-evidence gate
        if: needs.changes.outputs.k8s == 'true'
        # Every publication step can report success while leaving no usable
        # evidence in the registry, and the promotion that follows is what
        # production starts following within the minute. This pins the gate's
        # verdict in both rollout states and the wiring that reaches it — a gate
        # that runs after latest already moved has verified nothing that matters.
        run: bash scripts/tests/test-verify-published-evidence.sh

      - name: 🔏 Validate the matcher-accepts-staged-digest gate
        if: needs.changes.outputs.k8s == 'true'
        # The matcher-efficacy job asks the same question of the MUTABLE tag, which
        # at promotion time still names the PREVIOUSLY published artifact — so it
        # cannot see a change to the publishing identity itself (#3289). This pins
        # the gate that asks it of the staged digest instead, including its negative
        # control and the liveness sandwich that stops an outage being counted as a
        # refusal, plus the wiring that puts it before the promotion.
        run: bash scripts/tests/test-verify-matcher-accepts-digest.sh

      - name: 🔐 Validate the shared-publish-workflow pin guard
        if: needs.changes.outputs.k8s == 'true'
        # The guard fails by PASSING: a widened cosign matcher still verifies, so
        # nothing else in CI notices. This pins the shapes it must reject — above
        # all the SHA-or-tag alternation removed in #3022, which is the exact
        # prior contents of all eight subjects and would otherwise revert in
        # silence — plus the floor and the wiring that reaches it.
        run: bash scripts/tests/test-shared-publish-workflow-pin-guard.sh

      - name: 🧷 Validate checkov skip reasons are quoted and intact
        if: needs.changes.outputs.k8s == 'true'
        # A `checkov.io/skipN` whose reason parses away still suppresses its
        # finding, because the check id sits before the `#`. The suppression then
        # reads as reviewed while asserting nothing, and no other check in CI can
        # see it. The guard removes that failure rather than detecting it: every skip
        # value must be an explicitly QUOTED scalar, because a quoted `#` is literal.
        # (Detecting truncation from source text is impossible — a complete reason plus
        # a trailing comment is lexically identical to a truncated one.) This runs the
        # guard over the tree and pins its verdict in all three directions — pass,
        # reject, and cannot-check — because a guard that has only ever seen passing
        # input has proved nothing about what it rejects.
        run: |
          bash scripts/guard-checkov-skip-reasons.sh k8s
          bash scripts/tests/test-guard-checkov-skip-reasons.sh

      - name: 📌 Validate every GitRepository is pinned to a commit
        if: needs.changes.outputs.k8s == 'true'
        # A GitRepository naming a mutable ref reconciles whatever the branch tip is,
        # so the trust boundary becomes the source repository's own enforcement.
        # #2707 closed that on the unifi source by pinning the full commit, which fixes
        # the content cryptographically and makes moving it a reviewed Platform change.
        # That mitigation lived in one YAML file with nothing asserting it, so reverting
        # it — deliberately or as collateral — would silently restore the exposure with
        # nothing in CI noticing (#3124). This runs the guard over the tree and pins its
        # verdict in all three directions, including the anti-vacuity case: finding NO
        # GitRepository at all is cannot-check, never a clean pass.
        run: |
          bash scripts/guard-gitrepository-commit-pin.sh k8s
          bash scripts/tests/test-guard-gitrepository-commit-pin.sh

      - name: 🌐 Validate no render path fetches over the network
        if: needs.changes.outputs.k8s == 'true'
        # Two entries in the prod controllers render fetch third-party manifests at
        # render time, one of them from Cloudflare's `trunk` BRANCH. That makes the
        # render irreproducible (the same commit can yield two different rendered
        # surfaces), puts unreviewed third-party content into the prod authorization
        # surface the EKS CI role validator exists to pin, and makes a required
        # security gate hostage to a CDN — which is how it was found, when
        # raw.githubusercontent.com returned 429 and took four authorization tests
        # down on clean `main` (#3196).
        #
        # The two known entries carry rows in the reviewed exceptions list, so this
        # runs green today and a THIRD one fails the build. A row must name a
        # tracking issue, and a row whose URL is no longer referenced is itself a
        # violation — so the list cannot quietly become the place remotes accumulate.
        run: |
          bash scripts/guard-render-remote-resources.sh k8s
          bash scripts/tests/test-guard-render-remote-resources.sh

      - name: 🔗 Validate the pod-security exception still matches its mutation's scope
        if: needs.changes.outputs.k8s == 'true'
        # The exception suppresses C-0016/C-0055 everywhere EXCEPT the twelve
        # namespaces its compensating mutation does not reach. #2824 happened because
        # those two scopes drifted apart in silence, and the narrowing that fixed it
        # left the agreement resting on a code comment. Both directions of drift read
        # as compliance: a namespace added to the mutation's exclusions and not the
        # exception re-creates the original defect, and one removed from the
        # exclusions but left in the exception enforces controls where the mutation
        # now runs, producing findings that are not real gaps.
        #
        # The comparison is NOT against the exclusion list: add-pod-security-context
        # excludes fifteen namespaces, and three of them (cert-manager, keda,
        # opencost) are reached by the by-name add-imageuid rule. Reading exclusions
        # alone reports three false differences on a correct tree, and the natural way
        # to silence that is to add them to the exception — the very drift this
        # catches (#3224).
        run: |
          bash scripts/guard-pod-security-exception-scope.sh
          bash scripts/tests/test-guard-pod-security-exception-scope.sh

      - name: 🔎 Validate every suppressed control is documented as failing open
        if: needs.changes.outputs.k8s == 'true'
        # A control added under spec.posture that the file's fail-open warning does
        # not name. The exception makes each suppressed control report `passed` with
        # subStatus "w/exceptions", so reading status alone yields a clean result over
        # an unfixed population — 35 of 35 workloads when C-0211 was added (#3516).
        # The check is scoped to the marked warning block, not the whole header: when
        # C-0211 was added it WAS mentioned elsewhere in that header, so a file-wide
        # match passes on the very tree that motivated the guard.
        run: |
          bash scripts/guard-pod-security-exception-documented.sh
          bash scripts/tests/test-guard-pod-security-exception-documented.sh

      - name: 🧬 Validate Crossplane provider names match their derived names
        if: needs.changes.outputs.k8s == 'true'
        # A Crossplane Provider declared under a shortened alias instead of the name
        # Crossplane derives from its package (`<org>-<repo>`) is invisible until
        # something depends on it — then the dependency manager, which resolves by
        # derived NAME while the Lock is keyed by package SOURCE, creates a SECOND
        # Provider for a source already present. Building the dependency graph then
        # fails with `node <source> already exists`, which marks EVERY provider
        # Unhealthy and stops all Crossplane reconciliation, not just the duplicated
        # one. That is #3454: it went live 21 seconds into the 2.3.4 -> 2.4.0 bump and
        # ran for 15 hours, because nothing in GitHub can see a dead provider fleet.
        #
        # The same guard pins the other half, which the rename itself breaks: provider
        # RBAC is named after the revision (`crossplane:provider:<name>-<hash>:system`),
        # so two Kubescape exception lists match the provider name by anchored regex.
        # Renaming without updating both fails nothing — the manifests build, the
        # provider runs, and a C-0015 finding just reappears days later. Those two
        # lists are synced by hand, so one-updated-one-forgotten is the realistic drift.
        run: |
          bash scripts/guard-crossplane-provider-name-parity.sh k8s
          bash scripts/tests/test-guard-crossplane-provider-name-parity.sh

      - name: 🔗 Validate the GHCR fan-out follows the apps-base component gate
        if: needs.changes.outputs.k8s == 'true'
        # An app that pulls private first-party images is declared twice: enabled
        # in k8s/bases/apps/kustomization.yaml, and listed in FANOUT_NAMESPACES so
        # the post-reconcile reassertion proves its pull credential arrived. Two
        # hand-edited files, one switch, and nothing made them agree.
        #
        # The expensive direction is staging a component OFF and leaving it
        # listed. The pre-publish invocation defers a missing new consumer
        # (--record-runtime-proof), but the reassertion in deploy-prod runs with
        # --reuse-runtime-proof and has no such exemption, so it marks the
        # fan-out incomplete and FAILS EVERY OTHERWISE-SUCCESSFUL DEPLOY. Nothing
        # else catches it: the manifests build, CI is green, and the failure only
        # appears on the next production deploy. That is exactly what staging the
        # data-product-controller off introduced (#3476).
        run: |
          shellcheck scripts/guard-ghcr-fanout-component-gate.sh
          shellcheck scripts/tests/test-guard-ghcr-fanout-component-gate.sh
          bash scripts/guard-ghcr-fanout-component-gate.sh
          bash scripts/tests/test-guard-ghcr-fanout-component-gate.sh

      - name: 📐 Validate LimitRange-premised suppressions actually have a LimitRange
        if: needs.changes.outputs.k8s == 'true'
        # Several skips here are dispositioned not as accepted risk but as "the check
        # is blind to an admission-time default" — sound reasoning that holds only
        # where the LimitRange actually applies. The natural justification is that a
        # LimitRange is a base resource and so reaches every overlay, which is an
        # inference about REACHABILITY that reads as obviously true and is not: an
        # overlay that cherry-picks named base directories does not get it. Nothing
        # then fails — the suppression keeps suppressing and the workload runs with no
        # limit in exactly the overlay whose goal was prod-like admission. The guard
        # walks each provider's kustomize graph and pins its verdict in all three
        # directions, including the two anti-vacuity cases where a matcher that
        # matched nothing would otherwise look like a healthy tree.
        run: |
          bash scripts/guard-limitrange-premise.sh k8s
          bash scripts/tests/test-guard-limitrange-premise.sh

      - name: 📋 Validate Kubescape finding summary
        if: needs.changes.outputs.k8s == 'true'
        # The summary is what makes the CI log and the Security tab agree (#2846),
        # and it fails by under-reporting rather than by crashing — a dropped
        # control looks exactly like a clean scan. Pin the grouping, the counts and
        # the two SARIF shapes that turn into hard jq errors if indexed naively: a
        # result with no ruleId, and a ruleId absent from the rule table.
        run: bash scripts/tests/test-summarize-sarif-findings.sh

      - name: 🧭 Validate SARIF path normalisation
        if: needs.changes.outputs.k8s == 'true'
        # normalize-sarif-paths.sh is a fail-closed guard, and until now shellcheck
        # was its only gate — which cannot see a jq path that was never written.
        # That is exactly how fixes[] stayed un-rooted while the guard reported
        # success (#2863). Pin the rewrite over BOTH path-bearing fields, plus
        # idempotency, the hard error, and the clean-scan case.
        run: bash scripts/tests/test-normalize-sarif-paths.sh

      - name: 📢 Validate reconciliation-Alert namespace coverage
        if: needs.changes.outputs.k8s == 'true'
        # notification-controller has no namespace wildcard, so the Alert must list
        # every namespace holding a HelmRelease. A namespace missing from that list
        # is invisible: the release fails, rolls back, reports Ready, and nothing
        # pages (ksail-operator, 2026-07-14). Drift is a build failure, not a
        # comment. Go behavioral tests + Bash with the runner's kubectl/yq; no
        # cluster or secrets required.
        run: |
          go test ./scripts/tests/validate-alert-coverage
          shellcheck scripts/validate-alert-coverage.sh
          bash scripts/validate-alert-coverage.sh

      - name: ⚙️ Setup KSail
        # Renovate-managed (datasource github-releases; grouped 'ksail' with the
        # deploy-prod / dr-rebuild pins). The validate step below renders
        # HelmReleases in-process (Kustomize + Helm) so the actually-applied
        # manifests are validated. This was briefly non-deterministic — a
        # buffer-aliasing data race in kubeconform's resource.FromStream (it yields
        # resources aliasing the reused bufio.Scanner buffer, parsed concurrently
        # with the producer's next Scan()) corrupted the validated stream on the
        # >4MB HelmRelease-dense overlays (ksail#5362) — and was worked around with
        # --skip-helm-render (platform PR #2270). KSail v7.163.1 contains the
        # ksail#5978 containment: split the multi-document stream and clone each
        # document before concurrent validation. Upstream
        # yannh/kubeconform#363 is still pending, so require consecutive
        # stable-green runs here. TRIPWIRE: if validate/scan swing again, re-add
        # --skip-helm-render and reopen ksail#5362.
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.181.0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/setup-ksail.sh

      - name: 📥 Restore kubeconform schema cache
        # ksail's kubeconform client fetches JSON schemas from
        # raw.githubusercontent.com/yannh/kubernetes-json-schema on every cold run
        # and has nowhere to persist them across ephemeral CI runners — heavy,
        # repeated traffic across every PR is what tripped upstream 429
        # rate-limiting portfolio-wide (2026-07-09). Restore/save are split (rather
        # than the single `actions/cache` step) so the save below can run with
        # `if: always()` — the validate step below is exactly what's exercising
        # this cache and can itself fail on an uncached/rate-limited schema fetch;
        # a save gated on job success would then never persist the schemas it did
        # manage to fetch, and every retry would cold-start again.
        id: kubeconform-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ksail/kubeconform
          key: kubeconform-schema-cache-v1-${{ github.run_id }}
          restore-keys: |
            kubeconform-schema-cache-v1-

      - name: 🔒 Validate Crossplane provider egress policy
        if: needs.changes.outputs.k8s == 'true'
        # This test exercises KSail's in-process Helm renderer, so it must run
        # after the pinned KSail setup and schema-cache restore above. The
        # reviewed FQDN set must remain narrow while provider traffic stays on
        # the direct L3/L4 path that completes upstream TLS handshakes.
        run: bash scripts/tests/test-crossplane-egress-policy.sh

      - name: 🧠 Validate Kyverno admission VPA safety
        if: needs.changes.outputs.k8s == 'true'
        # Render the production VPA and the actual Kyverno chart Deployment so
        # right-sizing cannot silently replace the fail-closed admission
        # controller's memory limit. KSail is installed above because its CEL
        # rules run against Helm-rendered documents, not only the HelmRelease.
        run: |
          shellcheck scripts/tests/test-kyverno-admission-vpa.sh
          bash scripts/tests/test-kyverno-admission-vpa.sh

      - name: ✅ Validate manifests (local + prod overlays)
        # Schema-aware kubeconform validation with Flux variable substitution,
        # building both cluster overlays. Fully static: no cluster, no SOPS key
        # (Secrets are skipped); schema fetches are cached by the step above so
        # repeat runs make no network calls for already-seen schemas.
        #
        # This PR deliberately removes the temporary --skip-helm-render
        # workaround so the actually-applied Helm-rendered manifests are
        # validated again. KSail v7.163.1 carries the ksail#5978
        # stream-splitting containment for ksail#5362 while
        # yannh/kubeconform#363 remains open; merge only after this gate has
        # consecutive stable-green evidence.
        run: |
          ksail workload validate
          ksail --config ksail.prod.yaml workload validate

      - name: 🛡️ Validate Kubescape self-hosted scan persistence
        if: needs.changes.outputs.k8s == 'true'
        # The in-cluster scanner has no SaaS backend. Versions before v4.0.12
        # can override local-only intent and abort before persisting posture
        # results, while the scheduler Job still reports success (#3275).
        run: |
          shellcheck scripts/tests/test-kubescape-self-hosted-scan-persistence.sh
          bash scripts/tests/test-kubescape-self-hosted-scan-persistence.sh

      - name: 💾 Validate Kubescape storage compatibility image
        if: needs.changes.outputs.k8s == 'true'
        # Storage v0.0.303+ removes APIs this deployment still serves, while
        # v0.0.297 drops contended SQLite writes after its default timeout.
        # Keep the narrow compatibility build and its immutable deployment pin
        # executable and reviewable until an upstream compatible release exists.
        run: |
          shellcheck scripts/tests/test-kubescape-storage-hotfix.sh
          bash scripts/tests/test-kubescape-storage-hotfix.sh

      - name: 📤 Save kubeconform schema cache
        # Runs even if the validate step above failed (see the restore step's
        # note) so any schemas fetched before a rate-limit hit still persist for
        # the next run's restore-keys prefix match. Skipped only on an exact
        # primary-key hit (impossible here since the key includes
        # `github.run_id`, but keeps the step correct if that ever changes).
        if: "!cancelled() && steps.kubeconform-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ksail/kubeconform
          key: ${{ steps.kubeconform-cache.outputs.cache-primary-key }}

      - name: 🔎 Scan manifests (Kubescape NSA + MITRE) — hard gate
        # Static security scan, gated on the compliance score: the job FAILS if a
        # change drops the posture below the threshold, so new findings must be
        # fixed (or justified) before merge.
        #
        # TWO frameworks, because one does not cover the exception surface. The
        # ClusterSecurityException CRs name 76 distinct controls; NSA-CISA
        # evaluates 17 of them, so 59 excepted controls were outside the gate
        # entirely — including every RBAC control the CRs exist to govern, whose
        # findings were therefore neither gated nor reported. MITRE ATT&CK brings
        # 7 of those under it (measured 2026-08-10): C-0007, C-0015, C-0031,
        # C-0037, C-0045, C-0048, C-0053 — of which C-0053, C-0015 and C-0007
        # carry real residual findings. 52 excepted controls remain in neither
        # framework; #2823 tracks that residue.
        #
        # NB the two counts differ: MITRE adds 10 controls to the SCAN (nsa 20,
        # mitre 17, union 30), but only 7 of them are ones we except.
        #
        # The scan consumes the platform's justified exceptions: the
        # ClusterSecurityException CRs (k8s/bases/infrastructure/
        # cluster-security-exceptions/ — the single source of truth) are
        # converted at scan time into Kubescape's native exceptions format by
        # scripts/generate-kubescape-exceptions (#2264). With runtime-
        # enforced and except-only findings suppressed, the threshold gates the
        # residual REAL posture instead of sitting ~15 points under it.
        #
        # Two surfaces apply these exceptions: this scan, and the Headlamp view
        # via the generated headlamp-exceptions ConfigMap. The kubescape-operator's
        # stored scan resources (workloadconfigurationscans and the two summary
        # kinds) do NOT — their appliedIgnoreRules is empty, so they carry
        # pre-exception verdicts. Never read a posture number off those to judge
        # an exception's effect; use this scan's output (#2823).
        #
        # The threshold is a regression FLOOR, not the live score, and it gates
        # the COMBINED score across the frameworks listed above. The Kubescape
        # compliance score has historically been environment-dependent (Linux CI
        # runner vs macOS) and shifts with the ksail render, so CI is the source
        # of truth: the observed CI score with exceptions applied is 98.87%
        # (2026-07-11, ksail 7.165.2, NSA only). Locally on ksail 7.178.20
        # (2026-08-10) NSA reads 99.28 and MITRE 96.03, combining to 97 — so the
        # margin over this floor is thinner than it was under NSA alone. Re-baseline
        # against a CI run, not a local one, and never lower the floor to
        # accommodate a finding. (NB it may also need re-baselining after a ksail
        # version bump.)
        #
        # Known un-excepted residual: C-0012 on the local-dev MinIO Deployment
        # (deliberate dev-only credential — tracked for a root-cause fix, not
        # an exception). Ratchet the floor up as genuine gaps close; never
        # lower it.
        #
        # --format sarif -o writes the findings to a file IN ADDITION to a
        # human-readable posture table, and the upload step below turns those
        # findings into Code Scanning alerts.
        #
        # 🔴 That table OMITS the `Overall compliance-score` line — measured on
        # this repo's own CI run 2026-08-10 and reproduced locally: `--format
        # json` prints it, `--format sarif` does not. So THIS LOG CANNOT TELL
        # YOU THE SCORE, which is why the re-baselining note above cannot be
        # followed from the log alone. #3058 tracks making it visible; until it
        # lands, bisect the score by re-running with a raised
        # `--compliance-threshold` and reading the exit code.
        #
        # The threshold itself is unaffected by the format and still gates:
        # ablated 2026-08-10 at thresholds 95/99/100 under `--format sarif`,
        # giving exit 0/1/1 against a combined score of 97. A silent-pass here
        # would be the worst failure this step could have, so that ablation is
        # the check to repeat if the flag or format ever changes.
        run: |
          go test ./scripts/generate-kubescape-exceptions
          go run ./scripts/generate-kubescape-exceptions -o /tmp/kubescape-exceptions.json
          ksail workload scan --framework nsa,mitre --exceptions /tmp/kubescape-exceptions.json --compliance-threshold 95 --format sarif -o "${RUNNER_TEMP}/kubescape.sarif"

      - name: 🌉 Validate the Kubescape backlog bridge
        # The bridge derives themed, fingerprint-deduped backlog entries from
        # live-only Kubescape findings (#2854). It needs no cluster here: the
        # tests pin the two properties that make it safe to run unattended —
        # fingerprints stay stable across runs and input order (so unchanged
        # state never re-files), and a spec-stripped LIST input fails closed
        # instead of reporting a clean cluster.
        run: go test ./scripts/kubescape-backlog-bridge

      - name: 🧭 Make the SARIF paths repo-root-relative
        # Kubescape reports paths relative to the directory it scanned, so a
        # finding in k8s/bases/... arrives as bases/... . Code Scanning resolves
        # an alert against the REPO ROOT, so uploading those unchanged creates
        # alerts pointing at files that do not exist — measured on this PR's
        # first run: the upload was green, four alerts existed, all four dead.
        #
        # The same scan run locally emitted the k8s/ prefix, so the shape is not
        # stable across ksail versions. The script resolves each path against
        # the working tree rather than assuming either shape, so it is a no-op
        # if ksail later emits root-relative paths, and it hard-fails rather
        # than uploading a path it cannot resolve.
        id: normalize-sarif
        if: "!cancelled()"
        run: |
          shellcheck scripts/normalize-sarif-paths.sh
          # `!cancelled()` also covers the scan step failing BEFORE ksail writes
          # the SARIF — a failing `go test`, or a ksail crash. There is nothing to
          # normalize then, and exiting 2 with "no such file" would make this the
          # loudest error in the log and bury the one that actually matters.
          if [ ! -f "${RUNNER_TEMP}/kubescape.sarif" ]; then
            echo "::notice::No SARIF written — the scan step failed before producing one. Leaving its error as the visible failure."
            echo "sarif=absent" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Keep the scan's own output before normalization touches it. The
          # normalizer DROPS results with an empty artifactLocation.uri (see its
          # CONTRACT) because Code Scanning cannot anchor an alert without a
          # file. That is right for the upload and wrong for the summary: a
          # cluster-level control with no manifest behind it is exactly the kind
          # of finding that is otherwise invisible, so summarizing the
          # normalized file would under-report the very case this reporting
          # exists for. Upload reads the normalized file; the summary reads this.
          cp "${RUNNER_TEMP}/kubescape.sarif" "${RUNNER_TEMP}/kubescape.raw.sarif"
          # Emitted BEFORE the normalizer runs, because it is the summary's gate
          # and the summary must survive a normalizer failure. An unresolvable
          # path aborts the step, so anything echoed after that line never
          # happens — and gating the summary on `sarif=ready` would skip it
          # exactly when an upstream path-shape change made the findings most
          # worth reading.
          echo "raw=ready" >> "${GITHUB_OUTPUT}"
          bash scripts/normalize-sarif-paths.sh "${RUNNER_TEMP}/kubescape.sarif" k8s .
          # Only now is the file both PRESENT and root-relative. The upload gates
          # on this output, so a normalizer hard-failure (an unresolvable path)
          # cannot fall through to publishing the un-normalized SARIF — which
          # would create exactly the dead-path alerts this step exists to
          # prevent. `exit 0` above deliberately leaves it `absent` instead:
          # a missing SARIF is the scan's failure to report, not this step's.
          echo "sarif=ready" >> "${GITHUB_OUTPUT}"

      - name: 🛡️ Upload Kubescape findings to Code Scanning
        # The score gate above answers "did posture regress"; it cannot show
        # WHICH control failed on WHICH file, and a finding that does not move
        # the score is invisible in it entirely. Code Scanning gives each
        # control an alert with file and line, dedupes it across runs, and
        # closes it automatically when the finding is gone (#2829).
        #
        # `!cancelled()` rather than `success()`: the findings are wanted most
        # precisely when the gate above FAILED. ksail writes the SARIF before it
        # applies the threshold, so the file exists on that path too.
        #
        # Skipped on fork PRs — this job deliberately runs on them (it needs no
        # secrets), but a fork's GITHUB_TOKEN cannot be granted
        # security-events: write, so attempting the upload there would fail the
        # build for a permission no fork can have.
        #
        # The fork check is the ONLY narrowing: the scan step above is
        # unconditional within this job, so gating this step on a path filter
        # would silently drop the findings for any run the scan still made.
        #
        # KNOWN CHARACTERISTIC: cluster-RBAC controls that are not backed by a
        # manifest file (C-0002 is the one observed) emit a result with an EMPTY
        # artifactLocation.uri — there is no file for such a finding to anchor
        # to. The step above drops those; with this repo's exceptions applied
        # the scan produces none anyway (measured: 0 of 4 findings; the same
        # scan with exceptions removed produces 1 of 70).
        # Gated on the normalize step's OUTPUT, not merely on `!cancelled()`.
        # `!cancelled()` stays true when normalization FAILS, which would upload
        # the un-normalized SARIF and recreate the dead-path alerts that step
        # exists to prevent; it is also true when no SARIF was written at all,
        # which would invoke the uploader on a missing file. `sarif == 'ready'`
        # is reached only after the file exists AND normalization succeeded.
        # Note this deliberately still uploads when the SCAN step failed: a
        # compliance-threshold failure exits non-zero but writes a valid SARIF,
        # and those findings are precisely the ones worth publishing.
        if: >-
          !cancelled() &&
          steps.normalize-sarif.outputs.sarif == 'ready' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/kubescape.sarif
          # Distinguishes these alerts from the CodeQL and zizmor analyses that
          # already publish to this repository's Security tab, so each tool's
          # results are tracked and closed independently.
          category: kubescape-nsa

      - name: 📋 Summarize Kubescape findings
        # Kubescape's own console table shows only a subset of what it finds:
        # measured on this repository, a scan whose SARIF carried 4 findings
        # printed "All controls passed. No issues found". Since the upload above
        # turns those findings into alerts, the log and the Security tab
        # disagreed — and the log is what a developer reads on a PR (#2846).
        #
        # This reports from the SARIF the run already produced, so the two
        # surfaces cannot drift: same file, same findings.
        #
        # Gated on the normalizer's output rather than `!cancelled()` alone, for
        # the same reason the upload is: that output is the only signal that the
        # file both exists and is well-formed. It runs even when the upload step
        # did not — a fork PR cannot upload, but its author still benefits from
        # seeing what the scan found, which is why the script's wording does not
        # assert that an upload happened.
        #
        # Informational only. The compliance threshold on the scan step remains
        # the sole merge gate.
        #
        # The script exits non-zero on a usage error or a SARIF it cannot parse,
        # and leaves it to the caller whether that is fatal. This caller says no:
        # a summary that cannot be built says nothing about posture, and the gate
        # that does — the compliance threshold — has already run against the same
        # file. `continue-on-error` keeps the failure loud (the step is still
        # marked failed and annotated on the run) without blocking a merge on a
        # reporting bug. Without it, this step silently becomes a second gate,
        # contradicting the sentence above it.
        continue-on-error: true
        if: >-
          !cancelled() &&
          steps.normalize-sarif.outputs.raw == 'ready'
        run: |
          shellcheck scripts/summarize-sarif-findings.sh
          bash scripts/summarize-sarif-findings.sh "${RUNNER_TEMP}/kubescape.raw.sarif"

  naming:
    name: 🏷️ Validate Naming Conventions
    needs: [changes]
    # Static folder/file naming gate: kebab-case dirs, one-resource-per-file,
    # type-led filenames, and flux-kustomization disambiguation. Pure Python
    # stdlib — no cluster, no secrets, no network — so it also runs on fork PRs
    # and returns in seconds. See scripts/validate-naming.py and AGENTS.md
    # 'File and Directory Naming Conventions'.
    if: github.event_name == 'pull_request' && needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏷️ Validate naming conventions
        run: python3 scripts/validate-naming.py

  validate-talos:
    name: 🧪 Validate Talos Machine Config
    needs: [changes]
    # Renders the Talos machine config with every talos/ (prod) and talos-local/
    # patch applied and runs `talosctl validate` on the result — on the PR for
    # fast feedback and on the merge-group revision that production deploys.
    # A broken patch (or an env expansion that would render empty, like #2462's
    # ${WG_SERVER_PRIVATE_KEY}) is therefore caught before deploy. Placeholder
    # key material stands in for the env-expanded secrets, so this needs no
    # real secrets and runs on fork PRs too (issue #2477).
    if: (github.event_name == 'pull_request' && needs.changes.outputs.talos == 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup talosctl
        run: |
          .github/scripts/setup-talosctl.sh

      - name: ⚙️ Setup Go for version compatibility validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: ✅ Validate Kubernetes against the pinned Talos release
        run: |
          go test ./scripts/validate-talos-kubernetes-compatibility
          go run ./scripts/validate-talos-kubernetes-compatibility ksail.prod.yaml

      - name: ✅ Render + validate patched machine configs
        run: |
          set -euo pipefail

          # Placeholder key material for env-expanded patch values (ksail
          # expands these from environment secrets at deploy time — see
          # talos/control-planes/wireguard.yaml and
          # talos/cluster/authenticate-ghcr-pulls.yaml and
          # talos/cluster/mark-ghcr-pull-revision.yaml).
          # Real-format but throwaway, so validation exercises the expansion
          # path without any real secret on the PR event.
          WG_SERVER_PRIVATE_KEY="$(openssl rand -base64 32)"
          GHCR_USERNAME="placeholder-ghcr-user"
          GHCR_TOKEN="placeholder-ghcr-token"
          GHCR_PULL_REVISION="$(printf '%s\n' 'ENC[ci-placeholder-ciphertext]' | shasum -a 256 | awk '{print $1}')"
          export WG_SERVER_PRIVATE_KEY GHCR_USERNAME GHCR_TOKEN GHCR_PULL_REVISION

          validate_overlay() {
            local dir="$1" mode="$2"
            echo "::group::${dir} (${mode})"

            # Every ${VAR} referenced by the overlay's patches must be set and
            # non-empty here — an empty expansion is exactly the class of
            # failure that evicted #2462 from the merge queue.
            local vars v fmt=""
            vars=$(grep -rhoE '[$][{][A-Za-z_][A-Za-z0-9_]*[}]' "$dir" | sort -u | tr -d '{}$') || true
            for v in $vars; do
              if [ -z "${!v:-}" ]; then
                echo "::error::${dir}: \${${v}} is referenced by a patch but unset/empty — deploy would render an invalid machine config"
                exit 1
              fi
              fmt="${fmt}\${${v}} "
            done

            local out; out=$(mktemp -d)
            talosctl gen config ci-validate https://192.0.2.1:6443 --output-dir "${out}" >/dev/null

            # Mirror ksail's patch layering: cluster/ applies to every node,
            # control-planes/ and workers/ to their role. Expand env per patch
            # and fail on any token that survives substitution.
            local role base patches f expanded
            for role in control-planes workers; do
              case "${role}" in
                control-planes) base="${out}/controlplane.yaml" ;;
                workers) base="${out}/worker.yaml" ;;
              esac
              patches=()
              for f in "${dir}"/cluster/*.yaml "${dir}/${role}"/*.yaml; do
                [ -f "${f}" ] || continue
                expanded="${out}/$(echo "${f}" | tr '/' '_')"
                # Allowlist-scoped substitution: only the pre-checked vars are
                # expanded, so an unexpected placeholder shape survives for the
                # post-check below instead of being silently cleared.
                if [ -n "${fmt}" ]; then
                  envsubst "${fmt}" < "${f}" > "${expanded}"
                else
                  cp "${f}" "${expanded}"
                fi
                if grep -qE '[$][{][A-Za-z_][A-Za-z0-9_]*[}]' "${expanded}"; then
                  echo "::error::${f}: unexpanded \${VAR} after substitution"
                  exit 1
                fi
                patches+=("--patch" "@${expanded}")
              done
              if [ "${#patches[@]}" -gt 0 ]; then
                talosctl machineconfig patch "${base}" "${patches[@]}" -o "${out}/${role}-patched.yaml"
              else
                cp "${base}" "${out}/${role}-patched.yaml"
              fi
              talosctl validate -c "${out}/${role}-patched.yaml" -m "${mode}" >/dev/null
              echo "${dir}/${role}: rendered + validated (${mode})"
            done
            echo "::endgroup::"
          }

          validate_overlay talos cloud          # prod (Hetzner)
          validate_overlay talos-local container # local Docker test-bed

  validate-rgd-templates-merge-group:
    name: 🔬 Validate Nested RGD Workload Templates (merge group)
    needs: [changes]
    # The PR job proves the proposed head, but production deploys the speculative merge-group
    # revision. Re-run the complete behavioral contract on that exact revision before deploy-prod
    # can acquire the production environment or publish an artifact.
    if: >-
      github.event_name == 'merge_group' &&
      needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Trivy for nested RGD templates
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: 🔬 Validate nested RGD workload templates
        run: |
          shellcheck scripts/scan-rgd-templates.sh scripts/tests/test-rgd-template-static-scan.sh
          bash scripts/tests/test-rgd-template-static-scan.sh

  validate-ghcr-fanout-merge-group:
    name: 🔗 Validate GHCR Fan-out Component Gate (merge group)
    needs: [changes]
    # Same reason as the RGD job above: the PR job proves the proposed head, but
    # production deploys the speculative merge-group revision. This guard is what
    # stands between an enabled-but-unlisted consumer and a post-reconcile
    # reassertion that FAILS EVERY SUBSEQUENT DEPLOY, and the pull_request-only
    # invocation cannot see a mismatch main inherited from a direct push. cd.yaml
    # already gates its manual deploy on this guard (validate-ghcr-fanout-component-gate);
    # the merge queue is the path that actually deploys, so it needs the same
    # prerequisite rather than a weaker one.
    if: >-
      github.event_name == 'merge_group' &&
      needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔗 Validate the GHCR fan-out follows the apps-base component gate
        run: |
          shellcheck scripts/guard-ghcr-fanout-component-gate.sh
          shellcheck scripts/tests/test-guard-ghcr-fanout-component-gate.sh
          bash scripts/guard-ghcr-fanout-component-gate.sh
          bash scripts/tests/test-guard-ghcr-fanout-component-gate.sh

  deploy-prod:
    name: 🚀 Deploy to Prod
    needs:
      [
        changes,
        validate-eks-authorization,
        validate-publication-contract,
        validate-talos,
        validate-rgd-templates-merge-group,
        validate-ghcr-fanout-merge-group,
      ]
    if: github.event_name == 'merge_group' && needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    environment: prod
    # Shared with the CD workflow (cd.yaml) so a manual deploy and a
    # merge-queue deploy can never run against the prod cluster at once.
    # queue: max so a deploy waiting on that lock is queued rather than replaced
    # by the next merge — without it, the middle deploy of any burst is dropped
    # silently. See the fuller rationale in cd.yaml.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # checkout repository
      packages: write # push OCI artifacts to GHCR
      id-token: write # mint OIDC token for cosign keyless signing (Fulcio + Rekor)
      attestations: write # write SBOM + SLSA provenance attestations (see deploy-prod action)
      actions: read # read a prior run attempt status, to prove an orphaned fence holder is dead (deploy-prod recover-orphaned-fence)
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🚀 Deploy to Production
        # Shared with cd.yaml's manual deploy via this composite action so the
        # merge-queue and manual paths can never drift. Secrets are passed as
        # inputs because composite actions cannot read `secrets` directly.
        uses: ./.github/actions/deploy-prod
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
          kube-config: ${{ secrets.KUBE_CONFIG }}
          talos-config: ${{ secrets.TALOS_CONFIG }}
          ghcr-token: ${{ secrets.GHCR_TOKEN }}
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          wg-server-private-key: ${{ secrets.WG_SERVER_PRIVATE_KEY }}
          # Release a synchronization Lease that an already-dead deploy left
          # held, so one crashed run cannot wedge every later deploy and its own
          # heal. This relaxes no guard: the composite still refuses unless no
          # other fence is held, the heartbeat has stopped, and the holder's run
          # attempt is proven terminal via the API (#3343).
          recover-orphaned-fence: "true"

  heal-prod-on-failure:
    name: 🩹 Heal Prod (restore main after unsuccessful merge-group deploy)
    needs: [changes, deploy-prod, validate-publication-contract]
    # The deploy above runs on the SPECULATIVE merge ref, before the PR lands on
    # `main`. When it fails the merge group is ejected — but the OCI `latest` tag
    # (and the prod cluster reconciling it) is left pointing at that ejected
    # artifact, which never lands on `main`, so prod silently diverges from Git
    # until some future merge overwrites it (devantler-tech/platform#2026). This
    # unsuccessful-path-only job re-deploys the current tip of `main` via the
    # SAME composite, so the speculative artifact is immediately replaced by
    # main's signed artifact and prod reconverges with Git. It covers explicit
    # cancellation too: GitHub re-evaluates job conditions during normal
    # cancellation, and `always()` keeps this cleanup eligible after the deploy
    # job becomes cancelled. It has ZERO effect on a green merge (skipped) and
    # does NOT relax the gate: deploy-prod's failure still fails `CI - Required
    # Checks` below, so the PR is still ejected. It is intentionally NOT part of
    # that aggregation — it is best-effort cleanup, not a merge gate.
    if: >-
      always() &&
      github.event_name == 'merge_group' &&
      needs.changes.outputs.k8s == 'true' &&
      (needs.deploy-prod.result == 'failure' ||
       needs.deploy-prod.result == 'cancelled')
    runs-on: ubuntu-latest
    environment: prod
    # Same shared lock as deploy-prod / cd.yaml so the heal can never run against
    # the prod cluster at the same time as another deploy. `needs: deploy-prod`
    # also guarantees the failed deploy has released the lock before the heal
    # acquires it, so there is no self-deadlock.
    # queue: max matters most here: a heal that is dropped while pending leaves
    # main un-restored after a failed deploy, which is the exact state this job
    # exists to prevent. See the fuller rationale in cd.yaml.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # checkout repository
      packages: write # push OCI artifacts to GHCR
      id-token: write # mint OIDC token for cosign keyless signing (Fulcio + Rekor)
      attestations: write # write SBOM + SLSA provenance attestations (see deploy-prod action)
      actions: read # read a prior run attempt status, to prove an orphaned fence holder is dead (deploy-prod recover-orphaned-fence)
    steps:
      - name: 📑 Checkout main
        # Deploy the CURRENT tip of `main` (the last state that actually landed in
        # Git), not the merge group's base_sha, so the heal can never regress prod
        # below a newer merge that landed while this group was in flight.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Signer approval is enforced first by the deploy action from this main
      # checkout, so recovery uses the policy version of the revision it restores.
      - name: ⚙️ Setup Go for version compatibility validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: ✅ Validate main Kubernetes against the pinned Talos release
        # The heal deploys the current main checkout, which may have advanced
        # since validate-talos inspected the speculative merge-group revision.
        run: |
          go test ./scripts/validate-talos-kubernetes-compatibility
          go run ./scripts/validate-talos-kubernetes-compatibility ksail.prod.yaml

      - name: ⚙️ Setup Trivy for nested RGD templates
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: 🔬 Validate nested RGD workload templates on main
        # `main` may have advanced after the speculative merge-group scan. Re-run the complete
        # behavior contract on the exact checkout this heal is about to publish and reconcile.
        run: |
          shellcheck scripts/scan-rgd-templates.sh scripts/tests/test-rgd-template-static-scan.sh
          bash scripts/tests/test-rgd-template-static-scan.sh

      - name: ⚙️ Setup KSail for effective authorization validation
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.181.0"
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-ksail.sh

      - name: 🔐 Validate isolated chart child namespaces on main
        # Same reason as the RGD scan above, for the other gate this job's
        # publish depends on. `validate-eks-authorization` rendered the chart on
        # the SPECULATIVE merge ref; this job publishes `ref: main`, which may
        # have advanced since. Without this step the isolated-chart exemption
        # would be relied on for a revision no render ever inspected — and the
        # per-workflow coverage guard would still read ci.yaml as gated, because
        # a sibling job ran the validator on a different commit.
        timeout-minutes: 10
        run: |
          shellcheck scripts/tests/test-isolated-chart-namespace-rules.sh
          bash scripts/tests/test-isolated-chart-namespace-rules.sh

      - name: 🩹 Re-deploy main to Production
        # Reuse the shared deploy composite (push → sign → attest → reconcile →
        # cluster update) against main's checkout, so the restored artifact is
        # byte-for-byte a normal main deploy (fully signed/attested) — no drift
        # from the happy path.
        uses: ./.github/actions/deploy-prod
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
          kube-config: ${{ secrets.KUBE_CONFIG }}
          talos-config: ${{ secrets.TALOS_CONFIG }}
          ghcr-token: ${{ secrets.GHCR_TOKEN }}
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          wg-server-private-key: ${{ secrets.WG_SERVER_PRIVATE_KEY }}
          # Release a synchronization Lease that an already-dead deploy left
          # held, so one crashed run cannot wedge every later deploy and its own
          # heal. This relaxes no guard: the composite still refuses unless no
          # other fence is held, the heartbeat has stopped, and the holder's run
          # attempt is proven terminal via the API (#3343).
          recover-orphaned-fence: "true"

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        validate-publication-contract,
        validate-matcher-efficacy,
        validate-eks-authorization,
        validate,
        naming,
        validate-talos,
        validate-rgd-templates-merge-group,
        validate-ghcr-fanout-merge-group,
        deploy-prod,
      ]
    if: always()
    permissions: {}
    steps:
      - name: 📊 Evaluate job results
        uses: devantler-tech/actions/aggregate-job-checks@4f4e07a3ebf3e1161756a292966e36c91a65ee04 # v13.3.0
        with:
          job-results: >-
            ${{ needs.changes.result }}
            ${{ needs.validate-publication-contract.result }}
            ${{ needs.validate-matcher-efficacy.result }}
            ${{ needs.validate-eks-authorization.result }}
            ${{ needs.validate.result }}
            ${{ needs.naming.result }}
            ${{ needs.validate-talos.result }}
            ${{ needs.validate-rgd-templates-merge-group.result }}
            ${{ needs.validate-ghcr-fanout-merge-group.result }}
            ${{ needs.deploy-prod.result }}
