name: CI
on:
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
      pull-requests: read # detect changed files
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
      bridge_validation: ${{ steps.filter.outputs.bridge_validation }}
      talos: ${{ steps.filter.outputs.talos }}
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🩹 Validate merge-group heal contract
        run: |
          go test ./scripts/validate-merge-group-heal
          go run ./scripts/validate-merge-group-heal .github/workflows/ci.yaml

      - name: 💾 Validate two-stage PVC retirement
        # A merge-group artifact is speculative, but a PVC deletion is not: its
        # deletionTimestamp survives queue eviction and main cannot undo it.
        # Run in the shared changes job so both PR and merge-group refs compare
        # against their exact base even when the full manifest job is skipped.
        env:
          PVC_PRUNE_BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
        run: |
          shellcheck scripts/tests/test-pvc-prune-safety.sh
          bash scripts/tests/test-pvc-prune-safety.sh

      # The DR contract runs in its own dedicated job (below). This checks that
      # the verify block is in effect at all: it ran at spec.cluster.verify for
      # ~3 weeks, where KSail discards it, and every text-based check passed
      # throughout (#2920).
      - name: 🔐 Validate Flux verification is in effect
        run: |
          go test ./scripts/validate-flux-verify
          go run ./scripts/validate-flux-verify \
            ksail.prod.yaml \
            k8s/providers/hetzner/infrastructure/controllers/flux-instance/flux-instance.yaml

      # The step above covers the ROOT source. These are the other eight cosign
      # subjects — app OCIRepositories, the tenant RGD, the Kyverno policy and the
      # Talos image config — which trust the SHARED actions publish workflows and
      # must therefore pin a fixed revision. #2816 set that by hand in eight places;
      # this is what keeps it set (#2818).
      - name: 🔐 Validate shared publish workflows are pinned
        run: ./scripts/guard-shared-publish-workflow-pin.sh

      # The rules in talos/cluster/verify-first-party-images.yaml decide which images a node
      # will REFUSE once verification enforces, so a change to their order or their identities
      # silently changes the blast radius. This is the inventory tool's own hermetic suite —
      # no cluster, no registry, no credential — and it lives here rather than in the dormant
      # liveness workflow because a checker whose job is noticing a silent condition must not
      # itself regress silently (#3334, under #3101).
      - name: 🔐 Validate the first-party image signature inventory
        run: |
          # -x: the inventory script now sources scripts/registry-auth-lib.sh, and without it
          # SC1091 is reported and the run exits 1 on a script that is otherwise clean.
          shellcheck -x scripts/inventory-first-party-image-signatures.sh
          shellcheck scripts/tests/test-inventory-first-party-image-signatures.sh
          bash scripts/tests/test-inventory-first-party-image-signatures.sh
          # The credential lookup the probe uses to tell "unreadable" from "unsigned" apart. Pure
          # file parsing against fixtures — no registry and no credential of ours is involved.
          shellcheck -x scripts/registry-auth-lib.sh
          shellcheck -x scripts/tests/test-registry-auth-lib.sh
          bash scripts/tests/test-registry-auth-lib.sh

      - name: 🔐 Validate proposed Crossplane package signature checks
        run: |
          go test ./scripts/collect-first-party-packages
          shellcheck scripts/check-first-party-package-signatures.sh
          shellcheck scripts/tests/test-check-first-party-package-signatures.sh
          bash scripts/tests/test-check-first-party-package-signatures.sh

      # The guard above proves every matcher pins A revision. It cannot say WHICH, and
      # narrowing them to approved revisions (#2818) needs that fact for each consumer.
      # This runs the hermetic half of the report that computes it: the network resolver
      # is stubbed, so nothing here depends on another repository's release cadence.
      - name: 🔐 Validate the publish-revision report
        run: |
          shellcheck scripts/report-publish-workflow-signing-revisions.sh
          shellcheck scripts/tests/test-publish-workflow-signing-revisions.sh
          bash scripts/tests/test-publish-workflow-signing-revisions.sh

      # The report names the two revisions per consumer; the generator (#3550) turns them
      # into the committed approved set the matcher narrowing (#3308) is derived from. Its
      # cluster read and its pin read are both stubbed here, so this proves the fail-closed
      # shape — an unresolved consumer writes nothing — not any particular revision.
      - name: 🔐 Validate the approved-revisions generator
        run: |
          # -x: the generator SOURCES the report, and without it SC1091 is reported and the run exits 1.
          shellcheck -x scripts/generate-publish-workflow-approved-revisions.sh
          shellcheck -x scripts/tests/test-publish-workflow-approved-revisions.sh
          bash scripts/tests/test-publish-workflow-approved-revisions.sh

      # The pin guard above proves each matcher pins a FIXED revision; this one proves each
      # per-consumer matcher pins the revision PAIR the committed approved set names for that
      # consumer, and refuses any revision outside it (#3551, AC4 of #3308). Unconditional for
      # the same reason as the pin guard: the subjects live in four different trees.
      # Enforcement rejects broad SHA patterns and revisions outside each approved pair.
      - name: 🔐 Validate the approved-revisions guard
        env:
          APPROVED_REVISIONS_ENFORCE: '1'
        run: |
          shellcheck -x scripts/publish-workflow-approved-revisions.lib.sh
          shellcheck -x scripts/guard-publish-workflow-approved-revisions.sh
          shellcheck -x scripts/write-publish-workflow-matchers.sh
          shellcheck -x scripts/tests/test-publish-workflow-approved-revisions-guard.sh
          shellcheck scripts/tests/test-write-publish-workflow-matchers.sh
          bash scripts/tests/test-publish-workflow-approved-revisions-guard.sh
          bash scripts/tests/test-write-publish-workflow-matchers.sh

      - name: 🔐 Enforce approved publication signers
        env:
          APPROVED_REVISIONS_ENFORCE: '1'
        run: ./scripts/guard-publish-workflow-approved-revisions.sh

      # The scheduled regeneration (#3552, third child of #3308) runs the generator and
      # writer and guard above against prod and turns a moved set into ONE draft pull request.
      # Its safety is the WORKFLOW's shape — a fixed branch, a draft, an App-signed
      # commit, least-privilege token grants, and generator → writer → guard → pull request with
      # no continue-on-error — none of which any script it calls can enforce, so the
      # test below pins each with an ablation. Unconditional for the same reason as
      # the two steps above: the workflow lives outside the k8s paths.
      - name: 🔐 Validate the approved-revisions regeneration workflow
        run: |
          shellcheck scripts/tests/test-regenerate-publish-workflow-approved-revisions.sh
          bash scripts/tests/test-regenerate-publish-workflow-approved-revisions.sh

      # Both subject guards above examine a file only when it already carries a
      # shared-publish-workflow subject, so an OCIRepository pointed at a devantler-tech
      # artifact with NO spec.verify at all is invisible to them — and refused by nothing
      # else. This one discovers OCIRepositories by KIND and URL, at any nesting depth,
      # and requires cosign with exactly one identity on every devantler-tech GHCR
      # artifact (#3558). Unconditional, like the guards above.
      - name: 🔐 Validate every devantler-tech OCIRepository verifies
        run: |
          shellcheck scripts/guard-oci-repository-verify.sh
          shellcheck scripts/tests/test-guard-oci-repository-verify.sh
          bash scripts/tests/test-guard-oci-repository-verify.sh
          ./scripts/guard-oci-repository-verify.sh

      # Dropping a framework from the Kubescape gate REMOVES findings, so the
      # compliance score RISES and every check stays green — a coverage
      # regression that looks like an improvement. That is what un-gated 59
      # excepted controls for weeks (#2823). Unconditional, like the guard
      # above: the property it protects is not confined to the k8s paths.
      - name: 🔐 Validate the Kubescape gate's framework coverage
        run: |
          go test ./scripts/validate-kubescape-frameworks
          go run ./scripts/validate-kubescape-frameworks

      # .github/actionlint.yaml silences actionlint's "unexpected key" diagnostic
      # for concurrency.queue, which also removes its enum check. This restores it.
      - name: 🚦 Validate concurrency queue values
        run: |
          # BOTH extensions: the actionlint ignore covers .github/workflows/**, so
          # a .yml workflow left out here would have the "unexpected key"
          # diagnostic suppressed with nothing restoring the enum check.
          shopt -s nullglob
          workflows=(.github/workflows/*.yaml .github/workflows/*.yml)
          # Fail closed rather than pass vacuously if the glob ever matches nothing.
          if [ ${#workflows[@]} -eq 0 ]; then
            echo "::error::no workflow files matched; nothing was validated"
            exit 1
          fi
          go test ./scripts/validate-concurrency-queue
          go run ./scripts/validate-concurrency-queue "${workflows[@]}"

      # This guard spans the HelmRelease and Renovate policy, so it must run
      # without routing policy-only changes into the production k8s deploy path.
      - name: 🔐 Validate Headlamp OIDC version gate
        run: |
          shellcheck scripts/tests/test-headlamp-oidc-version-gate.sh
          bash scripts/tests/test-headlamp-oidc-version-gate.sh

      # Independent of the conditional validate job whose nested-RGD steps this protects. If those
      # steps are removed, this unconditional job must still fail the PR and merge-group revision.
      - name: 🔬 Validate nested RGD workflow wiring
        run: |
          shellcheck scripts/tests/test-rgd-template-static-scan-wiring.sh
          bash scripts/tests/test-rgd-template-static-scan-wiring.sh

      - name: 🔍 Filter paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            k8s:
              - 'k8s/**'
              - 'ksail.yaml'
              - 'ksail.prod.yaml'
              - '.sops.yaml'
              - 'talos-local/**'
              - 'talos/**'
              - 'scripts/validate-naming.py'
              - 'scripts/validate-embedded-json.py'
              - '.github/scripts/setup-ksail.sh'
              - 'scripts/tests/test-setup-ksail.sh'
              - '.github/scripts/setup-talosctl.sh'
              - 'scripts/tests/test-setup-talosctl.sh'
              - '.github/actions/deploy-prod/action.yml'
              - '.github/workflows/dr-rebuild.yaml'
              - '.github/workflows/validate-image-verifier-liveness.yaml'
              - 'scripts/tests/test-openbao-oidc-role.sh'
              - 'scripts/tests/test-human-api-access-boundary.sh'
              # The boundary test asserts over these two guides, so a docs-only
              # change to either must trigger it or those assertions can drift.
              - 'docs/oidc-kubectl.md'
              - 'docs/talos-access.md'
              - 'scripts/tests/test-actual-budget-auth-route.sh'
              - 'scripts/tests/test-actual-budget-user-namespaces.sh'
              # The provider DeploymentRuntimeConfigs, this gate and its kyverno
              # fixture are one contract: a container-only seccompProfile is
              # denied by the fail-closed webhook and takes the whole provider
              # fleet to zero pods on the next revision bump (#3470).
              - 'scripts/tests/test-provider-drc-pod-seccomp.sh'
              - 'tests/validate-pod-security-provider-deployment/**'
              - 'scripts/tests/test-pvc-prune-safety.sh'
              - 'scripts/tests/test-headlamp-plugin-removal.sh'
              - 'scripts/tests/test-github-config-role-activation-parity.sh'
              - 'scripts/tests/test-restrict-tenant-secret-stores.sh'
              - 'scripts/tests/test-restrict-tenant-network-policies.sh'
              - 'scripts/tests/test-add-baseline-context.sh'
              # The fixtures are the other half of that test: a PR touching only
              # resources.yaml, patched-resources.yaml, values.yaml or
              # kyverno-test.yaml would otherwise leave this filter false, so
              # neither kyverno test nor the shell gate would run on its own change.
              - 'tests/add-baseline-context/**'
              # The declarative fixtures are the other half of that test: a PR that
              # touches only resources.yaml or kyverno-test.yaml would otherwise leave
              # the k8s filter false, so neither kyverno test nor the shell gate runs.
              - 'tests/restrict-tenant-network-policies/**'
              # The Homepage layout and the policy's allow-list are one contract:
              # either side changing alone is the drift this test exists to catch.
              - 'scripts/tests/test-restrict-homepage-service-groups.sh'
              - 'scripts/tests/test-kyverno-umami-mutation-rbac.sh'
              - 'scripts/tests/test-kyverno-github-team-report-rbac.sh'
              - 'scripts/tests/test-tenant-route-hostname-boundary.sh'
              - 'scripts/tests/test-umami-provisioning-bootstrap.sh'
              # The snapshot manifests and this test are one contract: the
              # mirror may only stop depending on OWNING the snapshot while
              # both writers keep making it group-readable (#3202).
              - 'scripts/tests/test-vault-snapshot-group-readable.sh'
              - 'scripts/tests/test-kyverno-admission-vpa.sh'
              - 'scripts/tests/kyverno-admission-vpa-rules.yaml'
              # The image-verifier liveness checker and its test are one
              # contract: the checker's whole value is failing loudly, so a
              # change to either must re-run both.
              - 'scripts/validate-image-verifier-liveness.sh'
              - 'scripts/tests/test-validate-image-verifier-liveness.sh'
              - 'scripts/generate-kubescape-exceptions/**'
              - 'scripts/tests/test-kubescape-self-hosted-scan-persistence.sh'
              - 'scripts/tests/test-kubescape-storage-hotfix.sh'
              - '.github/workflows/publish-kubescape-storage-hotfix.yaml'
              - 'scripts/kubescape-backlog-bridge/**'
              # The updater and its annotation helper are one fail-closed
              # contract for the vendored CDI/KubeVirt manifests.
              - 'scripts/annotate-vendored-checkov/**'
              - 'scripts/update-vendored-operators.sh'
              # The Trivy dispositions and the local CI-equivalent scan are one
              # contract: a path-scoped ignore is inert unless both callers load it.
              - '.mega-linter.yml'
              - '.trivyignore'
              - '.trivyignore.yaml'
              - 'scripts/megalinter-scan-counts.sh'
              - 'scripts/tests/test-megalinter-scan-counts-ignorefile.sh'
              - 'scripts/tests/test-trivyignore-vendored-operator-boundary.sh'
              # The vault-config KSV-0020 disposition is path-scoped but the identity it rests
              # on is PER CONTAINER, so the entry and its premises test move together.
              - 'scripts/tests/test-trivyignore-vault-config-identity-boundary.sh'
              # The vault-backup KSV-0020 disposition rests on the same per-container identity,
              # and its guard also asserts that KSV-0021 stays UNdispositioned there.
              - 'scripts/tests/test-trivyignore-vault-backup-identity-boundary.sh'
              # The first-party RBAC dispositions and the roles they describe are one
              # contract: the disposition is only valid while the role stays bound and
              # scoped the way it was reviewed. The roles themselves are already covered
              # by the k8s/** entry above.
              - 'scripts/tests/test-trivyignore-first-party-rbac-boundary.sh'
              # The tenant role and the test that keeps its networkpolicies grant read-only
              # are one contract; the role is covered by k8s/**, the test is listed here.
              - 'scripts/tests/test-tenant-edit-networkpolicy-write.sh'
              # The KSV-01010 ConfigMap dispositions are path-scoped, so the entry and its
              # paired control move together — a widened glob would suppress the same check
              # on application ConfigMaps that genuinely carry credentials.
              - 'scripts/tests/test-trivyignore-configmap-content-boundary.sh'
              # RGD sources, their extracted-template scanner, and the exact finding ratchet are
              # one gate. k8s/** covers source edits; policy data and these entries cover its other
              # inputs so a changed scanner premise cannot skip the check that consumes it.
              - '.trivy/data/**'
              - 'scripts/scan-rgd-templates.sh'
              - 'scripts/rgd-template-static-scan-baseline.tsv'
              - 'scripts/rgd-template-static-scan-remote-resources.tsv'
              - 'scripts/tests/test-rgd-template-static-scan.sh'
              - 'scripts/tests/test-rgd-template-static-scan-wiring.sh'
              # The version-drift guard reads its constants out of
              # megalinter-scan-counts.sh, so the three move together.
              - 'scripts/check-megalinter-version-drift.sh'
              - 'scripts/tests/test-check-megalinter-version-drift.sh'
              # Both halves, so editing the guard alone — or its test alone —
              # still runs the check that covers it.
              - 'scripts/normalize-sarif-paths.sh'
              - 'scripts/tests/test-normalize-sarif-paths.sh'
              - 'scripts/summarize-sarif-findings.sh'
              - 'scripts/tests/test-summarize-sarif-findings.sh'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/tests/test-cilium-bandwidth-manager-component.sh'
              - 'scripts/tests/test-cilium-metadata-egress-policy.sh'
              - 'scripts/tests/test-cilium-mutual-auth-policy.sh'
              - 'scripts/tests/test-cilium-mutual-auth-policy-regressions.sh'
              - 'scripts/tests/test-coroot-postgres-scrape-policy.sh'
              - 'scripts/tests/test-cilium-homogeneous-devices-activation.sh'
              - 'scripts/tests/test-cilium-homogeneous-devices-autoscaler-gate.sh'
              - 'scripts/tests/test-cilium-homogeneous-devices-flux-wait.sh'
              - 'scripts/guard-cilium-homogeneous-device-rollout.sh'
              # Both halves, so editing the reporter alone — or its test alone —
              # still runs the check that covers it.
              - 'scripts/report-cilium-rollout-gate-suppression.sh'
              - 'scripts/tests/test-cilium-rollout-gate-suppression-signal.sh'
              - 'scripts/wait-for-platform-flux-revision.sh'
              # Both halves, so editing the reconcile wrapper alone — or its
              # test alone — still runs the check that covers it.
              - 'scripts/reconcile-flux-workloads.sh'
              - 'scripts/tests/test-flux-reconcile-control-plane-restart.sh'
              - 'scripts/tests/test-opencost-usage-scraper.sh'
              - 'scripts/tests/test-crossplane-sync-exporter.sh'
              - 'scripts/tests/test-crossplane-egress-policy.sh'
              - 'scripts/tests/crossplane-egress-policy-rules.yaml'
              - 'scripts/tests/test-cnpg-degraded-alert.sh'
              - 'scripts/tests/test-stranded-volume-attach-alert.sh'
              # The Job manifest, the Secret it imports and this test are one
              # contract: the credential is only out of the environment while all
              # three agree.
              - 'scripts/tests/test-minio-create-bucket-credentials.sh'
              # Both halves, so editing the guard alone — or its test alone —
              # still runs the check that covers it.
              - 'scripts/dr-rebuild-supersession-guard.sh'
              - 'scripts/tests/test-dr-rebuild-supersession-guard.sh'
              # Both halves, for the same reason as the guard above.
              - 'scripts/verify-published-evidence.sh'
              - 'scripts/tests/test-verify-published-evidence.sh'
              # Both halves, for the same reason. This gate runs on the deploy path
              # itself, so a PR that edits it without running its test would ship a
              # change to the last check standing between a bad matcher and prod.
              - 'scripts/verify-matcher-accepts-digest.sh'
              - 'scripts/tests/test-verify-matcher-accepts-digest.sh'
              # The pin guard itself runs unconditionally in the validate job, so
              # only its TEST is selected here. Both halves are listed anyway: a PR
              # that edits the guard must also run the test that pins its ablations,
              # or a widened allow-list would ship with every check still green.
              - 'scripts/guard-shared-publish-workflow-pin.sh'
              - 'scripts/tests/test-shared-publish-workflow-pin-guard.sh'
              # Both halves, for the same reason as the pin guard above: the guard step itself
              # runs unconditionally, and listing the pair here is what keeps a guard edit
              # inside the k8s-gated validation matrix alongside the manifests it judges.
              - 'scripts/guard-publish-workflow-approved-revisions.sh'
              - 'scripts/publish-workflow-approved-revisions.lib.sh'
              - 'scripts/write-publish-workflow-matchers.sh'
              - 'scripts/tests/test-write-publish-workflow-matchers.sh'
              - 'scripts/tests/test-publish-workflow-approved-revisions-guard.sh'
              # The generator that writes the set the guard above reads, and its test — both
              # halves, so editing either alone still runs the fail-closed proof (an unresolved
              # consumer writes nothing) that step 🔐 Validate the approved-revisions generator pins.
              - 'scripts/generate-publish-workflow-approved-revisions.sh'
              - 'scripts/tests/test-publish-workflow-approved-revisions.sh'
              # The scheduled regeneration workflow and its contract test — both halves, so a
              # PR that edits only the workflow (a widened token grant, an interpolated branch,
              # a continue-on-error) still runs the ablated test that refuses each of those.
              - '.github/workflows/regenerate-publish-workflow-approved-revisions.yaml'
              - 'scripts/tests/test-regenerate-publish-workflow-approved-revisions.sh'
              # The generated set itself. The contract test reads it to derive which
              # consumer repositories the workflow's App token must be scoped to, so a
              # PR that only adds a consumer here — the exact change that would leave
              # the token unable to read that consumer — must still run that check.
              - 'scripts/publish-workflow-approved-revisions.tsv'
              # Both halves, for the same reason as the guards above.
              - 'scripts/guard-oci-repository-verify.sh'
              - 'scripts/tests/test-guard-oci-repository-verify.sh'
              # Both halves, for the same reason as the guard above.
              - 'scripts/validate-kubescape-frameworks/main.go'
              - 'scripts/validate-kubescape-frameworks/main_test.go'
              # Both halves, so editing the guard alone — or its test alone —
              # still runs the check that covers it.
              - 'scripts/guard-checkov-skip-reasons.sh'
              - 'scripts/tests/test-guard-checkov-skip-reasons.sh'
              # Both halves, for the same reason as the guard above.
              - 'scripts/guard-limitrange-premise.sh'
              - 'scripts/tests/test-guard-limitrange-premise.sh'
              # Both halves, for the same reason as the guard above.
              - 'scripts/guard-gitrepository-commit-pin.sh'
              - 'scripts/tests/test-guard-gitrepository-commit-pin.sh'
              # Both halves, for the same reason as the guard above.
              - 'scripts/guard-render-remote-resources.sh'
              - 'scripts/tests/test-guard-render-remote-resources.sh'
              # The reviewed disposition list the guard reads: editing a row
              # changes what the guard permits, so it must re-run.
              - 'scripts/render-remote-resource-exceptions.tsv'
              # Both halves, for the same reason as the guards above.
              - 'scripts/guard-pod-security-exception-scope.sh'
              - 'scripts/tests/test-guard-pod-security-exception-scope.sh'
              # Both halves, for the same reason as the guards above. The guard also
              # reads the exception manifest itself, covered by 'k8s/**'.
              - 'scripts/guard-pod-security-exception-documented.sh'
              - 'scripts/tests/test-guard-pod-security-exception-documented.sh'
              # Both halves, for the same reason as the guards above.
              - 'scripts/guard-crossplane-provider-name-parity.sh'
              - 'scripts/tests/test-guard-crossplane-provider-name-parity.sh'
              # Both halves, for the same reason as the guards above. This guard
              # also reads scripts/refresh-flux-ghcr-auth.sh, already selected
              # below, and k8s/bases/apps/kustomization.yaml, covered by 'k8s/**'.
              - 'scripts/guard-ghcr-fanout-component-gate.sh'
              - 'scripts/tests/test-guard-ghcr-fanout-component-gate.sh'
              - 'scripts/validate-eks-ci-role-policy/**'
              - 'scripts/tests/isolated-chart-namespace-rules.yaml'
              - 'scripts/tests/test-isolated-chart-namespace-rules.sh'
              - 'scripts/tests/production-authorization-rules.yaml'
              - 'scripts/tests/test-production-authorization-rules.sh'
              - 'tests/**'
              - 'scripts/validate-alert-coverage.sh'
              - 'scripts/tests/validate-alert-coverage/**'
              - 'scripts/refresh-flux-ghcr-auth.sh'
              - 'scripts/refresh-flux-ghcr-auth-safety.sh'
              - 'scripts/ghcr-auth-lib.sh'
              - 'scripts/run-ksail-prod-with-pull-auth.sh'
              - '.github/actions/deploy-prod/**'
              - '.github/workflows/dr-rebuild.yaml'
              - '.github/workflows/ci.yaml'
              # cd.yaml carries the manual-deploy gate itself. Without it here, a PR
              # that deletes that gate does not run the job whose test guards it.
              - '.github/workflows/cd.yaml'
              # Same reasoning for validate-main.yaml, which carries the
              # push-to-main gate: TestAuthorizationGateRunsOnPushToMain guards it,
              # and that test only runs when this filter matches.
              - '.github/workflows/validate-main.yaml'
            bridge_validation:
              - 'scripts/refresh-flux-ghcr-auth.sh'
              - 'scripts/refresh-flux-ghcr-auth-safety.sh'
              - 'scripts/ghcr-auth-lib.sh'
              - 'scripts/run-ksail-prod-with-pull-auth.sh'
              - 'scripts/use-prod-stable-api-endpoint.sh'
              - 'scripts/tests/test-use-prod-stable-api-endpoint.sh'
              - 'scripts/tests/test-refresh-flux-ghcr-auth-safety.sh'
              - 'scripts/tests/refresh-flux-ghcr-auth/**'
              - 'docs/dr/runbook.md'
              - '.github/actions/deploy-prod/**'
              - '.github/workflows/dr-rebuild.yaml'
              - '.github/workflows/ci.yaml'
            talos:
              - 'talos/**'
              - 'talos-local/**'
              - 'ksail.prod.yaml'
              - '.github/scripts/setup-talosctl.sh'
              - 'scripts/validate-talos-kubernetes-compatibility/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yaml'

  validate-publication-contract:
    name: 🖋️ Validate Publication Contract
    # A DEDICATED job, mirroring cd.yaml's, and that is the point rather than a
    # style choice. The runner's $GITHUB_ENV and $GITHUB_PATH bridges carry
    # across steps, so any step sharing a job with this validator could shadow
    # `go` for it while the validator step itself still read as correct. Keeping
    # the job to nothing but its own validator is what the contract's
    # gateJobRunsOnlyItsValidator rule asserts, and it can only hold here.
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🖋️ Validate DR signing contract
        # Identical invocation to cd.yaml's, deliberately: the two routes to
        # production must be gated by the same check, or they drift and the
        # weaker one becomes the real policy.
        run: |
          go test ./scripts/validate-dr-signing
          go run ./scripts/validate-dr-signing .github/workflows/dr-rebuild.yaml ksail.prod.yaml

  validate-matcher-efficacy:
    name: 🔏 Validate Cosign Matcher Efficacy
    # A DEDICATED job because this is the only validator that needs to READ the
    # registry, and that permission should not be inherited by the jobs that do
    # not need it.
    #
    # Every static check we had passed on a matcher that verified ZERO artifacts
    # and halted all GitOps delivery on prod for ~5.5 hours (#3005). This asks
    # the one question those cannot: does the matcher, as written in the
    # manifest, accept a signer that really signed this artifact?
    #
    # SKIPPED ON FORK PULL REQUESTS, and still enforced before anything merges.
    # Reading this artifact needs a token carrying package read; a fork PR's
    # GITHUB_TOKEN does not have one, so running it there would fail every
    # external contribution on a permission it cannot be granted. The merge
    # queue is not a fork context, so the gate still holds at the only moment
    # that decides what production actually gets.
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
      packages: read # read the manifests artifact's signature from GHCR
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🔏 Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔏 Check the configured matcher verifies the real artifact
        # 🔴 THE PATTERNS ARE NEVER SPELLED HERE. They are printed out of the
        # manifests we deploy and handed straight to cosign, so this tests the
        # deployed rule rather than a copy of it that can drift.
        #
        # cosign is the matcher's real consumer — Flux hands it these same two
        # regexes — so letting cosign decide keeps the check's semantics
        # identical to production's instead of reimplementing them.
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ghcr.io/devantler-tech/platform/manifests:latest
        run: |
          set -euo pipefail

          go test ./scripts/validate-matcher-efficacy

          MATCHER_JSON="$(go run ./scripts/validate-matcher-efficacy --print-matcher \
            ksail.prod.yaml \
            k8s/providers/hetzner/infrastructure/controllers/flux-instance/flux-instance.yaml)"
          # 🔴 DECODE AS JSON, never line-per-value. A matcher value may legitimately
          # contain a newline — a YAML literal block is valid for these fields — and a
          # line-based read would take only its first line, verifying against a
          # truncated regex while Flux enforces the whole thing. That is a matcher
          # inert in production and green here: exactly what this job refuses.
          # `jq -e` fails on a null or missing field, so a malformed handoff stops
          # the build instead of silently yielding an empty pattern.
          ISSUER="$(jq -er '.issuer' <<<"${MATCHER_JSON}")"
          SUBJECT="$(jq -er '.subject' <<<"${MATCHER_JSON}")"
          if [ -z "${ISSUER}" ] || [ -z "${SUBJECT}" ]; then
            echo "::error::could not read the matcher out of the manifests"
            exit 1
          fi
          echo "matcher issuer:  ${ISSUER}"
          echo "matcher subject: ${SUBJECT}"

          echo "${REGISTRY_TOKEN}" | cosign login ghcr.io -u "${REGISTRY_USER}" --password-stdin

          # THE CHECK. Fails when the deployed matcher would not verify the
          # artifact it guards — which is #3005, caught before the deploy.
          if ! cosign verify \
            --certificate-oidc-issuer-regexp "${ISSUER}" \
            --certificate-identity-regexp "${SUBJECT}" \
            "${ARTIFACT}" > /dev/null; then
            echo "::error::the cosign matcher in the manifests does not verify ${ARTIFACT}."
            echo "::error::a matcher that matches nothing is inert: present, green, and enforcing nothing."
            exit 1
          fi
          echo "the configured matcher verifies the artifact"

          # THE NEGATIVE CONTROL, run on every build rather than asserted once.
          # A deliberately wrong subject MUST be refused; if it is accepted the
          # check above proves nothing and is itself the vacuous control this
          # job exists to prevent.
          if cosign verify \
            --certificate-oidc-issuer-regexp "${ISSUER}" \
            --certificate-identity-regexp '^https://github\.com/devantler-tech/NOT-A-REAL-REPO/.*$' \
            "${ARTIFACT}" > /dev/null 2>&1; then
            echo "::error::negative control PASSED — a deliberately wrong subject was accepted."
            echo "::error::this check cannot distinguish a good matcher from a broken one. Fix it before trusting it."
            exit 1
          fi

          # 🔴 THAT NON-ZERO EXIT IS NOT YET EVIDENCE OF A REFUSAL. A network,
          # registry or auth failure also exits non-zero, and would report the
          # control as having passed while proving nothing — the control would
          # then be vacuous in exactly the way it exists to detect. Re-run the
          # POSITIVE check: if the same path still verifies, the refusal above
          # was a real refusal rather than an outage. This is a liveness
          # sandwich, deliberately not a match on cosign's error text, which is
          # not a stable interface.
          if ! cosign verify \
            --certificate-oidc-issuer-regexp "${ISSUER}" \
            --certificate-identity-regexp "${SUBJECT}" \
            "${ARTIFACT}" > /dev/null; then
            echo "::error::the negative control exited non-zero, but the artifact can no longer be"
            echo "::error::verified either — so this run cannot prove the control refused for the"
            echo "::error::right reason. Treating an unprovable control as a failure, not a pass."
            exit 1
          fi
          echo "negative control refused a wrong subject, and the positive path still verifies"
          echo "=> the check above is not vacuous"

      - name: ⚖️ Install Kyverno CLI for package admission checks
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: v1.18.2

      - name: 🔐 Verify proposed first-party Crossplane packages
        # The package image becomes the provider controller's Pod image. Check
        # both Talos's first-match pull rule and Kyverno's actual admission
        # policy against the proposed reference, before a rollout can wedge it.
        # This inherits the registry-read job's fork/merge-group boundary.
        timeout-minutes: 10
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/package-signature-docker
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin
          bash scripts/check-first-party-package-signatures.sh

  validate-eks-authorization:
    name: 🔐 Validate Production Authorization
    needs: [changes]
    if: >-
      needs.changes.outputs.k8s == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ⚙️ Install pinned kubectl renderer
        shell: bash
        env:
          KUBECTL_VERSION: "v1.36.2"
          KUBECTL_SHA256: "1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82"
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/kubectl"
          curl -fsSL \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check
          sudo install "$kubectl_path" /usr/local/bin/kubectl
          kubectl version --client

      - name: 🔐 Validate static production authorization controls
        # The Go validator pins the EKS CI role and the authored authorization
        # graph before either a PR or merge-group commit may proceed.
        run: |
          go test ./scripts/validate-eks-ci-role-policy
          go run ./scripts/validate-eks-ci-role-policy .

      - name: ⚙️ Setup KSail for effective authorization validation
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.181.0"
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-ksail.sh

      - name: 🔐 Validate isolated chart child namespaces
        # The data-product-controller component remains outside the deploy
        # overlay. Render its immutable chart explicitly so every child with a
        # namespace is proven local before the isolated-chart exemption can be
        # relied on by this PR or speculative merge-group revision.
        timeout-minutes: 10
        run: |
          shellcheck scripts/tests/test-isolated-chart-namespace-rules.sh
          bash scripts/tests/test-isolated-chart-namespace-rules.sh

      - name: 🔐 Validate the production authorization rule suite
        # Split from the render below so the job summary attributes a failure to
        # the rule suite rather than to an unreachable chart registry.
        run: |
          shellcheck scripts/tests/test-production-authorization-rules.sh
          bash scripts/tests/test-production-authorization-rules.sh

      - name: 🚦 Validate Actual Budget user-namespace pilot
        # Exercise the dormant component on both the PR and the speculative
        # merge-group revision before deploy-prod can publish that revision.
        timeout-minutes: 5
        run: |
          shellcheck scripts/tests/test-actual-budget-user-namespaces.sh
          bash scripts/tests/test-actual-budget-user-namespaces.sh

      - name: 🔐 Validate Helm-rendered production authorization controls
        # KSail renders chart children before evaluating the CEL rules, closing
        # the visibility gap in kubectl kustomize's HelmRelease-only output.
        #
        # This reaches every upstream chart registry, and the job gates
        # deploy-prod, so an unreachable registry would otherwise hang a
        # required check and hold the merge queue for the job's full budget.
        timeout-minutes: 10
        run: ksail --config ksail.prod.yaml workload validate

  validate:
    name: 🧪 Validate Manifests
    needs: [changes]
    # Static, no-cluster validation. The local Docker cluster is now a thin
    # manual test-bed (see AGENTS.md) rather than a full prod stand-in, so CI no
    # longer boots it; instead it schema-validates and security-scans the
    # manifests. This needs no secrets, so — unlike the old system test — it also
    # runs on fork PRs.
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.k8s == 'true' ||
      needs.changes.outputs.bridge_validation == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
      security-events: write # upload the Kubescape SARIF to Code Scanning
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        # Needed by the Kubescape exceptions generator below (Go, per the
        # bash-or-Go scripting standard) — the scan step shells out to it.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🔐 Validate KSail installer integrity guard
        if: needs.changes.outputs.k8s == 'true'
        run: |
          shellcheck .github/scripts/setup-ksail.sh scripts/tests/test-setup-ksail.sh
          bash scripts/tests/test-setup-ksail.sh

      - name: 🔐 Validate talosctl installer integrity guard
        if: needs.changes.outputs.k8s == 'true'
        run: |
          shellcheck .github/scripts/setup-talosctl.sh scripts/tests/test-setup-talosctl.sh
          bash scripts/tests/test-setup-talosctl.sh

      - name: 🔐 Validate Flux GHCR credential bridge
        # Pure local tests with fake ksail/docker/kubectl commands: no SOPS key,
        # registry credential, cluster access, or network is used.
        run: |
          bash -n \
            scripts/ghcr-auth-lib.sh \
            scripts/refresh-flux-ghcr-auth-safety.sh \
            scripts/refresh-flux-ghcr-auth.sh \
            scripts/run-ksail-prod-with-pull-auth.sh \
            scripts/use-prod-stable-api-endpoint.sh \
            scripts/tests/test-use-prod-stable-api-endpoint.sh \
            scripts/tests/test-refresh-flux-ghcr-auth-safety.sh
          shellcheck \
            scripts/ghcr-auth-lib.sh \
            scripts/refresh-flux-ghcr-auth-safety.sh \
            scripts/refresh-flux-ghcr-auth.sh \
            scripts/run-ksail-prod-with-pull-auth.sh \
            scripts/use-prod-stable-api-endpoint.sh \
            scripts/tests/test-use-prod-stable-api-endpoint.sh \
            scripts/tests/test-refresh-flux-ghcr-auth-safety.sh
          bash scripts/tests/test-use-prod-stable-api-endpoint.sh
          bash scripts/tests/test-refresh-flux-ghcr-auth-safety.sh
          go test -timeout=20m ./scripts/tests/refresh-flux-ghcr-auth

      - name: 🧩 Validate embedded JSON blobs
        # ConfigMaps that embed whole JSON documents as block scalars (e.g. the
        # Headlamp Kubescape exceptions ConfigMap's exceptionPolicies) are opaque
        # strings to schema validation, so a stray comma ships silently and only
        # surfaces at consumption time — where an empty exceptions view reads
        # identical to a clean posture. Pure Python stdlib, runs in under a
        # second, so it goes first — before the ksail download. See
        # scripts/validate-embedded-json.py (#2480).
        run: python3 scripts/validate-embedded-json.py

      - name: 🧷 Validate vendored operator Checkov dispositions
        if: needs.changes.outputs.k8s == 'true'
        # Exercise the annotator over multi-document fixtures, then prove the
        # committed bundles are the pinned upstream bytes plus only the
        # configured resource-scoped dispositions. Any other hand edit or a
        # vendor rename must fail offline.
        run: |
          bash -n scripts/update-vendored-operators.sh
          shellcheck scripts/update-vendored-operators.sh
          go test ./scripts/annotate-vendored-checkov
          scripts/update-vendored-operators.sh --validate-committed

      - name: 🔎 Validate Trivy ignore-file wiring
        if: needs.changes.outputs.k8s == 'true'
        # The path-scoped YAML format is not auto-loaded. Exercise the real
        # reproduction helper at its command boundary so a future argument
        # cleanup cannot silently turn every scoped disposition back on.
        run: bash scripts/tests/test-megalinter-scan-counts-ignorefile.sh

      - name: 🧱 Validate vendored-operator disposition boundary
        if: needs.changes.outputs.k8s == 'true'
        # The KubeVirt/CDI RBAC dispositions are path-scoped to those two
        # vendored bundles. If one ever loses its paths key or widens, the
        # same checks go quiet on the first-party cluster roles this
        # repository authors, where they are still open findings — and the
        # count would drop, which reads exactly like progress. yq-only
        # structural checks always run here; the trivy paired control runs
        # wherever trivy is installed.
        run: |
          shellcheck scripts/tests/test-trivyignore-vendored-operator-boundary.sh
          bash scripts/tests/test-trivyignore-vendored-operator-boundary.sh

      - name: 🧱 Validate vault-config identity disposition boundary
        if: needs.changes.outputs.k8s == 'true'
        # The KSV-0020 disposition on the vault-config Job is scoped by PATH, but the reason it
        # is accepted is per CONTAINER: only the two openbao containers run at the image-baked
        # uid 100, and the rest take the pod's high 65532 default. trivy cannot express that,
        # so a container added later at a low UID would be silently suppressed and the count
        # would simply not rise — which reads exactly like nothing happened. The premise is
        # asserted per container here; the paired trivy control runs wherever trivy is
        # installed and skips loudly where it is not.
        run: |
          shellcheck scripts/tests/test-trivyignore-vault-config-identity-boundary.sh
          bash scripts/tests/test-trivyignore-vault-config-identity-boundary.sh

      - name: 🧱 Validate vault-backup identity disposition boundary
        if: needs.changes.outputs.k8s == 'true'
        # The two workloads pin the same openbao digest: only snapshot may use its image-baked
        # UID/GID 100:1000, while mirror keeps the high pod default and receives group 1000 only
        # through fsGroup. The guard keeps both identity dispositions path-scoped and requires an
        # identical unlisted probe to stay reported.
        run: |
          shellcheck scripts/tests/test-trivyignore-vault-backup-identity-boundary.sh
          bash scripts/tests/test-trivyignore-vault-backup-identity-boundary.sh

      - name: 🧱 Validate first-party RBAC disposition premises
        if: needs.changes.outputs.k8s == 'true'
        # The four first-party RBAC dispositions rest on facts trivy cannot see: the tenant
        # role is only ever RoleBinding-bound, cluster-reader grants no write verb, and KRO
        # runs with no standing access. If one of those stops holding, the finding stays
        # suppressed while its reason is gone and the count never moves — so assert the
        # premises rather than the prose.
        run: |
          shellcheck scripts/tests/test-trivyignore-first-party-rbac-boundary.sh
          bash scripts/tests/test-trivyignore-first-party-rbac-boundary.sh

      - name: 🧱 Validate the tenant identity cannot write standard NetworkPolicies
        if: needs.changes.outputs.k8s == 'true'
        # Cilium unions standard NetworkPolicy allow rules with CiliumNetworkPolicy rules,
        # and restrict-tenant-network-policies constrains only the latter — so a write
        # grant on networkpolicies is a bypass of the whole tenant boundary. This renders
        # both providers' infrastructure layers and refuses any tenant-aggregated
        # ClusterRole granting a write verb on it (#3396).
        run: |
          shellcheck scripts/tests/test-tenant-edit-networkpolicy-write.sh
          bash scripts/tests/test-tenant-edit-networkpolicy-write.sh

      - name: 🧱 Validate ConfigMap sensitive-content disposition boundary
        if: needs.changes.outputs.k8s == 'true'
        # KSV-01010 matches key and value TEXT, so it cannot tell a public ACME contact
        # address from a credential. The three dispositioned ConfigMaps are excepted BY
        # PATH, and that is the whole safety property: if the scoping ever widened, an
        # application ConfigMap that genuinely embeds a secret would go quiet too, and the
        # count would simply drop — which reads exactly like progress. The paired control
        # scans the same bytes at an excepted and a non-excepted path, so only the path can
        # explain the difference. It skips where trivy is absent rather than passing blindly.
        run: |
          shellcheck scripts/tests/test-trivyignore-configmap-content-boundary.sh
          bash scripts/tests/test-trivyignore-configmap-content-boundary.sh

      - name: ⚙️ Setup Trivy for nested RGD templates
        if: needs.changes.outputs.k8s == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: 🔬 Validate nested RGD workload templates
        if: needs.changes.outputs.k8s == 'true'
        # Trivy does not descend through a ResourceGraphDefinition custom resource. Extract every
        # nested template, scan without the repository ignorefile, and compare complete findings,
        # resource-graph controls, and committed substitution inputs to the explicit ratchet. The
        # behavioral test also applies registry, placement, and policy-regression probes.
        run: |
          shellcheck scripts/scan-rgd-templates.sh scripts/tests/test-rgd-template-static-scan.sh
          bash scripts/tests/test-rgd-template-static-scan.sh

      - name: 🔢 Validate scanner version-drift guard
        if: needs.changes.outputs.k8s == 'true'
        # Guards the guard, offline. The live comparison runs on main
        # (validate-main.yaml) because it needs to read Actions logs, which a
        # fork PR's token cannot do — gating PRs on it would fail closed on
        # every fork. What is checked here is the parsing contract, whose
        # dangerous direction is a log-format change reading as "no drift".
        run: |
          shellcheck scripts/check-megalinter-version-drift.sh
          bash scripts/tests/test-check-megalinter-version-drift.sh

      - name: 🔐 Validate OpenBao OIDC admin role
        if: needs.changes.outputs.k8s == 'true'
        # bound_claims is a map. Passing JSON-looking text as one CLI argument
        # serializes it as a string and leaves the role unenforced.
        run: bash scripts/tests/test-openbao-oidc-role.sh

      - name: 🧯 Validate daily and break-glass API boundaries
        if: needs.changes.outputs.k8s == 'true'
        # Daily Kubernetes/Talos access must stay read-only, while the root
        # credentials remain explicit break-glass artifacts.
        run: bash scripts/tests/test-human-api-access-boundary.sh

      - name: 🧩 Validate Headlamp plugin removal
        if: needs.changes.outputs.k8s == 'true'
        # Removing runtime-downloaded plugins must also prune upgrade state and
        # preserve Crossview's authenticated fresh-install entry point.
        run: bash scripts/tests/test-headlamp-plugin-removal.sh

      - name: 🔑 Validate github-config Role covers the activated MR kinds
        if: needs.changes.outputs.k8s == 'true'
        # The tenant Role enumerates managed-resource kinds instead of `*`, so
        # activating a kind without granting it would fail at apply time inside
        # a separately published OCI artifact. Catch the divergence here. Bash,
        # yq and the runner's kubectl; no cluster or secrets required.
        run: |
          shellcheck scripts/tests/test-github-config-role-activation-parity.sh
          bash scripts/tests/test-github-config-role-activation-parity.sh

      - name: ⚖️ Install Kyverno CLI
        if: needs.changes.outputs.k8s == 'true'
        # Pinned to the version the cluster actually runs (the kyverno Helm
        # release is v1.18.2), so a policy that passes here is evaluated by the
        # same engine that admits it in production. Bump both together.
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: v1.18.2

      - name: 🔒 Validate Umami provisioning serialization
        if: needs.changes.outputs.k8s == 'true'
        run: |
          shellcheck scripts/tests/test-umami-provisioning-bootstrap.sh
          bash scripts/tests/test-umami-provisioning-bootstrap.sh

      - name: 🔐 Validate vault snapshots stay group-readable
        if: needs.changes.outputs.k8s == 'true'
        run: |
          shellcheck scripts/tests/test-vault-snapshot-group-readable.sh
          bash scripts/tests/test-vault-snapshot-group-readable.sh

      - name: ⚖️ Validate cluster policies
        if: needs.changes.outputs.k8s == 'true'
        # Runs the kyverno test fixtures under tests/. Until now nothing
        # executed them, so tests/validate-replica-floor had never actually run
        # in CI — a policy regression could ship green. No cluster or secrets
        # required; the CLI evaluates the committed ClusterPolicy files offline.
        run: |
          kyverno test ./tests
          shellcheck scripts/tests/test-restrict-tenant-secret-stores.sh
          bash scripts/tests/test-restrict-tenant-secret-stores.sh
          shellcheck scripts/tests/test-restrict-tenant-network-policies.sh
          bash scripts/tests/test-restrict-tenant-network-policies.sh
          shellcheck scripts/tests/test-restrict-homepage-service-groups.sh
          bash scripts/tests/test-restrict-homepage-service-groups.sh
