# Node and provider selectors are outside the tenant namespace boundary.
# Empty lists and nulls are paired with a valid endpoint selector, so only
# the forbidden field can explain their refusal.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-fromnodes-empty-selector
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromNodes:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-fromnodes-populated-selector
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-fromnodes-empty-list
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromNodes: []
      fromEndpoints:
        - matchLabels:
            app: db
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-fromnodes-null
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromNodes: null
      fromEndpoints:
        - matchLabels:
            app: db
---
