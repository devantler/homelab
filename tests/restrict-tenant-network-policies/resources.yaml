# ── DENY cases: a CIDRSet entry that names a GROUP instead of a cidr ─────────
# `cidrGroupRef` and `cidrGroupSelector` reference a cluster-scoped
# CiliumCIDRGroup. The presence check saw the entry; the floor and the
# deny-list read `.cidr` and saw nothing. A tenant cannot create groups but can
# name a platform one, and an empty selector names every group the platform
# ever adds. Each was measured ADMITTED before the whitelist landed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidrset-group-ref-egress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  egress:
    - toCIDRSet:
        - cidrGroupRef: platform-egress-targets
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidrset-group-selector-egress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  egress:
    - toCIDRSet:
        - cidrGroupSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidrset-group-ref-ingress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromCIDRSet:
        - cidrGroupRef: platform-ingress-sources
---
---
# ── DENY cases: a CIDRSet entry carrying BOTH a literal cidr AND a group ─────
# Cilium applies every populated source in a CIDRSet entry, so a harmless
# documentation `cidr` beside a `cidrGroupRef` — or beside an empty
# `cidrGroupSelector`, which names every group — still grants the group's
# ranges. A whitelist that only counts entries WITH a cidr admits these: the
# entry contributes one item to both sides of the count. Each was measured
# ADMITTED before the group fields were refused outright (Codex P2, #3616).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidrset-group-ref-beside-cidr-egress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  egress:
    - toCIDRSet:
        - cidr: 203.0.113.0/24
          cidrGroupRef: platform-egress-targets
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidrset-group-selector-beside-cidr-egress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  egress:
    - toCIDRSet:
        - cidr: 203.0.113.0/24
          cidrGroupSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidrset-group-ref-beside-cidr-ingress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromCIDRSet:
        - cidr: 203.0.113.0/24
          cidrGroupRef: platform-ingress-sources
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
