# ATTACK: the aggregate the per-entry floor cannot see — every /16 in turn.
# Each entry conforms; together they march across the family. Any such sweep
# contains a reserved block (here 0/8 and 10/8), which is what refuses it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: attack-cidr-every-slash16-v4-egress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  egress:
    - toCIDR:
        - 0.0.0.0/16
        - 1.0.0.0/16
        - 2.0.0.0/16
        - 3.0.0.0/16
        - 4.0.0.0/16
        - 5.0.0.0/16
        - 6.0.0.0/16
        - 7.0.0.0/16
        - 8.0.0.0/16
        - 9.0.0.0/16
        - 10.0.0.0/16
---
# ATTACK: the IPv6 aggregate — the same march, which necessarily crosses ::/8,
