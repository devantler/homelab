  name: attack-cidrset-group-selector-beside-cidr-ingress
  namespace: tenant-ns
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromCIDRSet:
        - cidr: 203.0.113.0/24
          cidrGroupSelector: {}
---
