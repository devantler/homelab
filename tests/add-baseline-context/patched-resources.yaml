---
apiVersion: v1
kind: Pod
metadata:
  name: plain
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions: {}
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions: {}
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
---
apiVersion: v1
kind: Pod
metadata:
  name: no-init
  namespace: velero
spec:
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions: {}
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
---
apiVersion: v1
kind: Pod
metadata:
  name: partial
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions:
          user: system_u
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions:
          user: system_u
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
---
apiVersion: v1
kind: Pod
metadata:
  name: podlevel
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
    seLinuxOptions:
      level: s9
      user: system_u
---
apiVersion: v1
kind: Pod
metadata:
  name: podlevel-partial
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
    seLinuxOptions:
      user: system_u
---
apiVersion: v1
kind: Pod
metadata:
  name: coroot-node-agent
  namespace: observability
spec:
  hostPID: true
  volumes:
    - name: host-sys
      hostPath:
        path: /sys
  initContainers:
    - name: init
      image: ghcr.io/coroot/coroot-node-agent:v1.0.0
      securityContext:
        seLinuxOptions: {}
  containers:
    - name: node-agent
      image: ghcr.io/coroot/coroot-node-agent:v1.0.0
      securityContext:
        seLinuxOptions: {}
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-deploy
  namespace: observability
spec:
  selector:
    matchLabels:
      app: operator-deploy
  template:
    metadata:
      labels:
        app: operator-deploy
    spec:
      initContainers:
        - name: init
          image: ghcr.io/coroot/coroot-operator:1.9.5
          securityContext:
            seLinuxOptions: {}
      containers:
        - name: operator
          image: ghcr.io/coroot/coroot-operator:1.9.5
          securityContext:
            seLinuxOptions: {}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: server-sts
  namespace: observability
spec:
  serviceName: server-sts
  selector:
    matchLabels:
      app: server-sts
  template:
    metadata:
      labels:
        app: server-sts
    spec:
      containers:
        - name: server
          image: ghcr.io/coroot/coroot:1.22.2
          securityContext:
            seLinuxOptions: {}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: manager-ds
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app: manager-ds
  template:
    metadata:
      labels:
        app: manager-ds
    spec:
      containers:
        - name: manager
          image: longhornio/longhorn-manager:v1.9.0
          securityContext:
            privileged: true
            seLinuxOptions: {}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cronjob
  namespace: observability
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: init
              image: ghcr.io/coroot/coroot:1.22.2
              securityContext:
                seLinuxOptions: {}
          containers:
            - name: job
              image: ghcr.io/coroot/coroot:1.22.2
              securityContext:
                seLinuxOptions: {}
          securityContext:
            fsGroupChangePolicy: OnRootMismatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podlevel-deploy
  namespace: velero
spec:
  selector:
    matchLabels:
      app: podlevel-deploy
  template:
    metadata:
      labels:
        app: podlevel-deploy
    spec:
      securityContext:
        seLinuxOptions:
          user: system_u
          level: s9
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init
          image: velero/velero:v1.16.0
      containers:
        - name: velero
          image: velero/velero:v1.16.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podlevel-partial-deploy
  namespace: velero
spec:
  selector:
    matchLabels:
      app: podlevel-partial-deploy
  template:
    metadata:
      labels:
        app: podlevel-partial-deploy
    spec:
      securityContext:
        seLinuxOptions:
          user: system_u
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init
          image: velero/velero:v1.16.0
      containers:
        - name: velero
          image: velero/velero:v1.16.0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oneshot-job
  namespace: observability
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: ghcr.io/coroot/coroot:1.22.2
          securityContext:
            seLinuxOptions: {}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podlevel-partial-cronjob
  namespace: velero
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seLinuxOptions:
              user: system_u
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: init
              image: velero/velero:v1.16.0
          containers:
            - name: velero
              image: velero/velero:v1.16.0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podlevel-cronjob
  namespace: velero
spec:
  schedule: "0 5 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seLinuxOptions:
              user: system_u
              level: s9
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: velero
              image: velero/velero:v1.16.0
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-override
  namespace: velero
spec:
  securityContext:
    seLinuxOptions:
      user: system_u
      level: s9
    fsGroupChangePolicy: OnRootMismatch
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions: {}
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions: {}
    - name: plain
      image: velero/velero:v1.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: empty-override-deploy
  namespace: velero
spec:
  selector:
    matchLabels:
      app: empty-override-deploy
  template:
    metadata:
      labels:
        app: empty-override-deploy
    spec:
      securityContext:
        seLinuxOptions:
          user: system_u
          level: s9
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init
          image: velero/velero:v1.16.0
          securityContext:
            seLinuxOptions: {}
      containers:
        - name: velero
          image: velero/velero:v1.16.0
          securityContext:
            seLinuxOptions: {}
        - name: plain
          image: velero/velero:v1.16.0
