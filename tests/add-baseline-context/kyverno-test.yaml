---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-baseline-context-optin
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/add-security-context.yaml
resources:
  - resources.yaml
# Declares the namespace labels the namespaceSelector matches on. Without it the
# CLI reports every resource "Excluded" and the fixture passes vacuously —
# including the default-off control, which would then prove nothing.
variables: values.yaml
results:
  # ON state: an opted-in namespace gets both fields, pod level and every
  # container/initContainer.
  - policy: add-security-context
    rule: add-baseline-context-optin-namespaces
    resources:
      - velero/plain
      - velero/no-init
      - velero/partial
      - velero/podlevel
      - velero/podlevel-partial
      - observability/coroot-node-agent
    kind: Pod
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-containers
    resources:
      - velero/plain
      - velero/no-init
      - observability/coroot-node-agent
    kind: Pod
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-namespaces
    resources:
      - chaos-mesh/unlabelled
      - velero/preset
    kind: Pod
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-containers
    resources:
      - chaos-mesh/unlabelled
      - velero/partial
      - velero/preset
      - velero/podlevel
      - velero/podlevel-partial
    kind: Pod
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - observability/operator-deploy
    kind: Deployment
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - observability/server-sts
    kind: StatefulSet
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - longhorn-system/manager-ds
    kind: DaemonSet
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - observability/operator-deploy
    kind: Deployment
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - observability/server-sts
    kind: StatefulSet
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - longhorn-system/manager-ds
    kind: DaemonSet
    result: pass
    patchedResources: patched-resources.yaml
  # ON state, jobTemplate path.
  - policy: add-security-context
    rule: add-baseline-context-optin-cronjobs
    resources:
      - observability/nightly-cronjob
    kind: CronJob
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-cronjobs-containers
    resources:
      - observability/nightly-cronjob
    kind: CronJob
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - velero/podlevel-deploy
      - velero/podlevel-partial-deploy
    kind: Deployment
    result: pass
    patchedResources: patched-resources.yaml
  # OFF state and anchor preservation at controller scope.
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - chaos-mesh/unlabelled-deploy
      - velero/preset-deploy
    kind: Deployment
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - chaos-mesh/unlabelled-deploy
      - velero/preset-deploy
      - velero/podlevel-deploy
      - velero/podlevel-partial-deploy
    kind: Deployment
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - observability/oneshot-job
    kind: Job
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - observability/oneshot-job
    kind: Job
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-cronjobs
    resources:
      - velero/podlevel-partial-cronjob
      - velero/podlevel-cronjob
    kind: CronJob
    result: pass
    patchedResources: patched-resources.yaml
  - policy: add-security-context
    rule: add-baseline-context-optin-cronjobs-containers
    resources:
      - velero/podlevel-partial-cronjob
      - velero/podlevel-cronjob
    kind: CronJob
    result: skip
  # The pod-rule label alone reaches no controller.
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - kubescape/podlabel-only-deploy
    kind: Deployment
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - kubescape/podlabel-only-deploy
    kind: Deployment
    result: skip
  # Explicit empty container overrides are preserved unchanged.
  - policy: add-security-context
    rule: add-baseline-context-optin-containers
    resources:
      - velero/empty-override
    kind: Pod
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers-containers
    resources:
      - velero/empty-override-deploy
    kind: Deployment
    result: skip
  - policy: add-security-context
    rule: add-baseline-context-optin-controllers
    resources:
      - velero/empty-override-deploy
    kind: Deployment
    result: pass
    patchedResources: patched-resources.yaml
