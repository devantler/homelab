metadata:
  name: general-podlevel
  namespace: default
spec:
  securityContext:
    seLinuxOptions:
      user: system_u
      level: s9
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Runtime default and inheritance regression.
apiVersion: v1
kind: Pod
